# Climate reference data for Wallonia, seeded into
# regions.settings["climate"] by db/seeds/40_climate.rb and read by
# Providers::Climate::Static.
#
# Everything here is INDICATIVE: one rounded value per natural region, not
# a measurement for a given parcel. Each value is computed from the
# stations listed under `stations` and documented under `references`
# (sources, station values, method), so that anyone can check it. Outlines
# are deliberately coarse (a few vertices); the first sub-area containing
# the point wins, the `default: true` one covers the rest.
#
# Units: °C, mm, days. Rounding: temperatures to 0.5 °C, rainfall to 50
# mm, frost days to 5. frost_days = days whose minimum is below 0 °C
# (Météo-France counts "at or below", about 2 days more a year).
# last_spring_frost / first_autumn_frost = "MM-DD": median dates where we
# computed them from daily data, mean dates where the publisher gives
# means (IRM), 0 to 4 days apart. extreme_min_c = average annual extreme
# minimum temperature (coldest night of the year, averaged), the basis of
# the USDA hardiness zone.
version: 1
status: indicative
reference_period: "1991-2020"
providers:
  normals: static
  projections: static
  forecast: open_meteo
note: >-
  Valeurs arrondies par Semisto à partir des stations de l'IRM (le détail
  est dans les sources) : un ordre de grandeur par grande région naturelle,
  pas une mesure pour ta parcelle. Les limites des zones sont
  approximatives.

