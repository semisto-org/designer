# Changes against the reference period, as [low, central, high]. Same
# deltas for the whole region (the spread between models is larger than
# the spread between Walloon sub-areas). Rounded syntheses, see `sources`.
projections:
  reference_period: "1991-2020"
  sources: [irm_report_2020, cordex_be, euro_cordex, ipcc_ar6]
  scenarios:
    moderate:
      ipcc: "RCP4.5 / SSP2-4.5"
    high:
      ipcc: "RCP8.5 / SSP5-8.5"
  horizons:
    "2050":
      period: "2041-2060"
      moderate:
        mean_temp_delta_c: [0.8, 1.3, 2.0]
        extreme_min_delta_c: [1.0, 2.0, 3.0]
        summer_temp_delta_c: [0.8, 1.5, 2.5]
        summer_precip_change_pct: [-15, -5, 5]
        winter_precip_change_pct: [0, 5, 10]
      high:
        mean_temp_delta_c: [1.2, 1.8, 2.6]
        extreme_min_delta_c: [1.5, 2.5, 4.0]
        summer_temp_delta_c: [1.2, 2.0, 3.2]
        summer_precip_change_pct: [-20, -10, 0]
        winter_precip_change_pct: [0, 7, 15]
    "2080":
      period: "2071-2100"
      moderate:
        mean_temp_delta_c: [1.3, 2.0, 3.0]
        extreme_min_delta_c: [1.5, 3.0, 4.5]
        summer_temp_delta_c: [1.5, 2.5, 3.5]
        summer_precip_change_pct: [-20, -10, 0]
        winter_precip_change_pct: [0, 8, 15]
      high:
        mean_temp_delta_c: [2.5, 3.5, 5.0]
        extreme_min_delta_c: [3.0, 5.0, 7.5]
        summer_temp_delta_c: [2.5, 4.0, 6.0]
        summer_precip_change_pct: [-35, -20, -5]
        winter_precip_change_pct: [5, 12, 25]
