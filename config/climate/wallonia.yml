# Changes against the reference period, as [low, central, high]. Same
# deltas for the whole region (the spread between models is larger than
# the spread between Walloon sub-areas; the Ardenne warms slightly more).
# Each value is checked against the CMIP6 country aggregate of the World
# Bank Climate Change Knowledge Portal (CC BY 4.0) and cross-checked with
# KNMI'23 and CORDEX.be; see `references` under each scenario.
projections:
  reference_period: "1991-2020"
  sources: [cckp_cmip6, knmi23, cordex_be, irm_report_2020, ipcc_ar6]
  scenarios:
    moderate:
      ipcc: "RCP4.5 / SSP2-4.5"
    high:
      ipcc: "RCP8.5 / SSP5-8.5"
  horizons:
    "2050":
      period: "2041-2060"
      moderate:
        mean_temp_delta_c: [0.8, 1.3, 2.2]
