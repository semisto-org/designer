# Climate reference data for metropolitan France and Corsica, seeded into
# regions.settings["climate"] by db/seeds/40_climate.rb and read by
# Providers::Climate::Static.
#
# Everything here is INDICATIVE: values are rounded by Semisto from the
# published syntheses listed under `sources`, to give a coarse order of
# magnitude per broad climate area, for low and middle altitudes. They are
# not station data and not a forecast for a given parcel. Outlines are
# deliberately coarse (a few vertices); the first sub-area containing the
# point wins (mountains first), the `default: true` one covers the rest.
#
# Units: °C, mm, days; dates as "MM-DD" (median date, indicative).
# extreme_min_c = average annual extreme minimum temperature (coldest
# night of the year, averaged), the basis of the USDA hardiness zone.
version: 1
status: indicative
reference_period: "1991-2020"
providers:
  normals: static
  projections: static
  forecast: open_meteo
note: >-
  Valeurs arrondies par Semisto à partir des synthèses citées : un ordre de
  grandeur par grande zone climatique, pour les altitudes basses et moyennes,
  pas une mesure pour votre parcelle. Les limites des zones sont
  approximatives, et en montagne l'altitude compte plus que la zone.

sources:
  - key: meteofrance_normals
    title: "Normales climatologiques 1991-2020 (fiches par station et cartes de France)"
    publisher: "Météo-France"
    year: 2021
    url: "https://meteofrance.com"
    used_for: normals
  - key: drias_2020
    title: "DRIAS 2020 : projections climatiques régionalisées pour la France (EURO-CORDEX corrigées)"
    publisher: "Météo-France, IPSL, CERFACS (portail DRIAS)"
    year: 2020
    url: "https://www.drias-climat.fr"
    used_for: projections
  - key: tracc
    title: "Trajectoire de réchauffement de référence pour l'adaptation au changement climatique (TRACC) : +2 °C en 2030, +2,7 °C en 2050, +4 °C en 2100 en France métropolitaine, par rapport à l'ère préindustrielle"
    publisher: "Ministère de la Transition écologique"
    year: 2024
    url: null
    used_for: projections
  - key: euro_cordex
    title: "EURO-CORDEX: new high-resolution climate change projections for European impact research (Jacob et al., Regional Environmental Change 14, p. 563-578)"
    publisher: "EURO-CORDEX"
    year: 2014
    url: "https://doi.org/10.1007/s10113-013-0499-2"
    used_for: projections
  - key: ipcc_ar6
    title: "Sixième rapport d'évaluation, groupe I : Atlas interactif (régions Europe de l'Ouest et centrale, Méditerranée) et chapitre 11 (extrêmes)"
    publisher: "GIEC (IPCC)"
    year: 2021
    url: "https://interactive-atlas.ipcc.ch"
    used_for: projections
  - key: usda_zones
    title: "Plant Hardiness Zone Map : définition des zones de rusticité (minimum annuel moyen, par tranches de 10 °F)"
    publisher: "USDA Agricultural Research Service"
    year: 2023
    url: "https://planthardiness.ars.usda.gov"
    used_for: zones
  - key: heinze_schreiber
    title: "Eine neue Kartierung der Winterhärtezonen für Gehölze in Mittel- und Westeuropa (Heinze et Schreiber, Mitteilungen der Deutschen Dendrologischen Gesellschaft 75)"
    publisher: "Deutsche Dendrologische Gesellschaft"
    year: 1984
    url: null
    used_for: zones

