# Changes against the reference period, as [low, central, high]. Same
# deltas for the whole country: the spread between models is larger than
# the spread between areas, except for summer rainfall, which drops more in
# the south (the central value here is a national middle). Rounded
# syntheses, see `sources`; consistent with the TRACC (about +1 °C in 2050
# and +2.3 °C in 2100 over 1991-2020 under the reference trajectory).
projections:
  reference_period: "1991-2020"
  sources: [drias_2020, tracc, euro_cordex, ipcc_ar6]
  scenarios:
    moderate:
      ipcc: "RCP4.5 / SSP2-4.5"
    high:
      ipcc: "RCP8.5 / SSP5-8.5"
  horizons:
    "2050":
      period: "2041-2060"
      moderate:
        mean_temp_delta_c: [0.8, 1.4, 2.0]
        extreme_min_delta_c: [1.0, 2.0, 3.0]
        summer_temp_delta_c: [0.9, 1.7, 2.7]
        summer_precip_change_pct: [-20, -8, 5]
        winter_precip_change_pct: [-5, 5, 12]
      high:
        mean_temp_delta_c: [1.2, 1.9, 2.7]
        extreme_min_delta_c: [1.5, 2.5, 4.0]
        summer_temp_delta_c: [1.3, 2.3, 3.5]
        summer_precip_change_pct: [-25, -12, 0]
        winter_precip_change_pct: [-5, 7, 15]
    "2080":
      period: "2071-2100"
      moderate:
        mean_temp_delta_c: [1.3, 2.1, 3.0]
        extreme_min_delta_c: [1.5, 3.0, 4.5]
        summer_temp_delta_c: [1.5, 2.7, 3.8]
        summer_precip_change_pct: [-25, -12, 0]
        winter_precip_change_pct: [-5, 7, 15]
      high:
        mean_temp_delta_c: [2.6, 3.7, 5.2]
        extreme_min_delta_c: [3.0, 5.0, 7.5]
        summer_temp_delta_c: [2.8, 4.5, 6.5]
        summer_precip_change_pct: [-40, -25, -10]
        winter_precip_change_pct: [0, 10, 25]
