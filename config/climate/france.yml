# Changes against the reference period, as [low, central, high]. Same
# deltas for the whole country: the spread between models is larger than
# the spread between areas, except for summer rainfall, which drops more in
# the south (the central value here is a national middle). Each value is
# checked against the CMIP6 country aggregate of the World Bank Climate
# Change Knowledge Portal (CC BY 4.0) and DRIAS 2020 brought back to
# 1991-2020; see `references` under each scenario. Consistent with the
# TRACC: +1.3 °C in 2050 and +2.6 °C in 2100 over 1991-2020 (Météo-France
# puts 1991-2020 at +1.4 °C over the early 20th century).
projections:
  reference_period: "1991-2020"
  sources: [cckp_cmip6, drias_2020, tracc, tracc_meteofrance, ipcc_ar6]
  scenarios:
    moderate:
      ipcc: "RCP4.5 / SSP2-4.5"
    high:
      ipcc: "RCP8.5 / SSP5-8.5"
  horizons:
    "2050":
      period: "2041-2060"
      moderate:
        mean_temp_delta_c: [0.8, 1.4, 2.2]
        extreme_min_delta_c: [1.0, 2.5, 4.0]
        summer_temp_delta_c: [1.0, 1.8, 2.7]
        summer_precip_change_pct: [-20, -8, 5]
        winter_precip_change_pct: [-5, 6, 15]
        references:
          mean_temp_delta_c: "CMIP6, Banque mondiale CCKP (France, 2040-2059, écart à 1995-2014, percentiles 10 / 50 / 90) : [0,9 ; 1,4 ; 2,4] °C. DRIAS 2020, ramené à 1991-2020 (-0,6 °C) : [0,3 ; 1,0 ; 1,5] °C. TRACC mise à l'échelle : [0,7 ; 1,3 ; 2,0] °C."
          extreme_min_delta_c: "Médiane CMIP6 de la nuit la plus froide (TNn) : 2,8 °C, arrondie ; bornes = 1,5 × la borne basse et 1,8 × la borne haute de la moyenne annuelle, faute de percentiles fiables. Le GIEC (AR6, chap. 11.3.5) établit que les nuits les plus froides se réchauffent plus vite que la moyenne."
