test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# S3-compatible object storage (Hetzner Object Storage, Scaleway Object Storage,
# MinIO, AWS…) for photos, lab reports and rasters. Used in production as soon
# as S3_BUCKET is set (config/environments/production.rb); everything comes
# from the environment:
#
#   S3_ENDPOINT           https://fsn1.your-objectstorage.com   (Hetzner)
#                         https://s3.fr-par.scw.cloud           (Scaleway)
#   S3_REGION             fsn1 / fr-par / nl-ams …
#   S3_BUCKET             designer-media
#   S3_ACCESS_KEY_ID      \
#   S3_SECRET_ACCESS_KEY  /  an access key limited to that bucket
#   S3_FORCE_PATH_STYLE   "true" (default) or "false" for virtual-hosted style
#
# Files are private: the app checks the map role, then redirects to a short
# lived presigned URL (see Maps::PhotosController#image).
#
# The two checksum settings stop the AWS SDK from adding the CRC32 trailer
# checksums introduced in 2025, which most S3-compatible stores reject.
object_storage:
  service: S3
  endpoint: <%= ENV["S3_ENDPOINT"] %>
  region: <%= ENV.fetch("S3_REGION", "us-east-1") %>
  bucket: <%= ENV["S3_BUCKET"] %>
  access_key_id: <%= ENV["S3_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["S3_SECRET_ACCESS_KEY"] %>
  force_path_style: <%= ENV.fetch("S3_FORCE_PATH_STYLE", "true") != "false" %>
  request_checksum_calculation: when_required
  response_checksum_validation: when_required

# Use bin/rails credentials:edit to set the AWS secrets (as aws:access_key_id|secret_access_key)
# amazon:
#   service: S3
#   access_key_id: <%= Rails.application.credentials.dig(:aws, :access_key_id) %>
#   secret_access_key: <%= Rails.application.credentials.dig(:aws, :secret_access_key) %>
#   region: us-east-1
#   bucket: your_own_bucket-<%= Rails.env %>

# Remember not to checkin your GCS keyfile to a repository
# google:
#   service: GCS
#   project: your_project
#   credentials: <%= Rails.root.join("path/to/gcs.keyfile") %>
#   bucket: your_own_bucket-<%= Rails.env %>

