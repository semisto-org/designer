# « Présentation de pré-design »: the sequence Semisto's design office walks a
# client through (drawn from the Barsy pre-design, September 2026). Each step
# names the view it opens; titles and presenter notes are interface copy, in
# config/locales/presentations.fr.yml under presentations.templates.pre_design.
#
#   panel:   the editor panel opened (map/panels/index.ts ids)
#   layers:  the design layers shown (the others are hidden); absent = all
#   strata:  the plant strata shown; absent = all
#   sectors: the sector groups kept around the terrain; absent = none
#   moment:  the time strip (arrival, today, year5, year15, year30)
#   shade:   the noon shade drawn (june, december)
#   relief:  shown in the 3D relief instead (tab: view, rain, sun, night)
steps:
  - key: project
    panel: project
    layers: [existing]
  - key: microclimates
    layers: [existing, water]
    relief:
      tab: night
  - key: sun
    panel: sun
    layers: [existing]
    sectors: [sun]
    shade: december
  - key: soil
    panel: soil
    layers: [existing]
  - key: water_slope
    layers: [existing, water]
  - key: wind
    layers: [existing]
    sectors: [wind]
  - key: access
    layers: [existing, access]
  - key: views
    layers: [existing]
    sectors: [views, nuisances]
  - key: flora_fauna
    panel: photos
    layers: [existing]
    sectors: [wildlife]
  - key: functions
    panel: functions
  - key: sketch
  - key: earthworks
    panel: earthworks
    layers: [existing, water, access]
  - key: water_design
    panel: water-sources
    layers: [existing, water, networks]
  - key: structures
    layers: [existing, access, structures]
  - key: strata_low
    layers: [existing, structures, plants]
    strata: [herbaceous, ground_cover, root, vine, aquatic]
  - key: strata_middle
    layers: [existing, structures, plants]
    strata: [shrub, sub_canopy]
  - key: strata_high
    layers: [existing, structures, plants]
    strata: [canopy]
  - key: screens
    layers: [existing, structures, plants]
    moment: year5
    shade: december
  - key: zones
    panel: zones
  - key: flows
    layers: [existing, access, structures]
  - key: synthesis
    moment: year15
  - key: next_steps
  - key: budget
    panel: plant-list
