# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # Yearly pass renewal reminders (30 days, 7 days, expiry) and old webhook payloads.
  billing_daily:
    class: BillingDailyJob
    queue: default
    schedule: every day at 8am
  # Billit invoices (Belgian businesses, over Peppol) that a lost job or an
  # unreachable Billit left behind, and the delivery of those sent.
  billit_backfill:
    command: "BillitJob.backfill"
    schedule: every 10 minutes
  # Copy of the day's new files to the backup bucket (BACKUP_S3_*), before the
  # database backup of 3am.
  file_backup:
    class: FileBackupJob
    queue: default
    schedule: every day at 2am
  # Camera metadata and the viewer's « large » variant for photos never read
  # (uploaded before PhotoCameraJob existed, or whose job was lost).
  photo_camera_backfill:
    command: "PhotoCameraJob.backfill"
    schedule: every 10 minutes
  # First-page thumbnails of PDFs that arrived without one (sent through the
  # MCP server, or uploaded before the server drew them).
  map_document_thumbnail_backfill:
    command: "MapDocumentThumbnailJob.backfill"
    schedule: every 10 minutes
  # Main photo of each catalogue species, from Wikimedia Commons, a few
  # species at a time (a species without a free image is retried monthly).
  plant_photo_backfill:
    command: "PlantPhotoJob.backfill"
    schedule: every 15 minutes
  # Files an AI sent through the MCP server (create_upload) and never attached.
  mcp_upload_purge:
    class: McpUploadPurgeJob
    queue: default
    schedule: every hour at minute 37
  # Map elements deleted more than 30 days ago (the trash « Annuler » restores from).
  map_feature_trash_purge:
    command: "MapFeature.purge_trash"
    schedule: every day at 4am
  # « Et chez toi ? »: trials not kept within 48 hours.
  map_trials_sweep:
    command: "MapTrial.expired.delete_all"
    schedule: every day at 4:30am
