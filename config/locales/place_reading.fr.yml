fr:
  place_reading:
    title: "Voici ton lieu"
    intro: "Avant de dessiner quoi que ce soit, voici ce que Terranova lit déjà de ton terrain, d'après le relief de ta région."
    open:
      relief: "Voir le relief"
      water: "Voir où va l'eau"
      sun: "Voir le soleil"
    low_point: "Montrer le point bas"
    outside:
      title: "Ce que les cartes ne savent pas"
      body: "Ces lignes viennent d'un modèle, juste à quelques mètres près. Ce que ton terrain fait vraiment, toi seul peux le voir : où l'eau reste après une pluie, où le givre tient le matin, ce qui pousse tout seul."
      note: "Va y faire un tour cette semaine, téléphone en poche."
    tour: "Lire le carnet de route"
    start: "Commencer"
    reopen: "Relire « Voici ton lieu »"
    missions:
      title: "Trois choses à aller voir"
      done_title: "Ton lieu, vu par toi"
      done_body: "Les trois sont faites : ta carte sait maintenant ce que les modèles ne savaient pas. Tes observations guident la suite du design, et ton IA les lit aussi."
      progress: "%{done} sur 3"
      open: "Voir les missions"
      done: "Fait"
      todo: "À faire"
      water:
        title: "L'eau"
        body: "Après une pluie, va voir où l'eau reste ou s'écoule. Commence par le point bas : est-ce bien là qu'elle se rassemble ?"
        done: "Vu : la carte sait où va l'eau."
      season:
        title: "La saison"
        body: "Note un signe de la saison là où tu le vois. Ce mois-ci : %{signs}."
        done: "Noté dans ton carnet des saisons."
      living:
        title: "Le vivant"
        body: "Photographie 3 plantes qui poussent toutes seules. Elles disent beaucoup de ton sol."
        count: "%{count} sur %{target}"
        done: "Tes plantes spontanées parlent de ton sol."
      phone:
        title: "Emporte-les dehors"
        body: "Scanne ce code avec ton téléphone : les missions s'ouvrent sur ta carte. Dans l'app Terranova, elles t'attendent aussi."
        small: "Dans l'app Terranova, sur ton téléphone, ces missions t'attendent sur ta carte."
        alt: "Code QR vers ta carte sur le téléphone"
