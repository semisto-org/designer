      refused: "Je ne peux pas répondre à cette demande."
      failed: "Quelque chose s'est mal passé de mon côté et je n'ai pas pu finir. L'équipe de Semisto est prévenue ; tu peux me redemander."
      empty: "J'ai regardé, mais je n'ai rien à ajouter."
