      nothing_yet: "je commençais à peine"
      limit_reached: "J'ai atteint la limite de travail d'une demande avant d'avoir fini. Dis-moi par quoi continuer, en une demande plus ciblée."
      cut_short: "(Ma réponse a été coupée : j'ai atteint la longueur maximale d'une réponse.)"
      key_refused: "La clé API de l'équipe est refusée par le fournisseur. Un admin de l'équipe peut la remplacer sur ma page."
