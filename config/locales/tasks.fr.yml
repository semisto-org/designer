      open_map_tasks: "Tâches de la carte"
    # Default lists, one per step of the journey (TaskList::Defaults).
    defaults:
      observe:
        name: "Observer le lieu"
        tasks:
          project_sheet:
            title: "Remplir la fiche projet"
            notes: "Qui porte le projet, ce qu'il en attend, le temps et le budget disponibles : tout le design en découle."
          seasons_walk:
            title: "Parcourir le terrain à chaque saison"
            notes: "Une balade par saison, avec des photos aux mêmes endroits. L'ombre de décembre n'est pas celle de juin."
          water_reading:
            title: "Repérer d'où vient l'eau et où elle stagne"
            notes: "Par forte pluie, observe où l'eau entre, ruisselle et s'arrête. Le relief de la carte aide à le comprendre."
          soil_test:
            title: "Faire un test de sol"
            notes: "Un trou à la bêche, un test du bocal et les plantes bio-indicatrices disent déjà beaucoup de ton sol."
          sun_and_wind:
            title: "Noter les ombres et les vents dominants"
            notes: "D'où vient le vent froid, où l'ombre tombe en hiver : la structure se placera en fonction."
      map:
        name: "Cartographier l'existant"
        tasks:
          boundary:
            title: "Dessiner le contour du terrain"
            notes: "Le contour donne la surface et permet à la carte de lire le relief, le sol et le climat du lieu."
          existing:
            title: "Relever les arbres, haies et bâtiments déjà là"
            notes: "Un arbre adulte a des années d'avance : on conçoit autour de lui, jamais à sa place."
          access_networks:
            title: "Placer les accès et les réseaux existants"
            notes: "Portails, chemins, conduites d'eau, câbles : mieux vaut les connaître avant de creuser."
      design:
        name: "Concevoir"
        tasks:
          water:
            title: "Concevoir la gestion de l'eau"
            notes: "Ralentir, infiltrer, stocker : baissières, mares, récupération des toitures. L'eau avant les plantes."
          access:
            title: "Tracer les chemins et les accès"
            notes: "Les chemins suivent le relief et l'eau. Pense à la brouette et au véhicule du chantier."
          structure:
            title: "Placer la structure : grands arbres et haies"
            notes: "Les grands arbres et les haies brise-vent d'abord, en pensant à leur taille dans 15 et 30 ans."
          palette:
            title: "Choisir la palette végétale"
            notes: "Plusieurs espèces pour chaque fonction, des floraisons étalées, des familles variées."
          validate:
            title: "Valider le design avec le porteur de projet"
            notes: "Partage la carte et recueille ses remarques dans les discussions avant de commander."
      plant:
        name: "Planter"
        tasks:
          plant_list:
            title: "Établir la liste de plants et commander"
            notes: "La liste de plants se calcule depuis la carte. Commande tôt : les pépinières se vident à l'automne."
          soil_preparation:
            title: "Préparer le sol"
            notes: "Couvrir le sol quelques mois avant (carton, broyat, engrais verts) pour planter dans un sol vivant."
          worksite:
            title: "Organiser le chantier de plantation"
            notes: "Date, outils, paillage, repas, bénévoles : un chantier participatif se prépare quelques semaines à l'avance."
          planting:
            title: "Planter et pailler"
            notes: "De novembre à mars, hors gel. Un paillage épais au pied de chaque plant garde l'humidité."
          aftercare:
            title: "Suivre et arroser la première année"
            notes: "La première année décide de tout : arrosages pendant les sécheresses, désherbage autour des jeunes plants."
    # « À faire » on the sheet of an element in the editor: the tasks about it.
    feature_section:
      title: "À faire"
      empty: "Rien à faire ici pour l'instant. Une taille, une protection à changer, un tuteur à reprendre : note-le, la tâche rejoindra la page « Tâches »."
      add: "Ajouter une tâche"
      title_placeholder: "Tailler, recouper les gourmands…"
      list: "Dans la liste"
      save: "Ajouter"
      added: "Tâche ajoutée."
      done_count:
        one: "1 tâche faite"
        other: "%{count} tâches faites"
      also: "Concerne aussi : %{labels}"
      open_all: "Voir toutes les tâches"
  task_mailer:
    assigned:
      subject: "%{assigner} t'a confié une tâche sur « %{map} »"
      greeting: "Bonjour,"
      body: "%{assigner} t'a confié une tâche sur la carte « %{map} » :"
      due: "À faire pour le %{date}."
      button: "Voir les tâches de la carte"
      invited: "Accepte d'abord l'invitation avec ce lien, en créant ton compte si tu n'en as pas encore : la tâche t'attendra dans tes tâches."
      join_button: "Accepter l'invitation"
      footer: "Tu reçois ce message parce qu'une tâche t'a été assignée dans Semisto Terranova."
