# One-off import of Semisto's project photos from Immich into Designer maps:
# bin/rails immich:albums, bin/rails immich:import (lib/tasks/immich.rake,
# app/services/imports/immich, docs/import-immich.md).
fr:
  immich_import:
    errors:
      not_configured: "Donne l'adresse d'Immich et une clé : IMMICH_URL=https://… IMMICH_API_KEY=…"
      album_missing: "Donne l'album à importer : ALBUM=… (son identifiant, voir bin/rails immich:albums)."
      unauthorized: "Immich refuse la clé (HTTP %{status}) sur %{url} : vérifie IMMICH_API_KEY et ses permissions (asset.read, asset.download, album.read)."
      unavailable: "Immich ne répond pas comme prévu sur %{url} (%{detail})."
      unreadable: "Réponse illisible d'Immich sur %{url}."
      not_a_project_album: "L'album « %{name} » n'est pas un album de projet (son nom ne commence pas par %{mark}) : rien n'est importé. FORCE=1 pour l'importer quand même."
      too_large: "Fichier trop lourd (plus de %{max} Mo) : %{url}"

    albums:
      none: "Aucun album de projet visible avec cette clé."
      left_out: "%{count} album(s) sans %{mark} en tête de leur nom laissé(s) de côté (ALL=1 pour les voir)."
      line: "« %{name} » (%{id}) : %{count} éléments, dont %{located} avec position GPS"
      line_error: "« %{name} » : %{message}"
      no_map: "    aucune carte ne contient ces positions"
      map: "    carte n° %{id} « %{name} » : %{count} photo(s) dans son contour"
      command: "    → bin/rails immich:import ALBUM=%{album} MAP_ID=%{map}"

    summary:
      title: "Album « %{album} » → carte n° %{id} « %{map} »"
      title_dry_run: "Essai à blanc (rien n'est écrit) : album « %{album} » → carte n° %{id} « %{map} »"
      created: "  %{count} photo(s) ajoutée(s)"
      planned: "  %{count} photo(s) à importer"
      known: "  %{count} photo(s) déjà importée(s)"
      duplicate: "  %{count} photo(s) déjà sur la carte (même fichier)"
      video: "  %{count} vidéo(s) laissée(s) de côté"
      failed: "  %{count} photo(s) en échec :"
      located: "  dont %{count} placée(s) sur la carte grâce au GPS"
      nothing: "  album vide"
