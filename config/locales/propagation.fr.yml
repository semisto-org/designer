  propagation_request_mailer:
    received:
      subject: "%{requester} aimerait multiplier une de tes plantes : %{plant}"
      greeting: "Bonjour %{name},"
      body: "%{requester} a vu sur Terranova que tu as « %{plant} » en terre sur « %{map} » et te demande : %{material}."
      privacy: "Tu ne connais pas encore son adresse e-mail, et elle ne connaît pas la tienne : si tu acceptes, vous la recevrez chacun pour vous organiser. Tu peux aussi décliner, sans te justifier."
      button: "Répondre à la demande"
      footer: "Tu reçois ce message parce que tu es propriétaire de ce lieu et que vous acceptez les demandes de multiplication. Ce réglage se change dans « Partager », sur la carte."
    accepted:
      subject: "Bonne nouvelle pour ta demande : %{plant}"
      greeting: "Bonjour %{name},"
      body: "%{owner} a accepté ta demande pour « %{plant} »."
      contact: "Écris-lui pour vous organiser : %{owner}, %{email}. Il suffit de répondre à cet e-mail."
      button: "Voir mes demandes"
      footer: "Merci de faire voyager les plantes qui ont fait leurs preuves. Pense à donner des nouvelles de ta greffe !"
    declined:
      subject: "Ta demande : %{plant}"
      greeting: "Bonjour %{name},"
      body: "Les propriétaires du lieu ne peuvent pas donner suite à ta demande pour « %{plant} »."
      encouragement: "Ce n'est pas rare : la saison, le temps, l'âge de l'arbre… D'autres jardins ont peut-être la même plante : regarde « Dans d'autres jardins » sur sa fiche."
      footer: "Tu reçois ce message parce que tu as envoyé une demande de multiplication sur Semisto Terranova."
