fr:
  offline_site:
    noscript: "Ce site a besoin de JavaScript pour afficher le plan. Les photos, les documents et les données sont dans les dossiers « photos », « documents » et « donnees »."
    csv:
      headers: ["Plante", "Nom latin", "Quantité", "Quantité prévue", "Plants sur la carte"]
    readme:
      body: |
        %{name}, exportée de Semisto Terranova le %{date}

        Ce dossier est ta carte, à toi, qui s'ouvre sans Terranova, sans compte et sans connexion.

        Pour l'ouvrir : double-clique sur index.html. Il s'ouvre dans ton navigateur (Firefox, Chrome, Safari ou Edge, dans une version récente).

        Ce qu'il contient :
        - index.html : le plan sur sa photo aérienne, le jardin au fil des années, les photos (%{photos}) et les documents (%{documents}) ;
        - photos/ et documents/ : les fichiers eux-mêmes ;
        - donnees/carte.geojson : tous les éléments de la carte avec leurs mesures, pour QGIS ou un autre SIG ;
        - donnees/plantes.csv : la liste des plantes, pour un tableur.

        Garde ce dossier sur ton ordinateur, une clé USB ou ton téléphone : il reste lisible même si tu quittes Terranova.
      networks: "Attention : ce dossier contient les réseaux du terrain (eau, gaz, électricité, Ethernet). Ne le partage qu'en confiance."
      skipped: "Ces fichiers étaient trop lourds pour le dossier ; ils restent dans Terranova :"
