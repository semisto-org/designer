fr:
  # Semisto's texts for the client document of an offer (Offer::Document).
  # An account changes them in its price scale, a team for one client in the
  # offer. Markdown; {client}, {lieu} and {equipe} are replaced.
  offer_documents:
    blocks:
      cover:
        title: "Votre jardin-forêt à {lieu}"
        body: "Concepteurs et accompagnateurs de forêts comestibles"
      letter:
        title: "Votre projet"
        # What closes every letter, after the text written for this client.
        body: "Au plaisir de construire ce projet avec vous,"
      approach:
        title: "Un jardin-forêt adapté à vos besoins"
        body: "Nous vous accompagnons dans vos démarches, réflexions et choix en élaborant votre jardin-forêt en trois étapes distinctes."
        phases:
          pre_design: "Rêver le projet ensemble de manière holistique, définir sa raison d’être, étudier le terrain et arrêter des objectifs et un plan d’ensemble cohérent."
          design: "Concevoir votre jardin-forêt en détail et préparer la mise en œuvre. Zoom sur des éléments spécifiques tels que l’aménagement d’une mare, les plans de plantation, etc."
          implementation: "Préparer les espaces et implanter les végétaux ensemble, en plusieurs phases maîtrisables."
      scope:
        title: "Périmètre d’intervention"
        body: ""
      phases:
        title: "Les étapes du projet"
        body: ""
        phases:
          pre_design: |-
            Explorer ensemble les éléments, les espaces et les zones qui composeront votre jardin-forêt.

            - **Interview et collecte de données** : étude de terrain (microclimats, eau, sol, flore, faune…) et compilation de données externes complémentaires ; interview : intentions, rêves, objectifs, contraintes, disponibilités.
            - **Création conceptuelle du projet** : évaluation et tri des données recueillies, positionnement du projet par sa raison d’être, analyse et recherche en fonction des objectifs, conception fonctionnelle et propositions.
            - **Esquisses non détaillées** : plan des zones et des flux, illustrations d’exemples sur photos.
            - **Consolidation du projet** : affinement du projet par les retours des autres membres du bureau d’études, en relecture croisée.

            **→ Présentation du pré-design**

            Validation des objectifs et des éléments qui composeront votre jardin-forêt.
          design: |-
            Transformer le rêve de votre jardin-forêt en un plan précis, prêt à être mis en œuvre.

            - **Élaboration d’un plan détaillé** : sélection des plantes adaptées à votre jardin-forêt et à votre terrain, plan de plantation précis pour les arbres et les arbustes, nombre de plants par zone pour les arbrisseaux et les herbacées.
            - **Consolidation du projet** : affinement du projet par les retours des autres membres du bureau d’études, en relecture croisée.

            **→ Présentation du design**

            Validation du phasage, du choix des végétaux à implanter et des solutions techniques.
          implementation: |-
            Du plan à la réalité, étape par étape, en donnant toutes les chances aux végétaux de s’implanter avec succès.

            - **Plants et matériaux** : fourniture des plantes et des matériaux de plantation, rassemblés par notre pépinière au sein de notre réseau.
            - **Chantiers collectifs** : encadrement des plantations collectives des différentes strates.

            **→ Chantiers de plantation**

            Validation de la mise en œuvre sur le terrain et des premières actions de gestion.
      co_management:
        title: "Co-gestion"
        body: |-
          Vous accompagner dans le développement d’un jardin-forêt résilient et productif.

          La co-gestion consiste en plusieurs demi-journées de travail par an, pour vous soutenir dans la gestion des espaces aménagés ensemble. Elle consiste surtout à :

          - veiller aux jeunes plants par le paillage et l’amendement ;
          - remplacer les plants morts ou ajouter des végétaux (coût des plants non compris) ;
          - tailler, si besoin ;
          - maintenir, tailler ou retirer les plantes auxiliaires ;
          - former les trognes éventuelles ;
          - documenter le travail réalisé.

          Ce travail est réalisé avec vous par une personne formée et suivie par {equipe}.
      software:
        title: "Un logiciel pour votre projet"
        body: |-
          Votre jardin-forêt est conçu dans Semisto Terranova, l’outil en ligne pour concevoir sur un terrain réel.

          - **Votre terrain lu avec précision** : photos aériennes, cadastre, sols, relief, climat observé, relevés de biodiversité et course du soleil.
          - **L’eau avant les plantes** : une averse simulée sur le relief en 3D montre où poser mare et baissières.
          - **Un projet que vous suivez** : vous commentez la carte là où ça compte, et voyez le projet en image, de l’avant à l’après.
          - **De quoi passer à l’action** : liste de plants, plan PDF à l’échelle, budget.
          - **Une carte qui vous reste** : elle suit vos plantations et vos observations, et n’est jamais supprimée.
      deliverables:
        title: "Livrables"
        body: "Vous recevrez différents documents au fur et à mesure de l’avancement du projet."
        phases:
          pre_design: |-
            - Accès à toutes les photos et vidéos
            - Plan des zones et des flux
            - Esquisses sur photos
          design: |-
            - Palette végétale
            - Plan de plantation
          implementation: "- Plan de plantation mis à jour"
          co_management: "- Rapport de visite"
      budget:
        title: "Prix"
        body: "Si nous constatons que le budget des plantes et des consommables doit être dépassé, nous vous préviendrons avant de poursuivre, pour décider ensemble de la suite à donner."
      conclusion:
        title: "En route vers l’abondance !"
        body: |-
          Nous espérons que cette offre correspond à vos attentes et vous donne envie d’aller plus loin dans ce projet.

          N’hésitez pas à nous contacter pour toute question, remarque ou envie d’ajustement : nous serons ravis d’en discuter avec vous.
