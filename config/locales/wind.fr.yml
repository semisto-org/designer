        winter: "En hiver"
        spring: "Au printemps"
        summer: "En été"
        autumn: "En automne"
      season: "%{when}, le vent vient surtout %{from} (%{pct} % des heures), à %{kmh} km/h en moyenne."
      cold_spring: "Au printemps, %{pct} % des heures ont un vent froid (sous %{cold} °C), surtout %{from} ; %{north_east} % de ces heures viennent du nord à l'est. C'est la bise qui brûle les fleurs."
      no_cold_spring: "Presque pas de vent froid au printemps ici."
      strong: "Les heures les plus venteuses viennent surtout %{from} : au-delà de %{kmh} km/h, jusqu'à %{max} km/h (sans les rafales, plus fortes)."
