# The wind of a map's place: the wind rose (« Secteurs » and « Climat »
# panels, project dossier, 3D compass) and the shelter of a tree.
fr:
  wind:
    rose:
      label: "Rose des vents : d'où vient le vent, et combien d'heures"
      points:
        n: "N"
        e: "E"
        s: "S"
        w: "O"
    views:
      year: "L'année"
      winter: "Hiver"
      spring: "Printemps"
      summer: "Été"
      autumn: "Automne"
      cold_spring: "Bise de printemps"
      strong: "Vents forts"
    card:
      title: "Le vent de ta région"
