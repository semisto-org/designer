      add_cold: "Ajouter la bise de printemps comme secteur"
      prevailing_name: "Vents dominants"
      cold_name: "Bise de printemps"
      prevailing_notes: "Vent dominant de l'année d'après trente ans de climat observé (ERA5-Land). À confirmer sur place : une haie brise-vent de ce côté abrite environ dix fois sa hauteur."
      cold_notes: "Vent froid et sec du printemps, quand les fruitiers fleurissent. Les floraisons précoces (abricotier, pêcher, amandier, poirier précoce) se placent à l'abri de ce côté."
