# Sector analysis: the « Secteurs » panel of the editor and its page in the project dossier.
fr:
  sectors:
    panel_title: "Secteurs"
    intro: "Ce qui arrive sur ton terrain depuis l'extérieur, direction par direction : le soleil, les vents, le feu, le bruit, les vues, la faune. Les noter aide à placer une haie brise-vent, une mare ou un coin calme au bon endroit."
    sun:
      summer_sun: "Soleil d'été"
      winter_sun: "Soleil d'hiver"
    range: "de %{from} à %{to}"
    all_around: "tout autour"
    season_filter: "Saison"
    season:
      all: "Toute l'année"
      winter: "Hiver"
      summer: "Été"
    proposed: "Proposé"
    observe_title: "Comment l'observer :"
    observe:
      wind: "regarde de quel côté les arbres isolés penchent et où la neige s'accumule. Demande aussi aux voisins d'où vient le vent des tempêtes."
      cold_wind: "en hiver, cherche le côté d'où arrive la bise, souvent nord ou nord-est : là où les bourgeons gèlent en premier et où l'on remonte son col."
      fire: "repère les friches sèches, les résineux et les champs de céréales autour de toi, et d'où souffle le vent chaud de l'été."
      flood: "suis le chemin de l'eau après une grosse pluie : par où elle entre sur le terrain, où elle stagne. Le panneau « Eau et relief » montre les pentes."
      frost: "l'air froid coule comme de l'eau vers le bas : regarde où le givre reste le plus longtemps les matins de printemps, souvent en bas de pente."
      noise: "écoute à différents moments de la journée : route, voie ferrée, voisinage, et d'où le bruit arrive."
      dust: "regarde d'où viennent la poussière d'un chemin de terre ou la dérive des pulvérisations des champs voisins."
      pollution: "note les sources proches : route passante, cheminées, champs traités, et le vent qui les porte vers toi."
      good_view: "tiens-toi au cœur du terrain et note ce que tu veux garder visible : une vallée, un clocher, un coucher de soleil."
      bad_view: "note ce que tu préfères ne plus voir : un hangar, une route, des lignes électriques."
      privacy: "repère d'où les voisins ou les passants voient chez toi, depuis leurs fenêtres ou depuis la rue."
      wildlife: "cherche les traces, les coulées dans les haies et les crottes : par où passent chevreuils, sangliers, hérissons."
      predators: "observe d'où arrivent renards, fouines ou rapaces : lisière de bois, haie, ruisseau."
      other: "décris ce qui arrive sur ton terrain depuis cette direction, et ce que tu en as vu."
