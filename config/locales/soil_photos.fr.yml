    panel:
      intro: "Comprends ton sol avant de planter : où prélever, quoi demander au laboratoire, ce que disent les résultats et les plantes qui poussent déjà."
      tabs:
        guide: "Guide"
        points: "Points"
        compare: "Comparer"
        plants: "Plantes"
      show_on_map: "Sur la carte"
      loading: "Chargement…"
      load_failed: "Impossible de charger les données du sol. Réessaie."
      retry: "Réessayer"
    guide:
      lead: "Le geste de prélèvement compte plus que l'analyse : un mauvais échantillon donne un résultat faux. Ce guide est libre d'accès."
      cta: "Préparer mes points de prélèvement"
      sections:
        why:
          title: "Pourquoi analyser le sol ?"
          intro: "Une analyse dit ce que le sol contient vraiment : son acidité (pH), sa richesse en matière organique, ses éléments nutritifs et sa texture. Elle évite de planter au hasard, de chauler ou d'amender pour rien, et elle révèle les terrains où l'on ne cultive pas à manger (métaux lourds, ancien dépôt)."
        when:
          title: "Quand prélever ?"
          steps:
            s1: "De préférence à l'automne ou en fin d'hiver, quand le sol est ressuyé : ni gelé, ni détrempé, ni desséché."
            s2: "Attends au moins trois mois après un chaulage, un apport de compost ou de fumier, ou un engrais."
            s3: "Refaites une analyse tous les trois à cinq ans, à la même saison, pour suivre l'évolution."
        where:
          title: "Où prélever ?"
          intro: "Un échantillon représente une zone homogène : même sol, même végétation, même histoire. Un potager, un verger et une prairie font trois échantillons."
          steps:
            s1: "Dans l'onglet « Points », laisse Designer suggérer des emplacements : il répartit les points sur le terrain, loin du bord, des bâtiments, de l'eau et des chemins."
            s2: "Évite les pieds de haies et d'arbres isolés, les anciens feux, les tas de compost, les abreuvoirs, les passages d'animaux, les pieds de gouttière et les remblais."
            s3: "Au-delà d'un hectare, ou si le terrain varie beaucoup (pente, creux, ancien bras d'eau), multiplie les échantillons."
        how:
          title: "Comment prélever ?"
          intro: "Chaque échantillon est un mélange : plusieurs prises dans la zone, réunies dans un seau propre."
          steps:
            s1: "Matériel : une bêche ou une tarière en inox, un seau en plastique propre (pas de métal galvanisé), un sac ou une boîte propre, un marqueur."
            s2: "Dans la zone, marche en zigzag et fais 10 à 15 prises, chacune à plus de 5 m d'un obstacle."
            s3: "À chaque prise, écarte les feuilles et l'herbe, puis découpe une tranche de terre en V : sur 20 cm de profondeur dans un potager, un jardin ou un verger, sur 10 cm sous une prairie permanente."
            s4: "Réunis toutes les prises dans le seau, enlève cailloux et grosses racines, mélange, puis remplis le sac avec environ 500 g de ce mélange."
            s5: "Étiquette : zone, profondeur, date. Note-le aussi dans Designer, sur le point correspondant."
        ask:
          title: "Que demander au laboratoire ?"
          intro: "Choisis un laboratoire de sol agréé (en Wallonie, le réseau Requasud en regroupe plusieurs) et sa formule « jardin » ou « verger ». Demande au minimum :"
          steps:
            s1: "le pH eau et le pH KCl ;"
            s2: "la matière organique (ou le carbone organique) et le rapport C/N ;"
            s3: "le phosphore (P), le potassium (K), le magnésium (Mg) et le calcium (Ca) ;"
            s4: "la capacité d'échange (CEC) ;"
            s5: "la texture (granulométrie : sable, limon, argile) ;"
            s6: "si le terrain a un passé (ancien jardin ouvrier, bord de route, industrie, remblai, peintures au plomb) : les métaux lourds (plomb, cadmium, zinc, arsenic…), avant de planter à manger."
          note: "En Wallonie, la Banque de données de l'état des sols (BDES) indique si une parcelle est connue comme suspectée ou polluée : consulte-la avant d'investir."
        jar:
          title: "Pas d'analyse ? Le test du bocal"
          intro: "Une estimation gratuite de la texture avec un bocal transparent :"
          steps:
            s1: "Remplis le bocal au tiers de terre émiettée, sans cailloux, puis d'eau jusqu'aux trois quarts. Ajoute une cuillère de liquide vaisselle."
            s2: "Ferme, secoue énergiquement trois minutes, puis pose le bocal sur une table sans y toucher."
            s3: "Après 1 minute, marque la hauteur du dépôt : c'est le sable. Après 2 heures, marque le suivant : le limon. Après 24 heures, la dernière couche est l'argile."
            s4: "Divise chaque couche par la hauteur totale pour obtenir des pourcentages, puis saisis-les dans un point : Designer en déduit la classe de texture."
        after:
          title: "Après le prélèvement"
          steps:
            s1: "Envoie l'échantillon au laboratoire dans les deux jours, au frais et à l'abri de la lumière, avec le formulaire de demande."
            s2: "À la réception du rapport, ouvre le point dans l'onglet « Points » : saisis les valeurs et joins le PDF."
            s3: "L'onglet « Comparer » met tes points côte à côte et situe chaque valeur (bas, correct, élevé)."
