      waterlogging: { label: "Sol engorgé", hint: "L'eau stagne et l'oxygène manque aux racines. Draine, plante sur butte ou choisis des espèces de sols humides." }
      acidic: { label: "Sol acide", hint: "pH bas : certains nutriments sont moins disponibles. À confirmer par une analyse (pH)." }
      calcareous: { label: "Sol calcaire", hint: "pH élevé, riche en calcium : choisis des espèces tolérantes au calcaire." }
