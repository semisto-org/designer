    fields:
      ph_water: { name: "pH eau", short: "pH eau", hint: "Acidité du sol : en dessous de 7, acide ; au-dessus, basique." }
      ph_kcl: { name: "pH KCl", short: "pH KCl", hint: "Acidité de réserve, mesurée avec du chlorure de potassium. Un peu plus bas que le pH eau." }
      organic_matter_pct: { name: "Matière organique", short: "M.O.", hint: "Part d'humus et de débris en décomposition, en % de la terre sèche. Si le laboratoire donne du carbone organique (C), multiplie par 1,72." }
      c_n_ratio: { name: "Rapport C/N", short: "C/N", hint: "Carbone sur azote de la matière organique : dit si elle se décompose vite ou lentement." }
      p_mg_100g: { name: "Phosphore (P)", short: "P", hint: "En mg pour 100 g de terre sèche (méthode usuelle des laboratoires wallons)." }
      k_mg_100g: { name: "Potassium (K)", short: "K", hint: "En mg pour 100 g de terre sèche." }
      mg_mg_100g: { name: "Magnésium (Mg)", short: "Mg", hint: "En mg pour 100 g de terre sèche." }
      ca_mg_100g: { name: "Calcium (Ca)", short: "Ca", hint: "En mg pour 100 g de terre sèche. À lire avec le pH." }
      cec_meq_100g: { name: "Capacité d'échange (CEC)", short: "CEC", hint: "En méq pour 100 g : la capacité du sol à retenir les nutriments." }
      sand_pct: { name: "Sable", short: "Sable", hint: "Particules de 0,05 à 2 mm, en % de la terre fine." }
      silt_pct: { name: "Limon", short: "Limon", hint: "Particules de 0,002 à 0,05 mm, en %." }
      clay_pct: { name: "Argile", short: "Argile", hint: "Particules de moins de 0,002 mm, en %." }
    bands:
      low: "Bas"
      ok: "Correct"
      high: "Élevé"
    interpretation:
      ph_water:
        low: "Sol acide. Les éléments nutritifs sont moins disponibles et la vie du sol ralentit ; la plupart des arbres fruitiers et des légumes préfèrent un pH plus élevé. Un chaulage peut aider, selon l'avis de ton laboratoire. Les myrtilliers et les plantes de terre de bruyère s'y plaisent."
        ok: "Plage qui convient à la plupart des arbres fruitiers, des arbustes et des légumes. Les plantes de terre de bruyère (myrtilliers, rhododendrons) préfèrent plus acide."
        high: "Sol basique, souvent calcaire. Le fer et certains oligo-éléments deviennent moins disponibles : les feuilles jaunissent chez les plantes sensibles (myrtilliers, par exemple). Choisis des espèces tolérantes au calcaire."
      ph_kcl:
        low: "pH KCl bas : l'acidité de réserve est forte et le sol s'acidifiera facilement. Sous 5, l'aluminium peut devenir toxique pour les racines. Les prairies et les arbres se contentent de 5,5 à 6 ; un potager vise plutôt 6,3 à 6,9."
        ok: "Acidité de réserve modérée : un sol plutôt stable. L'optimum va de 5,5 à 6 sous prairie et sous les arbres à 6,5 environ pour un potager."
        high: "pH KCl élevé : sol riche en calcaire actif ou fortement chaulé."
      organic_matter_pct:
        low: "Matière organique faible : sous 2 % de carbone organique (environ 3,4 % de matière organique), la structure du sol devient fragile et il retient mal l'eau et les nutriments. Paillage, compost et couverts végétaux la font remonter lentement."
        ok: "Matière organique correcte pour un sol de jardin ou de verger. Les paillages et les arbres l'entretiennent et la font progresser."
        high: "Matière organique abondante, typique des vieux jardins, des prairies permanentes et des sous-bois. Rien à ajouter. Si le sol est froid ou acide, elle se décompose lentement."
      c_n_ratio:
        low: "Rapport C/N bas : la matière organique se décompose vite et libère beaucoup d'azote, mais l'humus se renouvelle peu. Apporte de la matière carbonée (paille, broyat)."
        ok: "Rapport C/N équilibré : la matière organique se décompose à bon rythme et nourrit les plantes."
        high: "Rapport C/N élevé : la décomposition est plus lente et, au potager, les micro-organismes peuvent « emprunter » l'azote aux légumes ; compost mûr, engrais verts et légumineuses rééquilibrent. Sous les arbres et un paillage de bois, un C/N jusqu'à 20 environ est normal et ne demande rien."
      p_mg_100g:
        low: "Phosphore bas : il peut freiner l'enracinement et la floraison des jeunes plants. Compost, fumier mûr ou apport adapté selon le laboratoire ; les mycorhizes aident."
        ok: "Phosphore suffisant pour la plupart des cultures et des arbres."
        high: "Phosphore élevé : inutile d'en ajouter. Un excès gêne la vie du sol et pollue l'eau ; certaines plantes de sol pauvre le supportent mal."
      k_mg_100g:
        low: "Potassium bas : il pèse sur la fructification et la résistance aux maladies. Cendres de bois (avec modération), compost, fumier mûr."
        ok: "Potassium suffisant."
        high: "Potassium élevé : il peut gêner l'absorption du magnésium. Pas d'apport."
      mg_mg_100g:
        low: "Magnésium bas : les feuilles jaunissent entre les nervures. Un amendement magnésien peut aider, surtout si le pH est bas."
        ok: "Magnésium suffisant."
        high: "Magnésium élevé : rien à ajouter. Vérifie le rapport potassium sur magnésium (idéal entre 1 et 2) : trop de magnésium peut gêner l'absorption du potassium."
      ca_mg_100g:
        low: "Calcium bas, souvent avec un pH bas : le sol manque de structure. Regarde le pH avant d'agir ; un chaulage peut être utile."
        ok: "Calcium suffisant."
        high: "Calcium élevé : souvent un sol calcaire. À lire avec le pH."
      cec_meq_100g:
        low: "Capacité d'échange faible : le sol retient mal les nutriments (sol sableux ou pauvre en humus). Apporte peu et souvent, et augmente la matière organique."
        ok: "Capacité d'échange moyenne : bonne rétention des nutriments."
        high: "Capacité d'échange élevée : sol riche en argile ou en humus, qui retient bien les nutriments et l'eau."
    texture:
      classes:
        sand: { name: "Sable", description: "Très drainant, se réchauffe vite, retient peu l'eau et les nutriments. Beaucoup de matière organique et de paillage lui font du bien." }
        loamy_sand: { name: "Sable limoneux", description: "Léger et facile à travailler, mais il sèche vite. La matière organique améliore sa rétention." }
        sandy_loam: { name: "Limon sableux", description: "Souple, bien drainé, il se réchauffe vite. Un bon sol de verger et de potager." }
        loam: { name: "Terre franche (loam)", description: "L'équilibre entre sable, limon et argile : drainant et retenant à la fois. L'idéal du jardinier." }
        silt_loam: { name: "Limon", description: "Fertile et retient bien l'eau, mais sensible à la battance (croûte en surface) et au tassement. Garde-le couvert." }
        silt: { name: "Limon fin (silt)", description: "Très fin, fertile mais fragile : battance et érosion si le sol reste nu." }
        sandy_clay_loam: { name: "Limon argilo-sableux", description: "Assez lourd mais drainant grâce au sable. Il se travaille bien en bonne saison." }
        clay_loam: { name: "Limon argileux", description: "Fertile, il retient l'eau et les nutriments ; lourd quand il est humide, dur quand il sèche." }
        silty_clay_loam: { name: "Limon argilo-limoneux", description: "Fertile, lourd et lent à se réchauffer. Ne le travaille pas détrempé." }
        sandy_clay: { name: "Argile sableuse", description: "Lourde malgré le sable : collante humide, dure sèche." }
        silty_clay: { name: "Argile limoneuse", description: "Très lourde, retient l'eau, mal aérée. Préfère des plantes tolérantes aux pieds humides." }
        clay: { name: "Argile", description: "Retient l'eau et les nutriments mais se compacte, s'engorge l'hiver et durcit l'été. Ne la travaille pas humide ; buttes et matière organique l'améliorent." }
