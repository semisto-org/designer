    errors:
      unreadable_result: "« %{field} » n'est pas un nombre."
      out_of_range: "« %{field} » doit être compris entre %{min} et %{max}."
      texture_sum: "Sable, limon et argile doivent faire 100 % ensemble (à 3 points près), ou deux valeurs seulement : la troisième est déduite."
