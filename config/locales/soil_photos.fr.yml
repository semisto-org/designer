    fields:
      ph_water: { name: "pH eau", short: "pH eau", hint: "Acidité du sol : en dessous de 7, acide ; au-dessus, basique." }
      ph_kcl: { name: "pH KCl", short: "pH KCl", hint: "Acidité de réserve, mesurée avec du chlorure de potassium. Un peu plus bas que le pH eau." }
      organic_matter_pct: { name: "Matière organique", short: "M.O.", hint: "Part d'humus et de débris en décomposition, en % de la terre sèche. Si le laboratoire donne du carbone organique (C), multipliez par 1,72." }
      c_n_ratio: { name: "Rapport C/N", short: "C/N", hint: "Carbone sur azote de la matière organique : dit si elle se décompose vite ou lentement." }
      p_mg_100g: { name: "Phosphore (P)", short: "P", hint: "En mg pour 100 g de terre sèche (méthode usuelle des laboratoires wallons)." }
      k_mg_100g: { name: "Potassium (K)", short: "K", hint: "En mg pour 100 g de terre sèche." }
      mg_mg_100g: { name: "Magnésium (Mg)", short: "Mg", hint: "En mg pour 100 g de terre sèche." }
      ca_mg_100g: { name: "Calcium (Ca)", short: "Ca", hint: "En mg pour 100 g de terre sèche. À lire avec le pH." }
      cec_meq_100g: { name: "Capacité d'échange (CEC)", short: "CEC", hint: "En méq pour 100 g : la capacité du sol à retenir les nutriments." }
      sand_pct: { name: "Sable", short: "Sable", hint: "Particules de 0,05 à 2 mm, en % de la terre fine." }
      silt_pct: { name: "Limon", short: "Limon", hint: "Particules de 0,002 à 0,05 mm, en %." }
      clay_pct: { name: "Argile", short: "Argile", hint: "Particules de moins de 0,002 mm, en %." }
    bands:
      low: "Bas"
      ok: "Correct"
      high: "Élevé"
    interpretation:
      ph_water:
        low: "Sol acide. Les éléments nutritifs sont moins disponibles et la vie du sol ralentit ; la plupart des arbres fruitiers et des légumes préfèrent un pH plus élevé. Un chaulage peut aider, selon l'avis de votre laboratoire. Les myrtilliers et les plantes de terre de bruyère s'y plaisent."
        ok: "Plage qui convient à la plupart des arbres fruitiers, des arbustes et des légumes. Les plantes de terre de bruyère (myrtilliers, rhododendrons) préfèrent plus acide."
        high: "Sol basique, souvent calcaire. Le fer et certains oligo-éléments deviennent moins disponibles : les feuilles jaunissent chez les plantes sensibles (myrtilliers, par exemple). Choisissez des espèces tolérantes au calcaire."
      ph_kcl:
        low: "pH KCl bas : l'acidité de réserve est forte et le sol s'acidifiera facilement. Comparez avec le pH eau."
        ok: "Acidité de réserve moyenne : un sol plutôt stable."
        high: "pH KCl élevé : sol riche en calcaire actif ou fortement chaulé."
      organic_matter_pct:
        low: "Matière organique faible : un sol peu structuré, qui retient mal l'eau et les nutriments. Paillage, compost et couverts végétaux la font remonter lentement."
        ok: "Matière organique correcte pour un sol de jardin ou de verger. Les paillages et les arbres l'entretiennent et la font progresser."
        high: "Matière organique élevée : un sol riche et vivant, fréquent sous prairie permanente ou sous forêt. Rien à ajouter ; surveillez seulement l'excès d'humidité."
      c_n_ratio:
        low: "Rapport C/N bas : la matière organique se décompose vite et libère beaucoup d'azote, mais l'humus se renouvelle peu. Apportez de la matière carbonée (paille, broyat)."
        ok: "Rapport C/N équilibré : la matière organique se décompose à bon rythme et nourrit les plantes."
        high: "Rapport C/N élevé : la décomposition est lente et les micro-organismes peuvent « emprunter » l'azote aux plantes. Typique des sols de forêt. Apportez de l'azote : compost mûr, engrais verts, légumineuses."
      p_mg_100g:
        low: "Phosphore bas : il peut freiner l'enracinement et la floraison des jeunes plants. Compost, fumier mûr ou apport adapté selon le laboratoire ; les mycorhizes aident."
        ok: "Phosphore suffisant pour la plupart des cultures et des arbres."
        high: "Phosphore élevé : inutile d'en ajouter. Un excès gêne la vie du sol et pollue l'eau ; certaines plantes de sol pauvre le supportent mal."
      k_mg_100g:
        low: "Potassium bas : il pèse sur la fructification et la résistance aux maladies. Cendres de bois (avec modération), compost, fumier mûr."
        ok: "Potassium suffisant."
        high: "Potassium élevé : il peut gêner l'absorption du magnésium. Pas d'apport."
      mg_mg_100g:
        low: "Magnésium bas : les feuilles jaunissent entre les nervures. Un amendement magnésien peut aider, surtout si le pH est bas."
        ok: "Magnésium suffisant."
        high: "Magnésium élevé : un sol argileux peut devenir lourd et collant. Rien à ajouter."
      ca_mg_100g:
        low: "Calcium bas, souvent avec un pH bas : le sol manque de structure. Regardez le pH avant d'agir ; un chaulage peut être utile."
        ok: "Calcium suffisant."
        high: "Calcium élevé : un sol calcaire. À lire avec le pH."
      cec_meq_100g:
        low: "Capacité d'échange faible : le sol retient mal les nutriments (sol sableux ou pauvre en humus). Apportez peu et souvent, et augmentez la matière organique."
        ok: "Capacité d'échange moyenne : bonne rétention des nutriments."
        high: "Capacité d'échange élevée : sol riche en argile ou en humus, qui retient bien les nutriments et l'eau."
    texture:
      classes:
        sand: { name: "Sable", description: "Très drainant, se réchauffe vite, retient peu l'eau et les nutriments. Beaucoup de matière organique et de paillage lui font du bien." }
        loamy_sand: { name: "Sable limoneux", description: "Léger et facile à travailler, mais il sèche vite. La matière organique améliore sa rétention." }
        sandy_loam: { name: "Limon sableux", description: "Souple, bien drainé, il se réchauffe vite. Un bon sol de verger et de potager." }
        loam: { name: "Terre franche (loam)", description: "L'équilibre entre sable, limon et argile : drainant et retenant à la fois. L'idéal du jardinier." }
        silt_loam: { name: "Limon", description: "Fertile et retient bien l'eau, mais sensible à la battance (croûte en surface) et au tassement. Gardez-le couvert." }
        silt: { name: "Limon fin (silt)", description: "Très fin, fertile mais fragile : battance et érosion si le sol reste nu." }
        sandy_clay_loam: { name: "Limon argilo-sableux", description: "Assez lourd mais drainant grâce au sable. Il se travaille bien en bonne saison." }
        clay_loam: { name: "Limon argileux", description: "Fertile, il retient l'eau et les nutriments ; lourd quand il est humide, dur quand il sèche." }
        silty_clay_loam: { name: "Limon argilo-limoneux", description: "Fertile, lourd et lent à se réchauffer. Ne le travaillez pas détrempé." }
        sandy_clay: { name: "Argile sableuse", description: "Lourde malgré le sable : collante humide, dure sèche." }
        silty_clay: { name: "Argile limoneuse", description: "Très lourde, retient l'eau, mal aérée. Préférez des plantes tolérantes aux pieds humides." }
        clay: { name: "Argile", description: "Retient l'eau et les nutriments mais se compacte, s'engorge l'hiver et durcit l'été. Ne la travaillez pas humide ; buttes et matière organique l'améliorent." }
    points:
      default_label: "Point %{number}"
    abundances:
      rare: "Rare"
      present: "Présente"
      frequent: "Fréquente"
      dominant: "Dominante"
    indicators:
      compaction: { label: "Sol tassé", hint: "Sol compact : l'eau et l'air circulent mal, les racines peinent à descendre. Aérez (grelinette, plantes à racines profondes) et évitez de marcher dessus quand il est humide." }
      waterlogging: { label: "Sol engorgé", hint: "L'eau stagne et l'oxygène manque aux racines. Drainez, plantez sur butte ou choisissez des espèces de sols humides." }
      acidic: { label: "Sol acide", hint: "pH bas : certains nutriments sont moins disponibles. À confirmer par une analyse (pH)." }
      calcareous: { label: "Sol calcaire", hint: "pH élevé, riche en calcium : choisissez des espèces tolérantes au calcaire." }
      nitrogen_rich: { label: "Riche en azote", hint: "Beaucoup d'azote disponible (fumier, ancien dépôt, sol travaillé). Peu besoin d'apports." }
      nitrogen_poor: { label: "Pauvre en azote", hint: "Peu d'azote disponible : légumineuses, engrais verts et compost aident." }
      disturbed: { label: "Sol remué", hint: "Sol travaillé ou remanié : les plantes pionnières recolonisent la terre nue. Couvrez-le (paillage, engrais verts)." }
      dry: { label: "Sol sec", hint: "Sol léger ou filtrant, qui sèche vite. Paillage épais et plantes tolérantes à la sécheresse." }
      fertile: { label: "Sol fertile", hint: "Sol riche et vivant, avec une bonne activité biologique." }
      trampled: { label: "Piétinement", hint: "Passages fréquents (pas, animaux, engins) : le sol est tassé en surface." }
