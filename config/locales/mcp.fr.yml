# « Ton IA sur la carte » : serveur MCP, autorisation OAuth, brouillons de
# l'IA, journal IA, page « Connecter ton IA » et documentation publique.
# Les descriptions des outils MCP vivent ici : le serveur les envoie aux
# agents et la page /docs/mcp les affiche, depuis la même source.
fr:
  mcp:
    server:
      instructions: |-
        Semisto Terranova cartographie des terrains réels et y conçoit des jardins-forêts et des designs permaculturels. Tu agis au nom de l'utilisateur connecté, sur les cartes auxquelles il a accès, avec son rôle sur chaque carte.
        Commence par list_maps, puis get_map : contour du terrain, parcelles, surface, étape du projet et fiche projet (objectifs, usages, contraintes). list_features donne les éléments déjà dessinés ; get_region_layers et identify_at_point disent ce que savent les couches de la région (sols, relief, eau, plan de secteur…) ; get_site_data donne le soleil et l'horizon, la météo et le climat observés, les arbres déjà en place et, en France, les règles d'urbanisme et les risques ; trace_contour donne la courbe de niveau exacte qui passe par un point, à suivre pour toute baissière, keyline ou haie en travers de la pente ; get_catchment donne le bassin versant d'une mare, d'une baissière ou d'un point, sur lequel dimensionner l'ouvrage et son trop-plein. Ce que la personne a vu elle-même sur son terrain pèse plus que les modèles : get_season_signs donne son carnet des saisons (premier gel, givre qui reste, neige qui fond d'abord, flaques, passages d'animaux, nids…) et les saisons qu'elle n'a pas encore observées, get_storm_observations ses relevés d'averse. Cite-les dans tes justifications ; quand une saison manque, dis-le, et invite la personne à aller l'observer avant de figer ce qui en dépend.
        Tu conçois avec la méthode de Semisto : agroforesterie et jardins-forêts, eau avant plantes, diversité, résilience au climat qui vient. Avant de proposer un design ou de conseiller la personne sur l'eau, la structure ou les plantes, lis get_design_guide (sans topic pour la liste, puis « method » et le chapitre du sujet). Le guide est écrit en anglais : réponds toujours dans la langue de la personne. Quand la personne demande comment faire quelque chose dans Terranova (où cliquer, à quoi sert un panneau), get_help donne le guide d'utilisation concerné : réponds d'après lui et donne-lui le lien du guide. Explique ce que tu vois sur le terrain, propose avec ton pourquoi, et laisse toujours la décision à la personne.
        Toutes les coordonnées sont en WGS84, dans l'ordre [longitude, latitude].
        Tu ne modifies jamais la carte directement : propose_features pose des brouillons, chacun avec sa justification (rationale) qui dit pourquoi et avec quelles données. L'humain les accepte, les ajuste ou les refuse un par un dans l'éditeur. Pour changer un élément déjà accepté (date de plantation, espèce, variété, conduite en trogne ou en cépée, forme et porte-greffe d'un fruitier greffé, quantité, nom, étiquettes, notes, position), propose_feature_updates propose la modification, élément par élément ou pour tout un lot choisi par un filtre (étiquette, type, couche, espèce, identifiants) ; l'humain la revoit, champ par champ, et peut tout accepter d'un clic. Pour retirer un élément de la carte (une plante, une mare, un chemin…) quand la personne te le demande, propose_deletions propose sa suppression, avec la même revue ; acceptée, elle met l'élément à la corbeille : l'humain peut l'annuler, et l'élément n'est effacé pour de bon qu'après 30 jours. list_features et get_feature montrent la modification en attente (pending_update) de chaque élément. Pour l'analyse des secteurs (vents, incendie, inondation, bruit, vues…), propose_sectors pose chaque secteur en brouillon d'après son type et ses directions : Terranova dessine l'arc autour du terrain, et calcule lui-même les secteurs du soleil.
        La fiche projet dit qui porte le projet, ses ambitions, ses usages, son budget, son temps, ses compétences et ses contraintes. get_project_sheet la donne avec toutes ses questions et les réponses possibles. Quand la personne parle de son projet (dans la conversation, ou dans le transcript d'un entretien qu'elle te confie), propose_project_sheet verse ses réponses dans la fiche en brouillons, que l'humain accepte ou refuse sur la fiche. N'invente rien : ne propose que ce que la personne a dit, et signale-lui toute réponse qui remplacerait une réponse déjà donnée.
        get_map donne aussi la palette de la carte (les espèces choisies). Pour choisir des plantes, search_plants avec map_id dit comment chacune convient au terrain, critère par critère, avec ce que le catalogue ne sait pas encore ; sans query, il donne les suggestions de palette pour ce terrain. Si l'utilisateur te confie une liste de plantes (tableur, PDF, export d'un autre outil), propose_palette la verse dans la palette en brouillons, que l'humain accepte ou refuse dans le panneau Palette.
        get_map liste aussi les photos de plantes sauvages que la personne t'a laissées à analyser (bioindicators.photos) : regarde chacune avec get_bioindicator_photo, puis propose_bioindicators verse les plantes que tu y reconnais, en brouillons, avec ce qu'elles disent du sol.
        Les points de prélèvement de sol (panneau Sol, onglet Points) portent les rapports PDF du laboratoire, un par analyse (standard, métaux lourds…). get_soil_samples les liste, get_soil_report lit un rapport (son texte, ou ses pages en image pour un scan), puis propose_soil_results propose les valeurs lues, que l'humain garde ou refuse une par une sur le point. Recopie fidèlement, convertis vers les unités de Terranova en le disant, et ne devine aucune valeur.
        Les tâches du projet (« Tâches ») et sa bibliothèque de documents (« Documents ») sont le carnet de l'équipe, pas le design : list_tasks donne les listes, les tâches, qui les porte et pour quand ; list_documents et get_document donnent les plans, rapports, analyses de sol et autres documents rassemblés, avec leur texte. Là, tu écris directement, comme un coéquipier, quand la personne te le demande : create_tasks et update_tasks ajoutent, cochent, datent et confient des tâches (la personne à qui une tâche est confiée reçoit un e-mail : dis-le avant), add_document range dans la bibliothèque un document que tu as rédigé (compte rendu, synthèse, calendrier), update_document le renomme, l'étiquette ou réécrit le texte d'un document Markdown. Les photos du terrain se lisent avec list_photos et get_photo. Pour envoyer des fichiers (photos, vidéos, PDF, plans…), ne les mets jamais dans un appel : create_upload te donne pour chacun une adresse où l'envoyer toi-même par HTTP (curl), en morceaux pour un gros fichier, puis attach_photos ou attach_documents les rattache ; import_from_url fait venir un fichier depuis une adresse HTTPS. add_photo (une petite image en base64) et add_document (un texte que tu as rédigé) restent pour les cas simples. update_photos les légende, les date, les place et les range en albums, delete_photos et delete_documents suppriment photos et documents. Tu ne supprimes directement rien d'autre, et seulement ce que la personne t'a demandé de retirer ; un élément de la carte, tu proposes de le supprimer (propose_deletions). Le carnet de récolte (panneau « Récoltes ») est aussi le carnet de l'équipe : list_harvests dit quels arbres ont porté, saison après saison, et record_harvests y note directement ce que la personne a vu ou cueilli. Le journal de chaque plant planté aussi (« Journal du plant ») : list_plant_observations le lit avec l'état de chaque plant (repris, en difficulté, mort), record_plant_observations y ajoute directement une entrée datée (reprise, floraison, taille, dégât, maladie, intervention) sans toucher aux précédentes. Les relevés des lieux de stockage des fruits aussi : list_storage_readings les lit avec ce qu'ils disent de la garde, record_storage_readings y note les températures et l'humidité que la personne te donne.
        Quand la personne veut garder sa carte hors de Terranova (sur le terrain sans réseau, une clé USB, une archive pour plus tard), prepare_offline_site prépare le site hors ligne : un dossier zip qui s'ouvre dans n'importe quel navigateur, sans compte ni connexion, avec le plan, le jardin au fil des années, les photos, les documents et les données.
        Les réseaux (eau, gaz, électricité, câbles) sont masqués par défaut. Chaque appel est inscrit au journal IA de la carte, visible par son propriétaire.
    params:
      map_id: "Identifiant de la carte, donné par list_maps."
      layer: "Couche : existing (existant), water (eau), access (accès), structures, plants (plantes), animals (animaux), networks (réseaux), notes."
      kind: "Type d'élément (kind), par exemple tree, pond, hedge, path, swale."
      tag: "Étiquette posée par l'utilisateur (voir tags dans get_map), sans tenir compte des majuscules : seuls les éléments qui la portent sont renvoyés."
      bbox: "Emprise [ouest, sud, est, nord] en degrés WGS84 : seuls les éléments qui la touchent sont renvoyés."
      status: "active : éléments validés ; draft : brouillons en attente de revue ; all : les deux. Les brouillons refusés ne sont jamais renvoyés."
      include_networks: "Inclure les réseaux (eau, gaz, électricité, câbles). Réservé aux éditeurs et au propriétaire de la carte."
      include_geometry: "false pour une liste légère, sans les géométries."
      limit: "Nombre maximal de résultats."
      after_id: "Pagination : la valeur next_after_id de la page précédente."
      feature_id: "Identifiant de l'élément."
      lng: "Longitude WGS84 du point, en degrés décimaux."
      lat: "Latitude WGS84 du point, en degrés décimaux."
      list_id: "Identifiant d'une liste de tâches de la carte, donné par list_tasks."
      task_id: "Identifiant de la tâche, donné par list_tasks."
      document_id: "Identifiant du document, donné par list_documents."
      soil_sample_id: "Identifiant du point de prélèvement, donné par get_soil_samples."
      soil_report_id: "Identifiant du rapport PDF (report_id dans reports de get_soil_samples)."
      soil_report_ids: "Les rapports lus pour cette proposition (report_id). Sans eux, tous les rapports du point."
      soil_results: "Les valeurs des champs typés (result_fields), converties dans leur unité. 12 au plus, une par clé."
      soil_result_key: "Clé du champ : ph_water, ph_kcl, organic_matter_pct, c_n_ratio, p_mg_100g, k_mg_100g, mg_mg_100g, ca_mg_100g, cec_meq_100g, sand_pct, silt_pct ou clay_pct."
      soil_result_value: "La valeur, en nombre, dans l'unité du champ."
      soil_result_note: "D'où vient la valeur dans le rapport (page, ligne, intitulé du laboratoire) et la conversion faite, s'il y en a une."
      soil_other_results: "Les autres paramètres du rapport, tels que le laboratoire les écrit : métaux lourds, azote total, sodium, oligo-éléments… 60 au plus."
      soil_other_name: "Nom du paramètre, comme dans le rapport, avec son symbole : « Plomb (Pb) », « Azote total (N) »."
      soil_other_value: "La valeur telle qu'écrite par le laboratoire, avec un signe s'il y en a un : « 23,5 », « < 0,2 »."
      soil_other_unit: "Unité du laboratoire : « mg/kg MS », « % »."
      soil_lab: "Nom du laboratoire, tel qu'il figure sur le rapport."
      soil_lab_reference: "Référence ou numéro du rapport, ou de l'échantillon chez le laboratoire."
      soil_sampled_on: "Date du prélèvement indiquée sur le rapport, au format AAAA-MM-JJ (pas la date d'analyse)."
      soil_rationale: "Ce que tu as lu et comment : quels rapports, ce que tu as converti, ce qui est douteux ou manquant. La personne le lit avant de garder les valeurs."
      task_title: "Ce qu'il faut faire, en une phrase courte : « Faire un test de sol », « Commander les plants »."
      task_notes: "Précisions : pourquoi, comment, avec qui. null l'efface."
      due_on: "Échéance, au format AAAA-MM-JJ."
      assignee_id: "Personne à qui la confier : un id de participants (list_tasks). Elle reçoit un e-mail."
      assignee_email: "À la place d'assignee_id : l'adresse d'une personne invitée qui n'a pas encore rejoint la carte (participants sans id, role invited, dans list_tasks). Elle reçoit un e-mail avec son lien d'invitation, et la tâche devient la sienne quand elle rejoint la carte."
      task_tags: "Étiquettes de la tâche, de préférence parmi celles que la carte utilise déjà (tags dans list_tasks). 20 au plus, 40 caractères chacune."
      task_feature_ids: "Éléments de la carte que la tâche concerne (identifiants donnés par list_features) : des plants, une haie, une mare… Depuis la fiche de l'élément, on voit ce qu'il y a à y faire ; depuis la tâche, on le retrouve sur la carte."
      task_numbers: "Plants que la tâche concerne, par leur numéro sur le plan (\"7\", \"9.1\"), en plus de feature_ids."
      task_feature_ids_change: "Nouvelle liste complète des éléments que la tâche concerne, qui remplace l'ancienne ([] les retire tous)."
      task_numbers_change: "Plants par leur numéro sur le plan, ajoutés à feature_ids dans la nouvelle liste."
      tags_change: "Nouvelle liste complète d'étiquettes, qui remplace l'ancienne ([] les retire toutes). Reprends les étiquettes actuelles pour en ajouter une."
      document_title: "Titre du document tel qu'il apparaît dans la bibliothèque."
      document_description: "Ce que contient le document, en une ou deux phrases. null l'efface."
      any_photo_id: "Identifiant de la photo, donné par list_photos."
      document_ids: "Identifiants des documents, donnés par list_documents."
      document_tags: "Étiquettes du document, de préférence parmi celles de la bibliothèque (tags dans list_documents). 20 au plus, 40 caractères chacune."
      upload_kind: "photo : une photo ou une vidéo du terrain (photo JPEG, PNG, WebP ou HEIC, 25 Mo au plus ; vidéo MP4, MOV ou WebM, 1 Go au plus) ; document : un document de la bibliothèque (PDF, image, Word, tableur, présentation, plan…, 200 Mo au plus)."
      signed_id: "Le signed_id que create_upload a donné pour ce fichier, après l'envoi par PUT."
      photo_ids: "Identifiants des photos, donnés par list_photos."
      album_id: "Identifiant d'un album de photos de la carte (albums dans list_photos). null sort la photo de son album."
      album_name: "Nom de l'album où ranger la photo, quand album_id manque : un album existant (sans tenir compte des majuscules) ou un nouveau, par exemple « Verger, avant travaux »."
      photo_feature_id: "Identifiant de l'élément de la carte que montre la photo (list_features). null défait le lien."
      photo_caption: "Légende de la photo, 500 caractères au plus. null l'efface."
      taken_at: "Date et heure de la prise de vue, au format ISO 8601 (2026-05-17T14:32:00+02:00). null l'efface."
      photo_location: "Endroit de la prise de vue, [longitude, latitude] en WGS84. null l'efface."
      heading: "Direction de l'appareil, en degrés depuis le nord (0 à 360, 90 = est). null l'efface."
    tools:
      list_maps:
        title: "Lister mes cartes"
        description: "Liste les cartes auxquelles l'utilisateur a accès (propriétaire, éditeur ou lecteur) : nom, rôle, étape, région, surface et brouillons en attente. Point de départ : passe ensuite l'identifiant d'une carte à get_map."
      get_map:
        title: "Lire une carte"
        description: "Fiche complète d'une carte : nom, adresse, région, surface (m²), contour du terrain en GeoJSON, centroïde [lng, lat], parcelles cadastrales, étape du projet, fiche projet (objectifs, usages, contraintes…), palette (espèces choisies), tâches du projet (à faire, en retard, faites), nombre de documents et de photos, l'année d'observation (observation_year : ce que la personne a vu sur son terrain à chaque saison des douze derniers mois, et les saisons manquantes ; le détail avec get_season_signs), nombre d'éléments par couche, étiquettes de la carte (tags, avec leur nombre d'éléments), types d'éléments connus de l'éditeur, l'offre (ses versions et le budget de la dernière version acceptée : TVAC, HTVA, heures prévues ; seulement pour l'équipe qui la prépare) et ce que cette connexion a le droit de faire sur la carte."
      list_features:
        title: "Lister les éléments"
        description: "Éléments dessinés sur la carte, en GeoJSON (FeatureCollection) : existants, eau, accès, structures, plantes, animaux, notes, et brouillons en attente. Filtres par couche, type (kind), étiquette (tag), emprise (bbox) et statut. Les réseaux restent masqués sauf demande explicite d'un éditeur. Paginé : passe next_after_id dans after_id pour la page suivante."
      get_feature:
        title: "Lire un élément"
        description: "Un élément de la carte : géométrie, attributs, justification s'il a été proposé par une IA, et mesures (surface en m², longueur et périmètre en m). Pour un plant : son état d'après sa dernière reprise notée (state) et les 20 dernières entrées de son journal (journal, journal_total ; list_plant_observations pour tout lire)."
      get_region_layers:
        title: "Couches de la région"
        description: "Catalogue des couches de données de la région de la carte (en Wallonie, celles du Géoportail : sols, relief, zones inondables, plan de secteur, cadastre…) : clé, nom, groupe, et si la couche s'interroge en un point avec identify_at_point."
      identify_at_point:
        title: "Interroger les couches en un point"
        description: "Ce que disent les couches de la région en un point du terrain : type de sol, aléa d'inondation, affectation au plan de secteur, parcelle cadastrale… Le point doit se trouver à moins de 1 km du terrain. Sans layers, toutes les couches interrogeables sont interrogées."
        params:
          layers: "Clés des couches à interroger (voir get_region_layers). Par défaut : toutes les couches interrogeables."
      get_site_data:
        title: "Données du lieu"
        description: "Ce que les sources de données ouvertes disent du lieu de la carte : soleil et horizon (PVGIS : heures de soleil possibles chaque mois sur ce terrain et rayonnement), stations météo proches et leurs relevés récents (IRM, Belgique), climat observé sur 1995-2024 (ERA5-Land : gelées, pluie, températures ; le premier appel lance le calcul, qui prend quelques minutes, status « pending » en attendant), bilan de l'eau mois par mois tiré de ce climat (pluie, évapotranspiration de référence, réserve du sol, surplus d'hiver, manque d'été, aujourd'hui et en 2050, et l'eau que la carte stocke déjà), arbres déjà en place (hauteur de canopée Meta/WRI : part du terrain sous les arbres, hauteur maximale, date des images), règles d'urbanisme et risques (en France : zonage du PLU ou de la carte communale, prescriptions, servitudes, risques Géorisques ; indicatif, jamais un avis juridique). Chaque sujet donne sa source et sa licence, ou la raison de son absence (non configuré, pas de contour, service indisponible)."
        params:
          topics: "Sujets à lire. Par défaut : tous."
      trace_contour:
        title: "Tracer une courbe de niveau"
        description: "La courbe de niveau qui passe par un point du terrain (là où le sol reste à la même hauteur), calculée sur le relief téléchargé par la personne et coupée au contour du terrain : une LineString GeoJSON, son altitude et sa longueur. Trace-la avant de proposer une baissière, une keyline, une haie en travers de la pente ou un chemin qui suit le relief, et reprends sa géométrie dans propose_features : une baissière hors courbe concentre l'eau au lieu de l'infiltrer. Sans relief téléchargé, l'outil le dit : demande alors à la personne de le télécharger dans le panneau « Eau et relief »."
      get_catchment:
        title: "Bassin versant"
        description: "Le bassin versant d'une mare, d'une baissière ou d'un jardin de pluie (feature_id), ou d'un point où l'on pourrait en creuser un (lng, lat) : la surface dont le ruissellement finit là, calculée sur le relief téléchargé par la personne. Donne sa surface (dont la part sur le terrain), son contour GeoJSON, la pluie qui y tombe par an, le volume de l'ouvrage et la pluie qui le remplit si tout ruisselle (fill_rain_mm : sous 15 mm, il déborde à chaque grosse averse ; au-delà de 50, il se remplit lentement). beyond_relief vrai : le bassin continue au-delà du relief téléchargé, la surface est un minimum ; demande alors à la personne d'où vient l'eau en amont. infiltration_mm_h : la vitesse mesurée par le test d'infiltration le plus proche (à infiltration_distance_m mètres, ou la médiane des tests de la carte si aucun n'est à moins de 50 m) ; empties_in_h : en combien d'heures une baissière ou un jardin de pluie se vide dans le sol. Utilise-le avant de proposer ou de dimensionner une mare, une baissière ou leur trop-plein."
        missing_target: "Donne feature_id (une mare, une baissière ou un jardin de pluie) ou un point (lng et lat)."
      find_keypoints:
        title: "Trouver les points clés"
        description: "Les points clés (keypoints, P.A. Yeomans) des vallons du terrain, calculés sur le relief téléchargé par la personne : là où le fond d'un vallon cesse de descendre raide (slope_above_pct) pour descendre doucement (slope_below_pct). Chacun donne la surface qui y draine (catchment_m2), le fond du vallon (valley, LineString) et sa keyline : la courbe de niveau qui passe par lui, coupée au contour du terrain. Une baissière ou une ligne d'arbres posée sur la keyline recueille l'eau du vallon et la répand vers les croupes ; les lignes parallèles se tracent au-dessus et en dessous, à égale distance. Reprends la géométrie de la keyline dans propose_features (couche water, type keyline) et explique à la personne pourquoi ce point. Une liste vide : aucun vallon ne casse nettement sa pente sur ce terrain ; une baissière sur une courbe choisie avec trace_contour reste possible."
      trace_parallels:
        title: "Tracer les parallèles d'une keyline"
        description: "Les lignes parallèles à une keyline de la carte (feature_id, type keyline), tous les spacing_m mètres, above lignes au-dessus et below en dessous, coupées au contour du terrain ; le côté amont se lit sur le relief téléchargé. Seule la keyline suit la courbe de niveau : ses parallèles gardent sa forme, si bien qu'au-dessus elles descendent doucement vers les croupes et en dessous elles y remontent, et l'eau du vallon part vers les croupes plus sèches (fall_m : la dénivelée le long de la ligne). Espacement courant : 15 à 30 m pour des baissières, 8 à 15 m pour des lignes d'arbres, 1 à 3 m pour un décompactage. Reprends chaque géométrie dans propose_features (couche water, type keyline, role parallel, le même use que la keyline)."
        params:
          spacing_m: "Écart entre deux lignes, en mètres (1 à 100)."
          above: "Nombre de lignes au-dessus de la keyline (0 à 10)."
          below: "Nombre de lignes en dessous de la keyline (0 à 10)."
      get_storm_observations:
        title: "Lire les relevés d'averse"
        description: "Ce que la personne a vu sur son terrain pendant les averses (type storm_observation) : où l'eau coulait (water flows, LineString tracée vers l'aval), où elle stagnait (pools, Polygon), où elle sortait du sol (seeps, Point), quand (observed_at), sous quelle pluie (rain : drizzle, steady, heavy, storm ; rain_mm au pluviomètre), si l'eau était boueuse (muddy, signe d'érosion), avec ses photos (photo_ids, à lire avec get_photo). relief compare chaque relevé au relief téléchargé : verdict follows (l'eau suit un axe d'écoulement, share_on_axes), diverges (elle va où le relief ne l'envoie pas : un drain, un fossé, une ornière, un sol tassé que le modèle ignore), uphill (trait tracé de bas en haut), hollow (creux du relief, hollow_m), flat (terrain plat, slope_pct), sloped (la pente devrait l'évacuer, c'est le sol qui la retient : infiltration_mm_h du test voisin s'il existe), seep (drained_m2 : la surface qui draine jusque-là). Là où le relevé contredit le relief, c'est le relevé qui a raison : dimensionne et place les ouvrages d'après lui, et demande à la personne ce qui guide l'eau à cet endroit."
      get_season_signs:
        title: "Lire le carnet des saisons"
        description: "Les signes de saison que la personne a notés sur son terrain avec l'app mobile (type season_sign, un point là où elle se tenait) : sign (first_frost premier gel, frost_pocket le givre reste ici le matin, last_frost dernière gelée, snow_melts_first la neige fond d'abord ici, snow_lingers la neige reste ici, morning_mist brume du matin, puddle flaque après la pluie, waterlogged sol détrempé, dries_first sèche ou jaunit d'abord ici, winter_sun le soleil d'hiver atteint ici, summer_shade ombre d'été, wind_exposed le vent frappe ici, animal_tracks traces d'animaux, nest un nid, browsing dégâts de chevreuil ou de lapin, pollinators butineurs, amphibians crapauds ou grenouilles, budburst débourrement, first_flowers premières fleurs, wild_fruit fruits sauvages mûrs, leaf_fall chute des feuilles), quand (observed_at), ses mots (notes) et ses photos (photo_ids, à lire avec get_photo). by_sign donne pour chaque signe, année par année, le premier et le dernier jour vu : les dates de gel du lieu, pas celles de la station météo. year compte ce qui a été observé sur le terrain à chaque saison des douze derniers mois (signes, relevés d'averse, notes de visite) ; missing nomme les saisons jamais observées. Sers-t'en dans tes justifications : un givre qui reste marque une poche d'air froid (pas de floraison précoce, secteur « air froid »), une neige qui fond d'abord un coin chaud (zone 1, cultures précoces), un sol détrempé ou des flaques une eau à ralentir ou une mare, un coin qui sèche d'abord un paillage et des plantes sobres, des traces ou des abroutissements des protections et un passage à garder, un nid un arbre ou une haie à ne pas toucher. Quand une saison manque, dis-le et propose à la personne d'aller la voir. Quand la personne te raconte un signe qu'elle a vu (« premier gel hier au bas de la prairie »), propose-le avec propose_features (couche notes, type season_sign, properties sign et observed_at, un point là où elle l'a vu) : elle l'accepte dans l'éditeur, et il entre dans son carnet."
      search_plants:
        title: "Chercher une plante"
        description: "Recherche dans le catalogue de plantes de Semisto, par nom latin ou nom commun français. Chaque donnée du catalogue garde sa source. Avec map_id, chaque plante dit aussi comment elle convient à ce terrain (fit) : un verdict par critère que le terrain permet de juger (rusticité, exposition des patchs, humidité, type de sol, pH), fits, partial, misfit ou unknown quand le catalogue ne le dit pas, et verified quand la valeur du catalogue a été vérifiée sur une source ; jamais une note. excludedBy dit quand un fait connu l'écarte (hardiness, invasive, toxic pour les animaux du projet). site dit ce que l'on sait du terrain et d'où (climat, patchs, fiche projet, analyse de sol). Avec map_id sans query : les suggestions de palette pour ce terrain, ce qui manque d'abord (fixateurs d'azote, strates absentes, mellifères, comestibles), les mieux adaptées en tête. Un « unknown » n'est pas un bon point : dis-le à la personne plutôt que de le taire."
        params:
          query: "Nom latin ou nom commun, au moins 2 caractères. Facultatif avec map_id."
          map_id: "Carte dont le terrain sert à juger chaque plante (list_maps). Facultatif."
      get_plant:
        title: "Fiche d'une plante"
        description: "La fiche d'une espèce du catalogue : nom latin, noms communs, port, strate, exigences et usages, avec la provenance de chaque donnée."
        params:
          plant_id: "Identifiant de la plante, donné par search_plants."
      get_design_guide:
        title: "Guide de méthode de Semisto"
        description: "La méthode de conception de Semisto, chapitre par chapitre : l'ordre de conception et la posture (method), l'eau (water), la terre creusée et où la mettre (earthworks), la structure (structure), la palette et les guildes (palette), le climat qui vient (climate). Chapitres rédigés en anglais. Sans topic : la liste des chapitres. À lire avant de proposer un design ou de conseiller sur l'eau, la structure ou les plantes."
        params:
          topic: "Chapitre à lire. Sans topic : la liste des chapitres, à commencer par « method »."
      get_help:
        title: "Aide de Terranova"
        description: "Le centre d'aide de Semisto Terranova : comment se servir de l'application, panneau par panneau (où cliquer, ce que montre chaque écran, les étapes du parcours). Sans argument : la liste des guides. Avec query : les guides qui en parlent, avec un extrait. Avec slug : le guide complet en Markdown, ses liens et les guides voisins. Guides rédigés en français, au tutoiement. Pour la méthode de conception elle-même, lis plutôt get_design_guide."
        params:
          slug: "Le guide à lire, par son identifiant (slug), donné par la liste ou par une recherche."
          query: "Des mots à chercher dans l'aide (fautes de frappe et synonymes acceptés)."
      list_tasks:
        title: "Lire les tâches du projet"
        description: "Les tâches de la carte (page « Tâches ») : ses listes (dont celles que Semisto ajoute par défaut, une par étape), chaque tâche avec ses notes, ses étiquettes, son échéance (et si elle est dépassée), la personne qui la porte, et si elle est faite (quand, par qui). Pour une tâche de Semisto, map_says_done dit si la carte montre déjà ce travail fait, et open_in_map ouvre le panneau où il se fait. Donne aussi les participants à qui une tâche peut être confiée et ce que cette connexion peut faire. Filtres par liste, statut, personne et étiquette. Chaque tâche dit aussi les éléments de la carte qu'elle concerne (features, avec leur numéro et leur nom, et l'adresse qui les montre sur la carte) ; feature_ids ou numbers ne gardent que les tâches d'un ou plusieurs plants."
        params:
          task_status: "pending : à faire ; done : faites ; all : toutes."
          assignee: "me : celles de l'utilisateur ; nobody : celles de personne ; anyone : toutes."
          task_tag: "Étiquette des tâches, sans tenir compte des majuscules."
          task_feature_filter: "Seulement les tâches qui concernent l'un de ces éléments (identifiants donnés par list_features)."
          task_numbers_filter: "Seulement les tâches qui concernent l'un de ces plants, par leur numéro sur le plan."
      list_harvests:
        title: "Lire le carnet de récolte"
        description: "Le carnet de récolte de la carte (panneau « Récoltes ») : chaque arbre, arbuste ou grimpante fruitière, saison par saison (seasons : les 5 dernières jusqu'à season). Pour chaque plant et chaque saison, status picked (récolté), bore (fruits vus sur l'arbre, pas encore cueillis) ou none (regardé, aucun fruit) ; amount (light, normal, heavy), uses (juice : jus, cooking : compote et cuisson, fresh : à croquer, storage : mis en garde, other) et quantityKg. Une saison absente : rien de noté. followedSeasons : les années où l'équipe a noté au moins une ligne sur la carte ; quietSeasons : les saisons suivies d'affilée, jusqu'à la dernière, sans fruits vus ni cueillis ; watch : vrai à partir de watchSeasons (3), car beaucoup de variétés anciennes ne portent qu'une année sur deux. bearingFrom : l'année où un jeune plant devrait donner ses premiers fruits (avant, il n'est jamais compté). lines : les lignes de la saison, avec leur auteur. varieties : chaque variété du lieu avec ce qu'elle donne de mieux selon le catalogue (uses : fresh à croquer, cooking compote et cuisson, juice jus, cider cidre ou poiré, drying séchage), pickingMonth (mois de cueillette), eatingFromMonth et eatingUntilMonth (saison où on la mange), keeping (keeps : se garde en cave, weeks : quelques semaines, short : à manger ou cuire tout de suite, null : inconnu), la provenance de chaque valeur (souvent « à vérifier ») et here : ce que l'équipe en a déjà fait ici. Pour conseiller jus, compote ou table, pars de ce que le lieu a vécu (here, les notes des lignes), puis du catalogue, et dis d'où vient ton conseil."
        params:
          season: "Saison (année) à lire ; par défaut l'année en cours."
      record_harvests:
        title: "Noter des récoltes"
        description: "Note des lignes dans le carnet de récolte, directement (ce ne sont pas des brouillons), quand la personne te dit ce qu'elle a vu ou cueilli : « les arbres 7, 9 et 12 ont été pressés en jus le 12 octobre ». Chaque ligne vaut pour un ou plusieurs plants, désignés par feature_ids ou par leur numéro sur le plan (numbers, comme « 9.1 ») ; tous ses plants doivent exister, sinon la ligne est refusée avec sa raison. stage on_tree : les fruits vus sur l'arbre, amount obligatoire (none pour un arbre sans fruits) ; stage picked : la récolte, amount facultatif (jamais none), uses et quantity_kg facultatifs. N'invente rien : ne note que ce que la personne a dit, et demande la date si elle ne la donne pas. 50 lignes au plus par appel. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait de la carte."
        params:
          harvest_lines: "Les lignes à noter, de 1 à 50."
          harvest_feature_ids: "Identifiants des plants (list_features, type plant)."
          harvest_numbers: "Numéros des plants sur le plan, tels qu'écrits sur la carte (\"7\", \"9.1\")."
          noted_on: "Date de l'observation ou de la cueillette (AAAA-MM-JJ), jamais dans le futur."
          harvest_stage: "on_tree : fruits vus sur l'arbre ; picked : récolté."
          harvest_amount: "none (aucun fruit, seulement pour on_tree), light (un peu), normal, heavy (beaucoup)."
          harvest_uses: "Pour une récolte : juice (jus), cooking (compote et cuisson), fresh (à croquer), storage (mis en garde), other."
          quantity_kg: "Poids récolté pour chaque plant de la ligne, en kg."
          harvest_note: "Note libre : calibre, maladies, goût, qui a cueilli."
      list_plant_observations:
        title: "Lire le journal des plants"
        description: "Le journal de chaque plant planté (« Journal du plant » sur sa fiche), du plus récent au plus ancien : des entrées datées qui ne se réécrivent jamais, chacune d'un type (kind) : follow_up (reprise : survival established repris, struggling en difficulté, dead mort), flowering (floraison), pruning (taille), damage (casse ou dégât), disease (maladie ou ravageur), intervention (protection, tuteur, paillage, arrosage, greffe…) ou other. Chaque entrée peut porter vigor (1 chétif à 5 vigoureux), une note, une photo (hasPhoto) et son auteur. states donne l'état de chaque plant d'après sa dernière entrée qui dit s'il a repris : c'est là qu'on sait qu'un arbre est mort ou en difficulté. Filtre par plants (feature_ids ou numbers), par type ou par date (since). Les fruits vus et cueillis ne sont pas ici mais dans list_harvests."
        params:
          harvest_feature_ids: "Seulement ces plants (identifiants donnés par list_features)."
          harvest_numbers: "Seulement ces plants, par leur numéro sur le plan (\"7\", \"9.1\")."
          observation_kind_filter: "Seulement les entrées de ce type."
          observations_since: "Seulement les entrées datées de ce jour ou après (AAAA-MM-JJ)."
          limit: "Nombre maximal d'entrées (200 par défaut, 500 au plus)."
      record_plant_observations:
        title: "Écrire dans le journal des plants"
        description: "Ajoute des entrées datées au journal des plants, directement (ce ne sont pas des brouillons), quand la personne te dit ce qui leur est arrivé : « le 3 avril, les pommiers 7 et 9 étaient en pleine floraison », « le 12 a perdu une charpentière dans la tempête », « le 21 est mort ». Une entrée ne touche jamais aux précédentes : c'est l'historique du plant. Chaque entrée vaut pour un ou plusieurs plants, désignés par feature_ids ou par leur numéro sur le plan (numbers) ; tous doivent exister et être plantés (une date de plantation, même « date inconnue »), sinon l'entrée est refusée avec sa raison. kind follow_up : la reprise, survival obligatoire (established repris, struggling en difficulté, dead mort) ; pour un suivi de santé, sain se note established, inquiétant ou malade struggling avec une note qui le dit (et une entrée disease pour la maladie), mort dead. Les autres types (flowering, pruning, damage, disease, intervention, other) prennent une note (obligatoire pour other) et peuvent dire aussi survival et vigor. Les fruits vus et cueillis vont dans record_harvests, les actions à faire dans create_tasks. N'invente rien : ne note que ce que la personne a dit, et demande la date si elle ne la donne pas (pour un historique sans date précise, le 1er janvier de l'année, en le disant dans la note). 100 entrées au plus par appel. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait de la carte."
        params:
          observation_entries: "Les entrées à ajouter, de 1 à 100."
          harvest_feature_ids: "Identifiants des plants (list_features, type plant)."
          harvest_numbers: "Numéros des plants sur le plan, tels qu'écrits sur la carte (\"7\", \"9.1\")."
          observed_on: "Date de ce qui est noté (AAAA-MM-JJ), jamais dans le futur."
          observation_kind: "follow_up (reprise), flowering (floraison), pruning (taille), damage (casse ou dégât), disease (maladie ou ravageur), intervention (protection, tuteur, paillage, arrosage, greffe…), other."
          observation_survival: "established (repris), struggling (en difficulté), dead (mort). Obligatoire pour follow_up."
          observation_vigor: "Vigueur de 1 (chétif) à 5 (vigoureux)."
          observation_note: "Ce qui s'est passé, en clair : 2 000 caractères au plus."
      list_storage_readings:
        title: "Lire les relevés des lieux de stockage"
        description: "Les lieux où l'équipe garde ses fruits (éléments « Lieu de stockage des fruits » : cave, chambre froide, grange, remise, frigo), chacun avec ses relevés de température et d'humidité, du plus récent au plus ancien. temperatureC : la température lue ; temperatureMinC et temperatureMaxC : le plus froid et le plus chaud depuis le relevé précédent (thermomètre mini-maxi) ; humidityPct : l'humidité relative. verdict dit pour chaque relevé si la température et l'humidité conviennent pour garder pommes et poires : good, fair (limite), bad (trop loin), frost (gel), et de quel côté (warm, cold, dry, wet). ranges donne les plages de référence (bien : 0,5 à 6 °C et 85 à 95 %). summary dit le verdict du dernier relevé et ce qu'on sait de l'hiver (novembre à mars : winterReadings, winterLowC, winterHighC), advice ce qu'il conseille. La garde se décide en hiver : si l'hiver manque, dis-le, et propose un relevé par semaine de novembre à mars."
      record_storage_readings:
        title: "Noter des relevés de stockage"
        description: "Note des relevés de température et d'humidité dans un lieu de stockage des fruits, directement (ce ne sont pas des brouillons), quand la personne te les donne : « cave : 1er mai 60 % 20° ». store_id vient de list_storage_readings ; s'il n'y a pas encore de lieu de stockage sur la carte, propose-le d'abord avec propose_features (couche structures, type fruit_store, propriété store_type) et attends que la personne l'accepte. Chaque relevé demande au moins une température ou l'humidité ; un relevé refusé revient avec sa raison, les autres sont gardés. N'invente rien : ne note que ce que la personne a dit, et demande l'année si elle ne la donne pas. 100 relevés au plus par appel. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait de la carte."
        params:
          storage_readings: "Les relevés à noter, de 1 à 100."
          store_id: "Identifiant du lieu de stockage (list_storage_readings)."
          measured_on: "Date du relevé (AAAA-MM-JJ), jamais dans le futur."
          temperature_c: "Température lue, en °C."
          temperature_min_c: "Le plus froid depuis le relevé précédent (thermomètre mini-maxi), en °C."
          temperature_max_c: "Le plus chaud depuis le relevé précédent, en °C."
          humidity_pct: "Humidité relative, en %."
          storage_note: "Note libre : porte ouverte, caisses rentrées, linge humide posé…"
      list_documents:
        title: "Lister les documents"
        description: "La bibliothèque « Documents » de la carte : plans, relevés, analyses de sol, permis, photos anciennes, tableurs… rassemblés par l'équipe ou envoyés avec la fiche projet. Pour chacun : titre, description, étiquettes, type, nom et taille du fichier, qui l'a déposé, et si get_document peut le lire (readable)."
        params:
          document_tag: "Étiquette des documents, sans tenir compte des majuscules."
          document_kind: "Type : pdf, image, text (traitement de texte), sheet (tableur), slides (présentation), plan (DWG, KML, GPX, GeoJSON), other."
      get_document:
        title: "Lire un document"
        description: "Un document de la bibliothèque et ce qu'il dit : le texte d'un PDF (page par page), d'un fichier Word ou OpenDocument, d'un texte, d'un CSV, d'un GeoJSON, d'un KML ou d'un GPX ; une image est renvoyée telle quelle, à regarder. Un long texte arrive par tranches de 40 000 caractères : passe next_offset dans offset pour la suite. Un PDF scanné, un tableur, un dessin ou une archive ne se lit pas ici : reason dit pourquoi, et la personne l'ouvre dans la bibliothèque."
        params:
          offset: "Pour un long texte : la valeur next_offset de l'appel précédent."
      create_tasks:
        title: "Ajouter des tâches"
        description: "Ajoute des tâches au projet, directement (ce ne sont pas des brouillons), quand la personne te le demande ou accepte ta proposition. Chaque tâche va dans une liste existante (list_id) ou dans la liste nommée list_name, créée si la carte ne l'a pas. Elle peut porter des notes, une échéance, des étiquettes, et être confiée à un participant de la carte (assignee_id), qui reçoit un e-mail : dis-le à la personne avant. 50 tâches au plus par appel ; une tâche refusée est renvoyée avec sa raison. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait de la carte (celui de son équipe s'il y en a un, sinon celui de son propriétaire). Une tâche peut concerner des éléments de la carte (feature_ids, ou numbers pour des plants : « Recouper les gourmands » sur les pommiers 7 et 9) : la fiche de chaque plant montre alors ce qu'il y a à y faire. Pour une même action sur plusieurs arbres, une tâche qui les concerne tous suffit ; une tâche par arbre quand chacun a sa propre échéance ou ses propres précisions."
        params:
          tasks: "Les tâches à ajouter, de 1 à 50."
          list_name: "Nom de la liste où ranger la tâche, quand list_id manque : une liste existante (sans tenir compte des majuscules) ou une nouvelle, par exemple « Chantier de mars »."
      update_tasks:
        title: "Modifier des tâches"
        description: "Modifie des tâches : les cocher ou les décocher (completed), changer leur titre ou leurs notes, les déplacer dans une autre liste, les confier à quelqu'un ou à personne, poser ou effacer une échéance, changer leurs étiquettes. Seuls les champs passés changent. Un lecteur de la carte ne peut que cocher les tâches qui lui sont confiées ; le propriétaire et les éditeurs modifient tout. Rien n'est supprimé. 50 tâches au plus par appel ; une modification refusée est renvoyée avec sa raison. Demande l'accès « brouillons » et le forfait de la carte (celui de son équipe s'il y en a un, sinon celui de son propriétaire). feature_ids et numbers remplacent la liste des éléments que la tâche concerne."
        params:
          task_changes: "Les modifications, une par tâche, de 1 à 50."
          completed: "true : la tâche est faite ; false : elle est de nouveau à faire."
          move_to_list: "Liste où déplacer la tâche (à la fin de la liste)."
          due_on_change: "Nouvelle échéance au format AAAA-MM-JJ, ou null pour l'effacer."
          assignee_change: "Personne à qui la confier (id de participants dans list_tasks), ou null pour ne la confier à personne. La personne reçoit un e-mail."
          assignee_email_change: "À la place d'assignee_id : l'adresse d'une personne invitée qui n'a pas encore rejoint la carte (participants sans id dans list_tasks), ou null pour ne la confier à personne. Elle reçoit un e-mail avec son lien d'invitation."
      add_document:
        title: "Ajouter un document"
        description: "Pour un document que tu as rédigé toi-même (pour un fichier existant, PDF, Word, image ou plan, utilise create_upload puis attach_documents). Range dans la bibliothèque « Documents » de la carte un document que tu as rédigé : compte rendu de visite, synthèse d'un entretien, calendrier de plantation en CSV, export GeoJSON… Il est déposé au nom de l'utilisateur, avec son titre, sa description et ses étiquettes. Formats : Markdown (md), texte (txt), CSV ou GeoJSON, 200 000 caractères au plus. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait de la carte (celui de son équipe s'il y en a un, sinon celui de son propriétaire)."
        params:
          document_content: "Le contenu du document, dans le format choisi."
          document_format: "md (Markdown, par défaut), txt, csv ou geojson."
      list_photos:
        title: "Lister les photos du terrain"
        description: "Les photos de la carte, des plus récentes aux plus anciennes : légende, date de prise de vue, endroit [lng, lat] et direction, album, élément lié, taille et qui l'a déposée, et si elle attend une lecture des bio-indicatrices. Donne aussi les albums. Filtres par album, élément lié et photos pas encore placées. Paginé : passe next_after_id dans after_id pour la page suivante. get_photo montre une photo."
        params:
          unplaced: "true : seulement les photos qui n'ont pas encore d'endroit sur la carte."
          photo_after: "Pagination : la valeur next_after_id de la page précédente."
      get_photo:
        title: "Regarder une photo"
        description: "Une photo du terrain, en image (sans ses métadonnées GPS), avec sa légende, sa date, son endroit, sa direction, son album, l'élément lié et ce que dit l'appareil (modèle, hauteur et nacelle d'un drone). Pour une photo de plantes sauvages à analyser, préfère get_bioindicator_photo."
      add_photo:
        title: "Ajouter une photo"
        description: "Pour une seule petite image que tu as déjà en mémoire. Pour des photos qui sont dans des fichiers, et pour tout envoi de plusieurs photos, utilise create_upload puis attach_photos : les octets ne passent pas par la conversation. Ajoute une photo du terrain à partir de son contenu en base64 (JPEG, PNG, WebP ou HEIC, 15 Mo au plus). Tu peux la légender, la dater, la placer, donner sa direction, la ranger dans un album (existant ou nouveau, par son nom) et la lier à un élément de la carte. Une photo déjà présente sur la carte est refusée. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait de la carte (celui de son équipe s'il y en a un, sinon celui de son propriétaire)."
        params:
          image_base64: "Le fichier de l'image en base64 (une adresse data:image/…;base64, est acceptée)."
          photo_filename: "Nom du fichier, par exemple verger-nord.jpg."
      update_photos:
        title: "Modifier des photos"
        description: "Change la légende, la date, l'endroit, la direction, l'album (existant ou nouveau, par son nom) ou l'élément lié de photos du terrain. Seuls les champs passés changent ; null efface. L'image elle-même ne change pas. 50 photos au plus par appel ; une modification refusée est renvoyée avec sa raison. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait de la carte (celui de son équipe s'il y en a un, sinon celui de son propriétaire)."
        params:
          photo_changes: "Les modifications, une par photo, de 1 à 50."
      delete_photos:
        title: "Supprimer des photos"
        description: "Supprime des photos du terrain, avec leurs esquisses et leurs mises en image, comme « Supprimer » sur la page Photos. Définitif : ne le fais que quand la personne te l'a demandé, en lui disant d'abord quelles photos partent. 50 photos au plus par appel. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait de la carte (celui de son équipe s'il y en a un, sinon celui de son propriétaire)."
      create_upload:
        title: "Préparer l'envoi de fichiers"
        description: "Première étape pour envoyer des photos ou des documents sans faire passer leurs octets par la conversation. Pour chaque fichier (50 au plus), donne son type d'usage (kind), son nom, sa taille en octets, son empreinte MD5 en base64 et son type MIME ; tu reçois un signed_id, une adresse d'envoi (upload_url, valable 15 minutes) et les en-têtes à renvoyer tels quels. Un fichier de plus de 32 Mo (une vidéo, un gros PDF) s'envoie en morceaux de 32 Mo : tu reçois alors parts_url, part_count et script, une boucle shell prête à l'emploi qui envoie chaque morceau par PUT vers parts_url/1, parts_url/2… (adresses valables 6 heures) ; un morceau en échec se renvoie seul, et attach_photos ou attach_documents les rassemble. Deuxième étape, envoie toi-même chaque fichier par HTTP PUT, par exemple : curl --fail -X PUT --data-binary @IMG_0042.jpg -H 'Content-Type: image/jpeg' -H 'Content-MD5: …' '<upload_url>' (la commande prête à l'emploi est dans curl). Calcule l'empreinte avec : openssl md5 -binary IMG_0042.jpg | base64 ; la taille avec : wc -c < IMG_0042.jpg. Troisième étape, rattache les fichiers envoyés avec attach_photos ou attach_documents. Un type refusé ou un fichier trop lourd est refusé dès cette étape, avec son code (unsupported_type, too_large, invalid_checksum). Un fichier jamais rattaché est effacé après 24 heures. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait de la carte (celui de son équipe s'il y en a un, sinon celui de son propriétaire)."
        params:
          upload_files: "Les fichiers à envoyer, de 1 à 50."
          upload_filename: "Nom du fichier avec son extension, par exemple DJI_0042.JPG ou analyse-sol.pdf."
          byte_size: "Taille exacte du fichier en octets (wc -c < fichier)."
          checksum: "Empreinte MD5 du fichier, en base64 (openssl md5 -binary fichier | base64), 24 caractères."
          content_type: "Type MIME du fichier, par exemple image/jpeg, application/pdf ou application/vnd.openxmlformats-officedocument.wordprocessingml.document. C'est l'en-tête Content-Type de l'envoi."
      attach_photos:
        title: "Rattacher des photos envoyées"
        description: "Dernière étape après create_upload et l'envoi par PUT : fait des fichiers envoyés des photos ou des vidéos du terrain (50 au plus par appel). Comme pour une photo déposée dans Terranova, la date de prise de vue, l'endroit et la direction sont lus dans les EXIF du fichier, et l'appareil (modèle, données d'un drone DJI) juste après ; ce que tu passes (légende, date, endroit, direction, album par son id ou son nom, élément lié) l'emporte sur les EXIF. Une photo HEIC devient un JPEG ; une vidéo (MP4, MOV, WebM) reste telle quelle, et son lieu et sa date sont lus dans le fichier juste après. Une photo refusée revient avec son code et sa raison (other_map : préparée pour une autre carte ; already_attached : déjà rattachée ; not_received : le PUT n'a pas été fait ; parts_missing : des morceaux manquent ; duplicate : déjà sur la carte ; unsupported_type…), les autres passent. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait de la carte (celui de son équipe s'il y en a un, sinon celui de son propriétaire)."
        params:
          attach_photo_lines: "Les photos à rattacher, une par fichier envoyé, de 1 à 50."
      attach_documents:
        title: "Rattacher des documents envoyés"
        description: "Dernière étape après create_upload et l'envoi par PUT : range les fichiers envoyés dans la bibliothèque « Documents » de la carte (50 au plus par appel), chacun avec son titre et, si tu veux, une description et des étiquettes. Tous les types de fichiers passent (PDF, images, Word, tableurs, plans DWG ou KML, archives…) ; un fichier nommé PDF ou image doit l'être vraiment. get_document lit ensuite le texte d'un PDF ou d'un Word. Un document refusé revient avec son code et sa raison, les autres passent. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait de la carte (celui de son équipe s'il y en a un, sinon celui de son propriétaire)."
        params:
          attach_document_lines: "Les documents à rattacher, un par fichier envoyé, de 1 à 50."
      import_from_url:
        title: "Importer des fichiers depuis une adresse"
        description: "Quand le fichier n'est pas sur ta machine : Semisto Terranova va le chercher lui-même à son adresse HTTPS publique (fichier Drive partagé, lien de téléchargement…) et en fait une photo ou un document, comme attach_photos et attach_documents (EXIF lus pour une photo). Un lien Drive « /file/d/… » est converti en lien de téléchargement. 10 fichiers au plus par appel. Une page web (lien qui demande une connexion, page d'aperçu) est refusée avec le code not_a_file. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait de la carte (celui de son équipe s'il y en a un, sinon celui de son propriétaire)."
        params:
          import_files: "Les fichiers à importer, de 1 à 10."
          import_url: "Adresse HTTPS publique du fichier."
      prepare_offline_site:
        title: "Préparer le site hors ligne"
        description: "Prépare la carte en site hors ligne, comme « Exporter › Site hors ligne » dans l'éditeur : un zip qui s'ouvre dans n'importe quel navigateur, sans compte ni connexion (double-clic sur index.html), avec le plan sur sa photo aérienne, le jardin au fil des années, les photos, les documents, le GeoJSON et la liste des plantes. Pour le terrain sans réseau, une clé USB, ou pour garder son travail quoi qu'il arrive. La préparation prend quelques minutes : status building, rappelle l'outil plus tard ; status ready donne download_url, le lien que la personne ouvre elle-même, connectée, dans son navigateur (tu ne le télécharges pas). Un site prêt est rendu tel quel ; rebuild en prépare un nouveau avec la carte d'aujourd'hui. Tous les rôles, toutes les formules, cartes archivées comprises."
        params:
          offline_rebuild: "true pour préparer un nouveau site même si un site prêt existe (la carte a changé depuis)."
      delete_documents:
        title: "Supprimer des documents"
        description: "Supprime des documents de la bibliothèque, comme « Supprimer » sur la page Documents. Définitif : ne le fais que quand la personne te l'a demandé, en lui disant d'abord quels documents partent. 50 au plus par appel. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait de la carte (celui de son équipe s'il y en a un, sinon celui de son propriétaire)."
      update_document:
        title: "Modifier un document"
        description: "Change le titre, la description ou les étiquettes d'un document de la bibliothèque, par exemple pour le ranger sous les étiquettes que l'équipe utilise déjà. Pour un document Markdown (.md), content remplace aussi tout son texte : c'est la page que l'équipe lit et modifie dans Terranova, alors relis-la d'abord avec get_document et garde ce que la personne n'a pas demandé de changer. Les autres fichiers ne changent pas, et rien n'est supprimé. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait de la carte (celui de son équipe s'il y en a un, sinon celui de son propriétaire)."
        params:
          document_new_content: "Le nouveau texte complet d'un document Markdown (.md), qui remplace l'ancien."
      propose_features:
        title: "Proposer des brouillons"
        description: "Pose des éléments en brouillon sur la carte ; l'humain les accepte, les ajuste ou les refuse un par un dans l'éditeur : l'IA ne modifie jamais la carte directement. Chaque élément exige une justification (rationale) qui dit pourquoi et avec quelles données. Géométries GeoJSON en WGS84 ([longitude, latitude]), à moins de 200 m du contour du terrain, 200 éléments au plus par appel. Les éléments refusés à la validation sont renvoyés avec leur raison : corrige et renvoie seulement ceux-là. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait de la carte (celui de son équipe s'il y en a un, sinon celui de son propriétaire)."
        params:
          summary: "Résumé de la proposition dans son ensemble, montré à l'humain au-dessus des brouillons."
          features: "Les éléments proposés, de 1 à 200."
          feature_layer: "Couche de l'élément. Les réseaux ne peuvent pas être proposés."
          feature_kind: "Type d'élément en snake_case, par exemple fruit_tree, hedge, pond, swale, path, raised_bed. Les types connus de l'éditeur sont dans known_kinds (get_map). Pour montrer au client une zone du design (forêt-jardin, patch, point de vue…), utilise zone (surface) ou line (tracé) dans la couche notes, avec un nom et une couleur : le nom s'écrit sur la carte avec la surface ou la longueur."
          feature_geometry: "Géométrie GeoJSON (Point, LineString, Polygon ou Multi…), coordonnées [longitude, latitude] en WGS84."
          feature_name: "Nom court affiché sur la carte."
          feature_color: "Couleur de l'élément sur la carte, en hexadécimal (#7fa650). Des tons doux distinguent les zones voisines : #7fa650, #8b5e3c, #d08b3a, #c48a96, #5b7fa6, #9a7fb8, #c9b03a, #4f8f86."
          feature_notes: "Notes complémentaires : variétés, entretien, phasage…"
          feature_rationale: "Pourquoi cet élément, ici, et avec quelles données (fiche projet, couches, relief, existant…). Obligatoire, 10 caractères au moins."
          feature_properties: "Attributs libres, par exemple species, height_m, spacing_m."
          feature_tags: "Étiquettes de l'élément, de préférence parmi celles que la carte utilise déjà (tags dans get_map), par exemple « phase 1 » ou « zone nord ». 20 au plus, 40 caractères chacune."
      propose_sectors:
        title: "Proposer une analyse des secteurs"
        description: "Pose en brouillons les secteurs du terrain (analyse des secteurs de la permaculture) : les influences qui arrivent de l'extérieur, chacune d'un éventail de directions — vents dominants, vents froids, risque d'incendie, inondation ou ruissellement, air froid et gel, bruit, poussière, pollution, belles et vilaines vues, vis-à-vis, faune, prédateurs. Tu donnes pour chaque secteur son type et ses directions ; Terranova dessine lui-même son arc autour du terrain, tu n'as aucune géométrie à calculer. Les directions sont des degrés comptés depuis le nord dans le sens des aiguilles d'une montre (0 = nord, 90 = est, 180 = sud, 270 = ouest) ; le secteur va de from_deg à to_deg en tournant dans ce sens, si bien que 300 → 40 passe par le nord, et deux valeurs égales (0 → 0) font tout le tour. Ne propose pas les secteurs du soleil d'été et d'hiver : Terranova les calcule d'après la latitude. Pour les vents, lis le climat observé de get_site_data ; pour l'air froid qui descend et les inondations, le relief (trace_contour, get_catchment) ; et demande à la personne ce qu'elle voit et entend sur place (la route bruyante, la vue à garder, le voisin, les chevreuils) : elle connaît son lieu mieux que les données. Chaque secteur exige une justification (rationale) qui dit d'où vient l'information. Les secteurs arrivent en brouillons dans l'éditeur, où l'humain les revoit un par un dans le panneau « Secteurs » et les accepte, les ajuste ou les refuse. 30 secteurs au plus par appel. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait de la carte (celui de son équipe s'il y en a un, sinon celui de son propriétaire)."
        params:
          summary: "Résumé de l'analyse dans son ensemble, montré à l'humain au-dessus des brouillons, par exemple « Secteurs d'après le climat observé et la visite du 12 octobre »."
          sectors: "Les secteurs proposés, de 1 à 30."
          sector_type: "Type de secteur : wind (vent dominant), cold_wind (vent froid), fire (incendie), flood (inondation, ruissellement), frost (gel, air froid), noise (bruit), dust (poussière), pollution, good_view (belle vue), bad_view (vue à masquer), privacy (vis-à-vis), wildlife (faune), predators (prédateurs), other (autre)."
          from_deg: "Direction où commence le secteur, en degrés depuis le nord dans le sens des aiguilles d'une montre (0 = nord, 90 = est, 180 = sud, 270 = ouest), de 0 à 360."
          to_deg: "Direction où finit le secteur, en tournant dans le sens des aiguilles d'une montre depuis from_deg (300 → 40 passe par le nord). Égale à from_deg : tout autour du terrain."
          season: "Saison où le secteur compte : all_year (toute l'année, par défaut), winter (hiver) ou summer (été)."
          sector_name: "Nom court écrit le long de l'arc sur la carte et dans le dossier du projet, 60 caractères au plus, par exemple « Vents d'ouest » ou « Route »."
          sector_notes: "Ce que ce secteur veut dire pour le design : quoi faire de cette influence (une haie brise-vent, une vue à cadrer, une zone coupe-feu…)."
          sector_rationale: "D'où vient ce secteur : le climat observé, le relief, ce que la personne a dit ou vu sur place… Obligatoire, 10 caractères au moins."
      propose_palette:
        title: "Proposer des plantes pour la palette"
        description: "Verse une liste de plantes dans la palette de la carte, en brouillons que l'humain accepte ou refuse dans le panneau Palette : par exemple la liste que l'utilisateur tient dans un tableur, un PDF ou l'export d'un autre outil, ou tes propres choix. Chaque plante est reconnue par species_id (search_plants) ou, à défaut, par son nom latin ou commun exact ; un nom introuvable ou ambigu est renvoyé avec sa raison : cherche-le avec search_plants et renvoie-le avec son species_id. Un cultivar se donne par variety_id (get_plant) ou par son nom (variety_name) : un nom que le catalogue ne connaît pas encore devient un cultivar quand l'humain accepte le brouillon. Une espèce ou un cultivar déjà dans la palette (ou déjà proposé) est refusé. 200 plantes au plus par appel. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait de la carte (celui de son équipe s'il y en a un, sinon celui de son propriétaire)."
        params:
          summary: "Résumé de la proposition, par exemple d'où vient la liste."
          plants: "Les plantes proposées, de 1 à 200."
          species_id: "Identifiant de l'espèce, donné par search_plants. Prioritaire sur name."
          plant_name: "Nom de la plante tel qu'il figure dans la source (latin ou commun), quand species_id manque."
          variety_id: "Identifiant d'un cultivar de l'espèce (get_plant), facultatif."
          variety_name: "Nom du cultivar, quand variety_id manque (« Double Philippe »). S'il est au catalogue (accents, tirets et majuscules ignorés), c'est celui-là ; sinon le cultivar sera créé au catalogue quand l'humain acceptera le brouillon, pas avant."
          strata: "Strate jouée sur ce design, si elle diffère de celle de l'espèce."
          role: "Rôle : food (nourricier), support (soutien), pioneer (pionnier), hedge (haie), ornamental (ornement)."
          target_count: "Nombre de plants visés, s'il est connu (par exemple une quantité du tableur)."
          plant_notes: "Notes : variété souhaitée, fournisseur, emplacement prévu…"
          plant_rationale: "Pourquoi cette plante, ou d'où elle vient (« ligne 12 du tableur de l'utilisateur »). Obligatoire, 10 caractères au moins."
      get_soil_samples:
        title: "Lire les points de prélèvement de sol"
        description: "Les points de prélèvement de sol de la carte (panneau Sol, onglet Points) : nom, état, profondeur, date, laboratoire, référence du rapport, position, résultats déjà saisis (results, dans les unités de result_fields), autres valeurs (other_results : métaux lourds, azote… telles que le laboratoire les écrit), rapports PDF joints (reports, un par analyse, à lire avec get_soil_report) et si des valeurs proposées attendent encore la revue (draft_pending). Donne aussi les champs typés des résultats, avec leurs unités et leurs bornes, pour propose_soil_results."
      get_soil_report:
        title: "Lire un rapport de laboratoire"
        description: "Un rapport PDF d'un point de prélèvement (reports dans get_soil_samples) : son texte, par tranches de 40 000 caractères (offset), avec les champs typés et la note sur les unités. Un scan n'a pas de texte : ses pages arrivent alors en images, 4 à la fois (first_page). Lis tout le rapport, puis propose les valeurs avec propose_soil_results."
        params:
          offset: "Pour un long rapport : la valeur next_offset de l'appel précédent."
          first_page: "Pour un scan : première page à recevoir en image (next_first_page de l'appel précédent)."
      propose_soil_results:
        title: "Proposer les résultats d'un laboratoire"
        description: "Propose les valeurs lues dans les rapports d'un point de prélèvement (get_soil_report), que l'humain garde ou refuse une par une sur le point (panneau Sol, onglet Points) : rien n'entre dans les résultats sans lui. results reçoit les champs typés (clés de result_fields), convertis dans leurs unités ; other_results reçoit tout le reste, tel que le laboratoire l'écrit (métaux lourds, azote total, sodium, oligo-éléments…), une ligne par paramètre. Tu peux aussi proposer le laboratoire, la référence du rapport et la date du prélèvement. Une valeur égale à celle déjà saisie est ignorée ; une valeur hors bornes est refusée (rejected). Une nouvelle proposition pour le même point remplace celle qui n'a pas encore été revue. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait du propriétaire de la carte."
      get_bioindicator_photo:
        title: "Regarder une photo de plantes sauvages"
        description: "Une photo de plantes sauvages prise sur le terrain (les photos « à analyser » sont dans bioindicators.photos de get_map), en image, avec où et quand elle a été prise, ce qui en a déjà été noté et la liste des plantes bio-indicatrices de Semisto (clés à utiliser dans propose_bioindicators). Regarde toute la photo : elle montre souvent plusieurs espèces. Ensuite, propose ce que tu vois avec propose_bioindicators."
        params:
          photo_id: "Identifiant de la photo, donné par get_map (bioindicators.photos)."
      propose_bioindicators:
        title: "Proposer les plantes vues sur une photo"
        description: "Verse les plantes sauvages que tu reconnais sur une photo (get_bioindicator_photo) en brouillons, posés à l'endroit de la photo, que l'humain accepte ou refuse dans le panneau Sol (onglet Plantes), avec une courte lecture du sol gardée avec la photo. Pour chaque plante : son nom français, son nom latin, la clé de la liste des bio-indicatrices si elle y est (sinon le nom latin suffit), son abondance sur la photo et ta confiance. Ne propose que ce que tu vois vraiment ; une identification douteuse se dit avec confidence « low ». Une nouvelle proposition pour la même photo remplace ses brouillons pas encore revus. 30 plantes au plus par appel. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait de la carte (celui de son équipe s'il y en a un, sinon celui de son propriétaire)."
        params:
          photo_id: "Identifiant de la photo regardée avec get_bioindicator_photo."
          soil_summary: "Ce que les plantes de la photo disent du sol, ensemble, en quelques phrases simples, avec tes réserves (une photo ne suffit pas)."
          wild_plants: "Les plantes reconnues sur la photo, de 1 à 30."
          catalog_key: "Clé de la plante dans la liste des bio-indicatrices (bioindicator_list de get_bioindicator_photo), si elle y est."
          wild_plant_name: "Nom français courant de la plante."
          latin_name: "Nom latin de la plante."
          abundance: "Abondance sur la photo : rare, present (présente), frequent (fréquente) ou dominant (dominante)."
          confidence: "Ta confiance dans l'identification : high (sûre), medium (probable) ou low (incertaine)."
          wild_plant_rationale: "Ce qui te fait la reconnaître sur la photo (feuilles, fleurs, port…) et où elle est sur l'image. Obligatoire, 10 caractères au moins."
      get_implementation_plan:
        title: "Lire le plan de mise en œuvre"
        description: "Le plan de mise en œuvre de la carte (« Mise en œuvre ») : ses phases dans l'ordre, avec leurs dates, ce que chacune construit et plante (regroupé par type d'élément ou par espèce, avec les identifiants des éléments), le travail estimé (heures à la main ; machine pour un chantier à la pelleteuse) et le coût (prix des plants de la palette et autres frais), face au temps et au budget annoncés dans la fiche projet, et les conseils du guide (season : chantier hors de sa saison ; time : plus d'heures que la personne n'en a ; machine ; availability : une saison où elle n'est pas libre ; budget). Donne aussi ce qui n'est encore dans aucune phase, les éléments dessinés comme déjà là (drawn_as_existing_ids, qui n'entrent dans le plan qu'une fois « En projet ») et les phases proposées par une IA qui attendent l'humain. Seul le travail restant entre dans le plan : une plante sans planted_on, un autre élément avec planned: true."
      propose_phases:
        title: "Proposer des phases de mise en œuvre"
        description: "Propose des phases pour le plan de mise en œuvre de la carte, en brouillons que l'humain accepte ou refuse sur la page « Mise en œuvre » : chacune avec son nom, ses dates (sa saison de travail), ses notes, sa justification et les éléments qu'elle construirait ou planterait (feature_ids, voir get_implementation_plan). Accepter une phase lui donne ces éléments. Suis l'ordre de Semisto (get_design_guide, topic method) : eau, terre et accès en fin d'été et en automne ; haies, brise-vent, arbres de structure et fixatrices d'azote au premier hiver ; strates basses au printemps ; fruitiers et arbustes l'hiver suivant ; et garde chaque phase dans le temps que la personne a. Pour déplacer des éléments dans une phase existante, utilise propose_feature_updates avec la propriété phase_id. 10 phases au plus par appel. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait de la carte (celui de son équipe s'il y en a un, sinon celui de son propriétaire)."
        params:
          summary: "Résumé de la proposition, par exemple le parti pris du phasage."
          phases: "Les phases proposées, de 1 à 10."
          phase_name: "Le nom de la phase, en français (« L'eau et la terre », « Premier hiver : la haie brise-vent »)."
          starts_on: "Premier jour de la phase (AAAA-MM-JJ)."
          ends_on: "Dernier jour de la phase (AAAA-MM-JJ), au plus tôt le premier."
          phase_notes: "Notes pratiques pour la personne : qui aide, quel matériel louer, où commander les plants."
          phase_rationale: "Pourquoi cette phase, à cette saison, avec ces éléments, en une ou deux phrases que la personne comprend (saison, temps disponible, ordre eau-structure-plantes)."
          phase_feature_ids: "Les éléments de la carte que cette phase construirait ou planterait (identifiants de get_implementation_plan ou list_features)."
      get_project_sheet:
        title: "Lire la fiche projet"
        description: "La fiche projet de la carte avec toutes ses questions : pour chaque section et chaque champ, son type, son libellé, les réponses possibles (clé et libellé français), la réponse actuelle, l'avancement de la fiche et les réponses déjà proposées par une IA qui attendent l'humain. À lire avant propose_project_sheet, pour faire correspondre ce que dit la personne aux réponses possibles."
      propose_project_sheet:
        title: "Proposer des réponses pour la fiche projet"
        description: "Verse des réponses dans la fiche projet de la carte, en brouillons que l'humain accepte ou refuse sur la fiche : ce que la personne t'a dit au fil de la conversation, ou ce que dit le transcript d'un entretien qu'elle te confie. Chaque réponse vise un champ (section et field, voir get_project_sheet) et donne sa valeur complète : une clé pour un choix unique, une liste de clés pour un choix multiple, un entier, un texte, ou une liste d'objets pour les personnes. Une réponse identique à la réponse actuelle est ignorée ; une nouvelle proposition pour un champ remplace la précédente pas encore revue. Une réponse qui remplacerait une réponse déjà donnée est renvoyée avec replaces : dis-le à la personne. Pour compléter un champ libre (notes), reprends le texte actuel dans ta valeur. N'invente rien. 60 réponses au plus par appel. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait de la carte (celui de son équipe s'il y en a un, sinon celui de son propriétaire)."
        params:
          summary: "Résumé de la proposition, par exemple d'où viennent les réponses (« entretien du 3 octobre avec Marie »)."
          answers: "Les réponses proposées, de 1 à 60."
          section: "Section de la fiche : who (qui), ambitions, uses (usages), budget, time (temps), skills (compétences), constraints (contraintes), opportunities (opportunités), livestock (élevages), calendar (calendrier)."
          field: "Clé du champ dans la section, par exemple goals, initial, hours_per_week ou notes (voir get_project_sheet)."
          value: "Valeur complète du champ : une clé (choix unique), une liste de clés (choix multiple), un entier, un texte, ou pour who.people une liste d'objets { name, role, note }."
          answer_rationale: "D'où vient cette réponse : ce que la personne a dit, cité si possible (« \"on a deux heures le week-end\" »), ou la ligne du transcript. Obligatoire, 10 caractères au moins."
      propose_feature_updates:
        title: "Proposer des modifications"
        description: "Pour changer un élément déjà accepté (date de plantation, espèce, conduite en trogne ou en cépée, forme et porte-greffe d'un fruitier greffé, nom, étiquettes, notes, position) ; pour en créer un nouveau, utilise propose_features. Rien ne change sur la carte avant que l'humain accepte : il voit chaque modification champ par champ (avant → après) avec ta justification, et peut tout accepter ou tout refuser d'un clic pour un même appel. Deux façons d'appeler : updates, une liste de 1 à 200 modifications { feature_id, changes, rationale } ; ou filter, changes et rationale, qui appliquent les mêmes changements à tous les éléments actifs choisis par le filtre (500 au plus, le nombre ciblé est renvoyé dans targeted). Exemple de lot : { filter: { tag: \"strate basse\" }, changes: { properties: { planted_on: \"2026-05-23\" } }, rationale: \"Herbacées plantées le 23/05/2026, d'après la personne.\" }. Chaque élément est vérifié seul : un élément introuvable, d'une autre carte ou pas actif, une date pas au format AAAA-MM-JJ, une espèce ou une variété inconnue reviennent dans rejected avec leur raison ; ce qui ne change rien revient dans unchanged ; une nouvelle proposition sur un élément remplace la précédente pas encore revue. Les réseaux ne peuvent pas être modifiés. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait de la carte (celui de son équipe s'il y en a un, sinon celui de son propriétaire)."
        params:
          summary: "Résumé de la proposition dans son ensemble, montré à l'humain au-dessus des modifications, par exemple « Dates de plantation des herbacées »."
          updates: "Les modifications, une par élément, de 1 à 200. N'utilise pas filter avec updates."
          changes: "Ce qui change. name, notes, tags (liste complète qui remplace l'ancienne), properties (fusionnées clé par clé : une clé à null est supprimée ; planted_on, species_id, variety_id, training, graft_form, trunk_height, rootstock_vigor, rootstock et count passent par là) et geometry. Interdit : layer, kind, status et les champs système (id, source, updated_at…)."
          change_name: "Nouveau nom court affiché sur la carte ; null l'efface."
          change_notes: "Nouvelles notes, qui remplacent les anciennes ; null les efface."
          change_tags: "Liste complète des étiquettes, qui remplace l'ancienne ([] les retire toutes). Reprends les étiquettes actuelles pour en ajouter une."
          change_properties: "Attributs à changer, fusionnés avec ceux de l'élément ; une clé à null est supprimée. Pour une plante : planted_on (date de plantation, AAAA-MM-JJ, pas dans le futur), planted_on_precision (year quand seule l'année est connue, planted_on étant alors le 1er janvier ; unknown pour une plante en terre depuis une date que personne ne connaît, planted_on étant alors le jour où on l'a notée ; null pour une date exacte), species_id et variety_id (search_plants, get_plant), training (conduite d'un arbre ou d'un arbuste : pollard pour une trogne, coppice pour une cépée, null s'il pousse librement ; change sa taille et sa forme dans la vue 3D), pour un fruitier greffé graft_form (bush pour une basse-tige, half_standard pour une demi-tige, standard pour une haute-tige), trunk_height (hauteur du tronc en mètres, de 0,2 à 3 : il ne grandit plus après la plantation), rootstock_vigor (very_dwarf, dwarf, semi_dwarf, semi_vigorous ou vigorous : M27, M9, M26, MM106, MM111 ou franc pour un pommier ; fixe la taille adulte) et rootstock (le nom du porte-greffe, 40 caractères au plus), count (nombre de plants, entier positif), number (numéro du plant sur la carte, entier positif : si une autre plante le porte, elle prend en échange le numéro que celle-ci quitte, ce que dit swaps_with dans la réponse ; pour renuméroter toute une carte, propose tous les nouveaux numéros dans un même appel, chacun une seule fois). Pour tout autre élément (mare, haie, chemin…) : planned (true quand il est encore en projet, absent quand il est sur le terrain) et built_on (date de réalisation, AAAA-MM-JJ)."
          change_geometry: "Nouvelle géométrie GeoJSON, du même type que l'actuelle (un Point reste un Point), en WGS84 [longitude, latitude], à moins de 200 m du contour du terrain."
          update_rationale: "Pourquoi cette modification, et d'où vient l'information (ce que la personne a dit, une photo, un document…). Obligatoire, 10 caractères au moins."
          filter: "Choisit les éléments actifs à modifier avec les mêmes changes : tag, kind, layer, species_id, ids, combinables. À utiliser avec changes et rationale, sans updates."
          filter_layer: "Couche des éléments à modifier. Les réseaux ne peuvent pas être modifiés."
          filter_species_id: "Seulement les plantes de cette espèce (species_id du catalogue)."
          filter_ids: "Seulement ces éléments (identifiants donnés par list_features), 500 au plus."
      propose_deletions:
        title: "Proposer des suppressions"
        description: "Pour retirer de la carte des éléments déjà acceptés (une plante, un arbre, une mare, une haie, un chemin, une note…), seulement quand la personne te l'a demandé. Rien ne disparaît avant que l'humain accepte : il voit chaque suppression avec ta justification, dans la même revue que propose_feature_updates, et peut tout accepter ou tout refuser d'un clic pour un même appel. Une suppression acceptée met l'élément à la corbeille de la carte, avec ses photos, son journal et ses récoltes : la personne peut l'annuler, et l'élément est effacé pour de bon après 30 jours. feature_ids : les éléments à supprimer (list_features, 500 au plus), avec une seule rationale pour tous. Un élément introuvable, pas actif (un brouillon se retire avec withdraw_draft) ou un réseau revient dans rejected avec sa raison ; une suppression déjà proposée revient dans unchanged ; elle remplace la modification de l'élément pas encore revue. withdraw_draft (update_ids) retire une suppression proposée. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait de la carte (celui de son équipe s'il y en a un, sinon celui de son propriétaire)."
        params:
          summary: "Résumé de la proposition, montré à l'humain au-dessus des suppressions, par exemple « Pommiers morts de l'hiver »."
          feature_ids: "Identifiants des éléments actifs à supprimer (donnés par list_features), 500 au plus."
          rationale: "Pourquoi supprimer ces éléments, et d'où vient la demande (ce que la personne a dit, une photo, un relevé…). Obligatoire, 10 caractères au moins."
      withdraw_draft:
        title: "Retirer des brouillons"
        description: "Retire des brouillons proposés par une IA et pas encore revus, par exemple pour les remplacer par une meilleure proposition : des éléments (feature_ids, donnés par propose_features) ou des modifications et des suppressions d'éléments existants (update_ids, donnés par propose_feature_updates et propose_deletions). Les éléments et les modifications acceptés appartiennent aux humains : ils ne peuvent pas être retirés."
        params:
          feature_ids: "Identifiants des éléments en brouillon à retirer."
          update_ids: "Identifiants des modifications proposées à retirer (id dans created de propose_feature_updates, ou pending_update.id dans list_features)."
