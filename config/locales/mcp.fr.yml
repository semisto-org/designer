      intro: "Le serveur suit la spécification d'autorisation MCP : OAuth 2.1 avec enregistrement dynamique des clients (RFC 7591), code d'autorisation avec PKCE S256, indicateur de ressource (RFC 8707) et jetons de rafraîchissement à usage unique. Les jetons d'accès durent %{minutes} minutes, les jetons de rafraîchissement %{days} jours."
      endpoints:
        protectedResourceMetadata: "Métadonnées de la ressource (RFC 9728)"
