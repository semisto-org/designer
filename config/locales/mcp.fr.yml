        drafts: "Proposer et retirer des brouillons, écrire des tâches, des documents et des photos. L'utilisateur le choisit sur la page de consentement ; il faut aussi le rôle d'éditeur ou de propriétaire sur la carte (un lecteur coche seulement ses propres tâches) et, pour proposer ou écrire, le forfait du propriétaire de la carte."
      tokens: "Les jetons personnels (sdp_…) se créent dans le compte de l'utilisateur, avec les mêmes accès. Exemple d'appel :"
    guardrails:
      never: "L'IA ne modifie jamais la carte directement : elle pose des brouillons, que l'humain accepte, ajuste ou refuse un par un."
      tasks: "Sur les tâches, la bibliothèque de documents et les photos, le carnet de l'équipe, l'IA écrit directement, comme un coéquipier, quand la personne le lui demande ; elle ne supprime rien, sauf les photos et documents que la personne lui demande de retirer. Les fichiers qu'elle envoie passent par une adresse signée, valable 15 minutes et liée à une seule carte."
      rationale: "Chaque brouillon porte sa justification (rationale) : pourquoi, et avec quelles données."
