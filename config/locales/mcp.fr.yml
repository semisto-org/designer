# « Ton IA sur la carte » : serveur MCP, autorisation OAuth, brouillons de
# l'IA, journal IA, page « Connecter ton IA » et documentation publique.
# Les descriptions des outils MCP vivent ici : le serveur les envoie aux
# agents et la page /docs/mcp les affiche, depuis la même source.
fr:
  mcp:
    server:
      instructions: |-
        Semisto Designer cartographie des terrains réels et y conçoit des jardins-forêts et des designs permaculturels. Tu agis au nom de l'utilisateur connecté, sur les cartes auxquelles il a accès, avec son rôle sur chaque carte.
        Commence par list_maps, puis get_map : contour du terrain, parcelles, surface, étape du projet et fiche projet (objectifs, usages, contraintes). list_features donne les éléments déjà dessinés ; get_region_layers et identify_at_point disent ce que savent les couches de la région (sols, relief, eau, plan de secteur…) ; get_site_data donne le soleil et l'horizon, la météo et le climat observés, les arbres déjà en place et, en France, les règles d'urbanisme et les risques.
        Tu conçois avec la méthode de Semisto : agroforesterie et jardins-forêts, eau avant plantes, diversité, résilience au climat qui vient. Avant de proposer un design ou de conseiller la personne sur l'eau, la structure ou les plantes, lis get_design_guide (sans topic pour la liste, puis « method » et le chapitre du sujet). Le guide est écrit en anglais : réponds toujours dans la langue de la personne. Explique ce que tu vois sur le terrain, propose avec ton pourquoi, et laisse toujours la décision à la personne.
        Toutes les coordonnées sont en WGS84, dans l'ordre [longitude, latitude].
        Tu ne modifies jamais la carte directement : propose_features pose des brouillons, chacun avec sa justification (rationale) qui dit pourquoi et avec quelles données. L'humain les accepte, les ajuste ou les refuse un par un dans l'éditeur.
        La fiche projet dit qui porte le projet, ses ambitions, ses usages, son budget, son temps, ses compétences et ses contraintes. get_project_sheet la donne avec toutes ses questions et les réponses possibles. Quand la personne parle de son projet (dans la conversation, ou dans le transcript d'un entretien qu'elle te confie), propose_project_sheet verse ses réponses dans la fiche en brouillons, que l'humain accepte ou refuse sur la fiche. N'invente rien : ne propose que ce que la personne a dit, et signale-lui toute réponse qui remplacerait une réponse déjà donnée.
        get_map donne aussi la palette de la carte (les espèces choisies). Si l'utilisateur te confie une liste de plantes (tableur, PDF, export d'un autre outil), propose_palette la verse dans la palette en brouillons, que l'humain accepte ou refuse dans le panneau Palette.
        get_map liste aussi les photos de plantes sauvages que la personne t'a laissées à analyser (bioindicators.photos) : regarde chacune avec get_bioindicator_photo, puis propose_bioindicators verse les plantes que tu y reconnais, en brouillons, avec ce qu'elles disent du sol.
        Les tâches du projet (« Tâches ») et sa bibliothèque de documents (« Documents ») sont le carnet de l'équipe, pas le design : list_tasks donne les listes, les tâches, qui les porte et pour quand ; list_documents et get_document donnent les plans, rapports, analyses de sol et autres documents rassemblés, avec leur texte. Là, tu écris directement, comme un coéquipier, quand la personne te le demande : create_tasks et update_tasks ajoutent, cochent, datent et confient des tâches (la personne à qui une tâche est confiée reçoit un e-mail : dis-le avant), add_document range dans la bibliothèque un document que tu as rédigé (compte rendu, synthèse, calendrier), update_document le renomme ou l'étiquette. Les photos du terrain se lisent avec list_photos et get_photo. Pour envoyer des fichiers (photos, PDF, plans…), ne les mets jamais dans un appel : create_upload te donne pour chacun une adresse où l'envoyer toi-même par HTTP (curl), puis attach_photos ou attach_documents les rattache ; import_from_url fait venir un fichier depuis une adresse HTTPS. add_photo (une petite image en base64) et add_document (un texte que tu as rédigé) restent pour les cas simples. update_photos les légende, les date, les place et les range en albums, delete_photos et delete_documents suppriment photos et documents. Tu ne supprimes rien d'autre, et seulement ce que la personne t'a demandé de retirer.
        Les réseaux (eau, gaz, électricité, câbles) sont masqués par défaut. Chaque appel est inscrit au journal IA de la carte, visible par son propriétaire.
    params:
      map_id: "Identifiant de la carte, donné par list_maps."
      layer: "Couche : existing (existant), water (eau), access (accès), structures, plants (plantes), animals (animaux), networks (réseaux), notes."
      kind: "Type d'élément (kind), par exemple tree, pond, hedge, path, swale."
      tag: "Étiquette posée par l'utilisateur (voir tags dans get_map), sans tenir compte des majuscules : seuls les éléments qui la portent sont renvoyés."
      bbox: "Emprise [ouest, sud, est, nord] en degrés WGS84 : seuls les éléments qui la touchent sont renvoyés."
      status: "active : éléments validés ; draft : brouillons en attente de revue ; all : les deux. Les brouillons refusés ne sont jamais renvoyés."
      include_networks: "Inclure les réseaux (eau, gaz, électricité, câbles). Réservé aux éditeurs et au propriétaire de la carte."
      include_geometry: "false pour une liste légère, sans les géométries."
      limit: "Nombre maximal de résultats."
      after_id: "Pagination : la valeur next_after_id de la page précédente."
      feature_id: "Identifiant de l'élément."
      lng: "Longitude WGS84 du point, en degrés décimaux."
      lat: "Latitude WGS84 du point, en degrés décimaux."
      list_id: "Identifiant d'une liste de tâches de la carte, donné par list_tasks."
      task_id: "Identifiant de la tâche, donné par list_tasks."
      document_id: "Identifiant du document, donné par list_documents."
      task_title: "Ce qu'il faut faire, en une phrase courte : « Faire un test de sol », « Commander les plants »."
      task_notes: "Précisions : pourquoi, comment, avec qui. null l'efface."
      due_on: "Échéance, au format AAAA-MM-JJ."
      assignee_id: "Personne à qui la confier : un id de participants (list_tasks). Elle reçoit un e-mail."
      task_tags: "Étiquettes de la tâche, de préférence parmi celles que la carte utilise déjà (tags dans list_tasks). 20 au plus, 40 caractères chacune."
      tags_change: "Nouvelle liste complète d'étiquettes, qui remplace l'ancienne ([] les retire toutes). Reprends les étiquettes actuelles pour en ajouter une."
      document_title: "Titre du document tel qu'il apparaît dans la bibliothèque."
      document_description: "Ce que contient le document, en une ou deux phrases. null l'efface."
      any_photo_id: "Identifiant de la photo, donné par list_photos."
      document_ids: "Identifiants des documents, donnés par list_documents."
      document_tags: "Étiquettes du document, de préférence parmi celles de la bibliothèque (tags dans list_documents). 20 au plus, 40 caractères chacune."
      upload_kind: "photo : une photo du terrain (JPEG, PNG, WebP ou HEIC, 25 Mo au plus) ; document : un document de la bibliothèque (PDF, image, Word, tableur, présentation, plan…, 200 Mo au plus)."
      signed_id: "Le signed_id que create_upload a donné pour ce fichier, après l'envoi par PUT."
      photo_ids: "Identifiants des photos, donnés par list_photos."
      album_id: "Identifiant d'un album de photos de la carte (albums dans list_photos). null sort la photo de son album."
      album_name: "Nom de l'album où ranger la photo, quand album_id manque : un album existant (sans tenir compte des majuscules) ou un nouveau, par exemple « Verger, avant travaux »."
      photo_feature_id: "Identifiant de l'élément de la carte que montre la photo (list_features). null défait le lien."
      photo_caption: "Légende de la photo, 500 caractères au plus. null l'efface."
      taken_at: "Date et heure de la prise de vue, au format ISO 8601 (2026-05-17T14:32:00+02:00). null l'efface."
      photo_location: "Endroit de la prise de vue, [longitude, latitude] en WGS84. null l'efface."
      heading: "Direction de l'appareil, en degrés depuis le nord (0 à 360, 90 = est). null l'efface."
    tools:
      list_maps:
        title: "Lister mes cartes"
        description: "Liste les cartes auxquelles l'utilisateur a accès (propriétaire, éditeur ou lecteur) : nom, rôle, étape, région, surface et brouillons en attente. Point de départ : passe ensuite l'identifiant d'une carte à get_map."
      get_map:
        title: "Lire une carte"
        description: "Fiche complète d'une carte : nom, adresse, région, surface (m²), contour du terrain en GeoJSON, centroïde [lng, lat], parcelles cadastrales, étape du projet, fiche projet (objectifs, usages, contraintes…), palette (espèces choisies), tâches du projet (à faire, en retard, faites), nombre de documents et de photos, nombre d'éléments par couche, étiquettes de la carte (tags, avec leur nombre d'éléments), types d'éléments connus de l'éditeur, et ce que cette connexion a le droit de faire sur la carte."
      list_features:
        title: "Lister les éléments"
        description: "Éléments dessinés sur la carte, en GeoJSON (FeatureCollection) : existants, eau, accès, structures, plantes, animaux, notes, et brouillons en attente. Filtres par couche, type (kind), étiquette (tag), emprise (bbox) et statut. Les réseaux restent masqués sauf demande explicite d'un éditeur. Paginé : passe next_after_id dans after_id pour la page suivante."
      get_feature:
        title: "Lire un élément"
        description: "Un élément de la carte : géométrie, attributs, justification s'il a été proposé par une IA, et mesures (surface en m², longueur et périmètre en m)."
      get_region_layers:
        title: "Couches de la région"
        description: "Catalogue des couches de données de la région de la carte (en Wallonie, celles du Géoportail : sols, relief, zones inondables, plan de secteur, cadastre…) : clé, nom, groupe, et si la couche s'interroge en un point avec identify_at_point."
      identify_at_point:
        title: "Interroger les couches en un point"
        description: "Ce que disent les couches de la région en un point du terrain : type de sol, aléa d'inondation, affectation au plan de secteur, parcelle cadastrale… Le point doit se trouver à moins de 1 km du terrain. Sans layers, toutes les couches interrogeables sont interrogées."
        params:
          layers: "Clés des couches à interroger (voir get_region_layers). Par défaut : toutes les couches interrogeables."
      get_site_data:
        title: "Données du lieu"
        description: "Ce que les sources de données ouvertes disent du lieu de la carte : soleil et horizon (PVGIS : heures de soleil possibles chaque mois sur ce terrain et rayonnement), stations météo proches et leurs relevés récents (IRM, Belgique), climat observé sur 1995-2024 (ERA5-Land : gelées, pluie, températures ; le premier appel lance le calcul, qui prend quelques minutes, status « pending » en attendant), arbres déjà en place (hauteur de canopée Meta/WRI : part du terrain sous les arbres, hauteur maximale, date des images), règles d'urbanisme et risques (en France : zonage du PLU ou de la carte communale, prescriptions, servitudes, risques Géorisques ; indicatif, jamais un avis juridique). Chaque sujet donne sa source et sa licence, ou la raison de son absence (non configuré, pas de contour, service indisponible)."
        params:
          topics: "Sujets à lire. Par défaut : tous."
      search_plants:
        title: "Chercher une plante"
        description: "Recherche dans le catalogue de plantes de Semisto, par nom latin ou nom commun français. Chaque donnée du catalogue garde sa source."
        params:
          query: "Nom latin ou nom commun, au moins 2 caractères."
      get_plant:
        title: "Fiche d'une plante"
        description: "La fiche d'une espèce du catalogue : nom latin, noms communs, port, strate, exigences et usages, avec la provenance de chaque donnée."
        params:
          plant_id: "Identifiant de la plante, donné par search_plants."
      get_design_guide:
        title: "Guide de méthode de Semisto"
        description: "La méthode de conception de Semisto, chapitre par chapitre : l'ordre de conception et la posture (method), l'eau (water), la structure (structure), la palette et les guildes (palette), le climat qui vient (climate). Chapitres rédigés en anglais. Sans topic : la liste des chapitres. À lire avant de proposer un design ou de conseiller sur l'eau, la structure ou les plantes."
        params:
          topic: "Chapitre à lire. Sans topic : la liste des chapitres, à commencer par « method »."
      list_tasks:
        title: "Lire les tâches du projet"
        description: "Les tâches de la carte (page « Tâches ») : ses listes (dont celles que Semisto ajoute par défaut, une par étape), chaque tâche avec ses notes, ses étiquettes, son échéance (et si elle est dépassée), la personne qui la porte, et si elle est faite (quand, par qui). Pour une tâche de Semisto, map_says_done dit si la carte montre déjà ce travail fait, et open_in_map ouvre le panneau où il se fait. Donne aussi les participants à qui une tâche peut être confiée et ce que cette connexion peut faire. Filtres par liste, statut, personne et étiquette."
        params:
          task_status: "pending : à faire ; done : faites ; all : toutes."
          assignee: "me : celles de l'utilisateur ; nobody : celles de personne ; anyone : toutes."
          task_tag: "Étiquette des tâches, sans tenir compte des majuscules."
      list_documents:
        title: "Lister les documents"
        description: "La bibliothèque « Documents » de la carte : plans, relevés, analyses de sol, permis, photos anciennes, tableurs… rassemblés par l'équipe ou envoyés avec la fiche projet. Pour chacun : titre, description, étiquettes, type, nom et taille du fichier, qui l'a déposé, et si get_document peut le lire (readable)."
        params:
          document_tag: "Étiquette des documents, sans tenir compte des majuscules."
          document_kind: "Type : pdf, image, text (traitement de texte), sheet (tableur), slides (présentation), plan (DWG, KML, GPX, GeoJSON), other."
      get_document:
        title: "Lire un document"
        description: "Un document de la bibliothèque et ce qu'il dit : le texte d'un PDF (page par page), d'un fichier Word ou OpenDocument, d'un texte, d'un CSV, d'un GeoJSON, d'un KML ou d'un GPX ; une image est renvoyée telle quelle, à regarder. Un long texte arrive par tranches de 40 000 caractères : passe next_offset dans offset pour la suite. Un PDF scanné, un tableur, un dessin ou une archive ne se lit pas ici : reason dit pourquoi, et la personne l'ouvre dans la bibliothèque."
        params:
          offset: "Pour un long texte : la valeur next_offset de l'appel précédent."
      create_tasks:
        title: "Ajouter des tâches"
        description: "Ajoute des tâches au projet, directement (ce ne sont pas des brouillons), quand la personne te le demande ou accepte ta proposition. Chaque tâche va dans une liste existante (list_id) ou dans la liste nommée list_name, créée si la carte ne l'a pas. Elle peut porter des notes, une échéance, des étiquettes, et être confiée à un participant de la carte (assignee_id), qui reçoit un e-mail : dis-le à la personne avant. 50 tâches au plus par appel ; une tâche refusée est renvoyée avec sa raison. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait du propriétaire de la carte."
        params:
          tasks: "Les tâches à ajouter, de 1 à 50."
          list_name: "Nom de la liste où ranger la tâche, quand list_id manque : une liste existante (sans tenir compte des majuscules) ou une nouvelle, par exemple « Chantier de mars »."
      update_tasks:
        title: "Modifier des tâches"
        description: "Modifie des tâches : les cocher ou les décocher (completed), changer leur titre ou leurs notes, les déplacer dans une autre liste, les confier à quelqu'un ou à personne, poser ou effacer une échéance, changer leurs étiquettes. Seuls les champs passés changent. Un lecteur de la carte ne peut que cocher les tâches qui lui sont confiées ; le propriétaire et les éditeurs modifient tout. Rien n'est supprimé. 50 tâches au plus par appel ; une modification refusée est renvoyée avec sa raison. Demande l'accès « brouillons » et le forfait du propriétaire de la carte."
        params:
          task_changes: "Les modifications, une par tâche, de 1 à 50."
          completed: "true : la tâche est faite ; false : elle est de nouveau à faire."
          move_to_list: "Liste où déplacer la tâche (à la fin de la liste)."
          due_on_change: "Nouvelle échéance au format AAAA-MM-JJ, ou null pour l'effacer."
          assignee_change: "Personne à qui la confier (id de participants dans list_tasks), ou null pour ne la confier à personne. La personne reçoit un e-mail."
      add_document:
        title: "Ajouter un document"
        description: "Pour un document que tu as rédigé toi-même (pour un fichier existant, PDF, Word, image ou plan, utilise create_upload puis attach_documents). Range dans la bibliothèque « Documents » de la carte un document que tu as rédigé : compte rendu de visite, synthèse d'un entretien, calendrier de plantation en CSV, export GeoJSON… Il est déposé au nom de l'utilisateur, avec son titre, sa description et ses étiquettes. Formats : Markdown (md), texte (txt), CSV ou GeoJSON, 200 000 caractères au plus. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait du propriétaire de la carte."
        params:
          document_content: "Le contenu du document, dans le format choisi."
          document_format: "md (Markdown, par défaut), txt, csv ou geojson."
      list_photos:
        title: "Lister les photos du terrain"
        description: "Les photos de la carte, des plus récentes aux plus anciennes : légende, date de prise de vue, endroit [lng, lat] et direction, album, élément lié, taille et qui l'a déposée, et si elle attend une lecture des bio-indicatrices. Donne aussi les albums. Filtres par album, élément lié et photos pas encore placées. Paginé : passe next_after_id dans after_id pour la page suivante. get_photo montre une photo."
        params:
          unplaced: "true : seulement les photos qui n'ont pas encore d'endroit sur la carte."
          photo_after: "Pagination : la valeur next_after_id de la page précédente."
      get_photo:
        title: "Regarder une photo"
        description: "Une photo du terrain, en image (sans ses métadonnées GPS), avec sa légende, sa date, son endroit, sa direction, son album, l'élément lié et ce que dit l'appareil (modèle, hauteur et nacelle d'un drone). Pour une photo de plantes sauvages à analyser, préfère get_bioindicator_photo."
      add_photo:
        title: "Ajouter une photo"
        description: "Pour une seule petite image que tu as déjà en mémoire. Pour des photos qui sont dans des fichiers, et pour tout envoi de plusieurs photos, utilise create_upload puis attach_photos : les octets ne passent pas par la conversation. Ajoute une photo du terrain à partir de son contenu en base64 (JPEG, PNG, WebP ou HEIC, 15 Mo au plus). Tu peux la légender, la dater, la placer, donner sa direction, la ranger dans un album (existant ou nouveau, par son nom) et la lier à un élément de la carte. Une photo déjà présente sur la carte est refusée. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait du propriétaire de la carte."
        params:
          image_base64: "Le fichier de l'image en base64 (une adresse data:image/…;base64, est acceptée)."
          photo_filename: "Nom du fichier, par exemple verger-nord.jpg."
      update_photos:
        title: "Modifier des photos"
        description: "Change la légende, la date, l'endroit, la direction, l'album (existant ou nouveau, par son nom) ou l'élément lié de photos du terrain. Seuls les champs passés changent ; null efface. L'image elle-même ne change pas. 50 photos au plus par appel ; une modification refusée est renvoyée avec sa raison. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait du propriétaire de la carte."
        params:
          photo_changes: "Les modifications, une par photo, de 1 à 50."
      delete_photos:
        title: "Supprimer des photos"
        description: "Supprime des photos du terrain, avec leurs esquisses et leurs mises en image, comme « Supprimer » sur la page Photos. Définitif : ne le fais que quand la personne te l'a demandé, en lui disant d'abord quelles photos partent. 50 photos au plus par appel. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait du propriétaire de la carte."
      create_upload:
        title: "Préparer l'envoi de fichiers"
        description: "Première étape pour envoyer des photos ou des documents sans faire passer leurs octets par la conversation. Pour chaque fichier (50 au plus), donne son type d'usage (kind), son nom, sa taille en octets, son empreinte MD5 en base64 et son type MIME ; tu reçois un signed_id, une adresse d'envoi (upload_url, valable 15 minutes) et les en-têtes à renvoyer tels quels. Deuxième étape, envoie toi-même chaque fichier par HTTP PUT, par exemple : curl --fail -X PUT --data-binary @IMG_0042.jpg -H 'Content-Type: image/jpeg' -H 'Content-MD5: …' '<upload_url>' (la commande prête à l'emploi est dans curl). Calcule l'empreinte avec : openssl md5 -binary IMG_0042.jpg | base64 ; la taille avec : wc -c < IMG_0042.jpg. Troisième étape, rattache les fichiers envoyés avec attach_photos ou attach_documents. Un type refusé ou un fichier trop lourd est refusé dès cette étape, avec son code (unsupported_type, too_large, invalid_checksum). Un fichier jamais rattaché est effacé après 24 heures. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait du propriétaire de la carte."
        params:
          upload_files: "Les fichiers à envoyer, de 1 à 50."
          upload_filename: "Nom du fichier avec son extension, par exemple DJI_0042.JPG ou analyse-sol.pdf."
          byte_size: "Taille exacte du fichier en octets (wc -c < fichier)."
          checksum: "Empreinte MD5 du fichier, en base64 (openssl md5 -binary fichier | base64), 24 caractères."
          content_type: "Type MIME du fichier, par exemple image/jpeg, application/pdf ou application/vnd.openxmlformats-officedocument.wordprocessingml.document. C'est l'en-tête Content-Type de l'envoi."
      attach_photos:
        title: "Rattacher des photos envoyées"
        description: "Dernière étape après create_upload et l'envoi par PUT : fait des fichiers envoyés des photos du terrain (50 au plus par appel). Comme pour une photo déposée dans Designer, la date de prise de vue, l'endroit et la direction sont lus dans les EXIF du fichier, et l'appareil (modèle, données d'un drone DJI) juste après ; ce que tu passes (légende, date, endroit, direction, album par son id ou son nom, élément lié) l'emporte sur les EXIF. Une photo HEIC devient un JPEG. Une photo refusée revient avec son code et sa raison (other_map : préparée pour une autre carte ; already_attached : déjà rattachée ; not_received : le PUT n'a pas été fait ; duplicate : déjà sur la carte ; unsupported_type…), les autres passent. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait du propriétaire de la carte."
        params:
          attach_photo_lines: "Les photos à rattacher, une par fichier envoyé, de 1 à 50."
      attach_documents:
        title: "Rattacher des documents envoyés"
        description: "Dernière étape après create_upload et l'envoi par PUT : range les fichiers envoyés dans la bibliothèque « Documents » de la carte (50 au plus par appel), chacun avec son titre et, si tu veux, une description et des étiquettes. Tous les types de la bibliothèque passent : PDF, images, Word et OpenDocument, tableurs, présentations, plans (DWG, DXF, KML, KMZ, GPX, GeoJSON), archives zip. Le type réel du fichier est vérifié. get_document lit ensuite le texte d'un PDF ou d'un Word. Un document refusé revient avec son code et sa raison, les autres passent. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait du propriétaire de la carte."
        params:
          attach_document_lines: "Les documents à rattacher, un par fichier envoyé, de 1 à 50."
      import_from_url:
        title: "Importer des fichiers depuis une adresse"
        description: "Quand le fichier n'est pas sur ta machine : Semisto Designer va le chercher lui-même à son adresse HTTPS publique (fichier Drive partagé, lien de téléchargement…) et en fait une photo ou un document, comme attach_photos et attach_documents (EXIF lus pour une photo). Un lien Drive « /file/d/… » est converti en lien de téléchargement. 10 fichiers au plus par appel. Une page web (lien qui demande une connexion, page d'aperçu) est refusée avec le code not_a_file. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait du propriétaire de la carte."
        params:
          import_files: "Les fichiers à importer, de 1 à 10."
          import_url: "Adresse HTTPS publique du fichier."
      delete_documents:
        title: "Supprimer des documents"
        description: "Supprime des documents de la bibliothèque, comme « Supprimer » sur la page Documents. Définitif : ne le fais que quand la personne te l'a demandé, en lui disant d'abord quels documents partent. 50 au plus par appel. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait du propriétaire de la carte."
      update_document:
        title: "Renommer ou étiqueter un document"
        description: "Change le titre, la description ou les étiquettes d'un document de la bibliothèque, par exemple pour le ranger sous les étiquettes que l'équipe utilise déjà. Le fichier lui-même ne change pas, et rien n'est supprimé. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait du propriétaire de la carte."
      propose_features:
        title: "Proposer des brouillons"
        description: "Pose des éléments en brouillon sur la carte ; l'humain les accepte, les ajuste ou les refuse un par un dans l'éditeur : l'IA ne modifie jamais la carte directement. Chaque élément exige une justification (rationale) qui dit pourquoi et avec quelles données. Géométries GeoJSON en WGS84 ([longitude, latitude]), à moins de 200 m du contour du terrain, 200 éléments au plus par appel. Les éléments refusés à la validation sont renvoyés avec leur raison : corrige et renvoie seulement ceux-là. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait du propriétaire de la carte."
        params:
          summary: "Résumé de la proposition dans son ensemble, montré à l'humain au-dessus des brouillons."
          features: "Les éléments proposés, de 1 à 200."
          feature_layer: "Couche de l'élément. Les réseaux ne peuvent pas être proposés."
          feature_kind: "Type d'élément en snake_case, par exemple fruit_tree, hedge, pond, swale, path, raised_bed. Les types connus de l'éditeur sont dans known_kinds (get_map). Pour montrer au client une zone du design (forêt-jardin, patch, point de vue…), utilise zone (surface) ou line (tracé) dans la couche notes, avec un nom et une couleur : le nom s'écrit sur la carte avec la surface ou la longueur."
          feature_geometry: "Géométrie GeoJSON (Point, LineString, Polygon ou Multi…), coordonnées [longitude, latitude] en WGS84."
          feature_name: "Nom court affiché sur la carte."
          feature_color: "Couleur de l'élément sur la carte, en hexadécimal (#7fa650). Des tons doux distinguent les zones voisines : #7fa650, #8b5e3c, #d08b3a, #c48a96, #5b7fa6, #9a7fb8, #c9b03a, #4f8f86."
          feature_notes: "Notes complémentaires : variétés, entretien, phasage…"
          feature_rationale: "Pourquoi cet élément, ici, et avec quelles données (fiche projet, couches, relief, existant…). Obligatoire, 10 caractères au moins."
          feature_properties: "Attributs libres, par exemple species, height_m, spacing_m."
          feature_tags: "Étiquettes de l'élément, de préférence parmi celles que la carte utilise déjà (tags dans get_map), par exemple « phase 1 » ou « zone nord ». 20 au plus, 40 caractères chacune."
      propose_palette:
        title: "Proposer des plantes pour la palette"
        description: "Verse une liste de plantes dans la palette de la carte, en brouillons que l'humain accepte ou refuse dans le panneau Palette : par exemple la liste que l'utilisateur tient dans un tableur, un PDF ou l'export d'un autre outil, ou tes propres choix. Chaque plante est reconnue par species_id (search_plants) ou, à défaut, par son nom latin ou commun exact ; un nom introuvable ou ambigu est renvoyé avec sa raison : cherche-le avec search_plants et renvoie-le avec son species_id. Une espèce déjà dans la palette (ou déjà proposée) est ignorée. 200 plantes au plus par appel. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait du propriétaire de la carte."
        params:
          summary: "Résumé de la proposition, par exemple d'où vient la liste."
          plants: "Les plantes proposées, de 1 à 200."
          species_id: "Identifiant de l'espèce, donné par search_plants. Prioritaire sur name."
          plant_name: "Nom de la plante tel qu'il figure dans la source (latin ou commun), quand species_id manque."
          variety_id: "Identifiant d'un cultivar de l'espèce (get_plant), facultatif."
          strata: "Strate jouée sur ce design, si elle diffère de celle de l'espèce."
          role: "Rôle : food (nourricier), support (soutien), pioneer (pionnier), hedge (haie), ornamental (ornement)."
          target_count: "Nombre de plants visés, s'il est connu (par exemple une quantité du tableur)."
          plant_notes: "Notes : variété souhaitée, fournisseur, emplacement prévu…"
          plant_rationale: "Pourquoi cette plante, ou d'où elle vient (« ligne 12 du tableur de l'utilisateur »). Obligatoire, 10 caractères au moins."
      get_bioindicator_photo:
        title: "Regarder une photo de plantes sauvages"
        description: "Une photo de plantes sauvages prise sur le terrain (les photos « à analyser » sont dans bioindicators.photos de get_map), en image, avec où et quand elle a été prise, ce qui en a déjà été noté et la liste des plantes bio-indicatrices de Semisto (clés à utiliser dans propose_bioindicators). Regarde toute la photo : elle montre souvent plusieurs espèces. Ensuite, propose ce que tu vois avec propose_bioindicators."
        params:
          photo_id: "Identifiant de la photo, donné par get_map (bioindicators.photos)."
      propose_bioindicators:
        title: "Proposer les plantes vues sur une photo"
        description: "Verse les plantes sauvages que tu reconnais sur une photo (get_bioindicator_photo) en brouillons, posés à l'endroit de la photo, que l'humain accepte ou refuse dans le panneau Sol (onglet Plantes), avec une courte lecture du sol gardée avec la photo. Pour chaque plante : son nom français, son nom latin, la clé de la liste des bio-indicatrices si elle y est (sinon le nom latin suffit), son abondance sur la photo et ta confiance. Ne propose que ce que tu vois vraiment ; une identification douteuse se dit avec confidence « low ». Une nouvelle proposition pour la même photo remplace ses brouillons pas encore revus. 30 plantes au plus par appel. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait du propriétaire de la carte."
        params:
          photo_id: "Identifiant de la photo regardée avec get_bioindicator_photo."
          soil_summary: "Ce que les plantes de la photo disent du sol, ensemble, en quelques phrases simples, avec tes réserves (une photo ne suffit pas)."
          wild_plants: "Les plantes reconnues sur la photo, de 1 à 30."
          catalog_key: "Clé de la plante dans la liste des bio-indicatrices (bioindicator_list de get_bioindicator_photo), si elle y est."
          wild_plant_name: "Nom français courant de la plante."
          latin_name: "Nom latin de la plante."
          abundance: "Abondance sur la photo : rare, present (présente), frequent (fréquente) ou dominant (dominante)."
          confidence: "Ta confiance dans l'identification : high (sûre), medium (probable) ou low (incertaine)."
          wild_plant_rationale: "Ce qui te fait la reconnaître sur la photo (feuilles, fleurs, port…) et où elle est sur l'image. Obligatoire, 10 caractères au moins."
      get_project_sheet:
        title: "Lire la fiche projet"
        description: "La fiche projet de la carte avec toutes ses questions : pour chaque section et chaque champ, son type, son libellé, les réponses possibles (clé et libellé français), la réponse actuelle, l'avancement de la fiche et les réponses déjà proposées par une IA qui attendent l'humain. À lire avant propose_project_sheet, pour faire correspondre ce que dit la personne aux réponses possibles."
      propose_project_sheet:
        title: "Proposer des réponses pour la fiche projet"
        description: "Verse des réponses dans la fiche projet de la carte, en brouillons que l'humain accepte ou refuse sur la fiche : ce que la personne t'a dit au fil de la conversation, ou ce que dit le transcript d'un entretien qu'elle te confie. Chaque réponse vise un champ (section et field, voir get_project_sheet) et donne sa valeur complète : une clé pour un choix unique, une liste de clés pour un choix multiple, un entier, un texte, ou une liste d'objets pour les personnes. Une réponse identique à la réponse actuelle est ignorée ; une nouvelle proposition pour un champ remplace la précédente pas encore revue. Une réponse qui remplacerait une réponse déjà donnée est renvoyée avec replaces : dis-le à la personne. Pour compléter un champ libre (notes), reprends le texte actuel dans ta valeur. N'invente rien. 60 réponses au plus par appel. Demande l'accès « brouillons », le rôle d'éditeur ou de propriétaire, et le forfait du propriétaire de la carte."
        params:
          summary: "Résumé de la proposition, par exemple d'où viennent les réponses (« entretien du 3 octobre avec Marie »)."
          answers: "Les réponses proposées, de 1 à 60."
          section: "Section de la fiche : who (qui), ambitions, uses (usages), budget, time (temps), skills (compétences), constraints (contraintes), opportunities (opportunités), livestock (élevages), calendar (calendrier)."
          field: "Clé du champ dans la section, par exemple goals, initial, hours_per_week ou notes (voir get_project_sheet)."
          value: "Valeur complète du champ : une clé (choix unique), une liste de clés (choix multiple), un entier, un texte, ou pour who.people une liste d'objets { name, role, note }."
          answer_rationale: "D'où vient cette réponse : ce que la personne a dit, cité si possible (« \"on a deux heures le week-end\" »), ou la ligne du transcript. Obligatoire, 10 caractères au moins."
      withdraw_draft:
        title: "Retirer des brouillons"
        description: "Retire des brouillons proposés par une IA et pas encore revus, par exemple pour les remplacer par une meilleure proposition. Les éléments acceptés appartiennent aux humains : ils ne peuvent pas être retirés."
        params:
          feature_ids: "Identifiants des brouillons à retirer."
