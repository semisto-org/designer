  account_ai:
    title: "Connecter ton IA"
    intro: "Branche ton propre assistant (Claude, ChatGPT, Le Chat…) sur tes cartes. Il lit la carte, ses couches et la fiche projet ; avec le forfait (ou pendant ton essai de 14 jours) et le rôle d'éditeur, il y pose des brouillons que tu acceptes ou refuses un par un."
