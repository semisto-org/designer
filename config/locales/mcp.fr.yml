      ended_title: "Ton essai des brouillons est terminé"
      ended: "Il a pris fin le %{date}. Ton IA lit toujours tes cartes, et tout ce que tu as accepté reste sur la carte. Pour qu'elle y pose de nouveaux brouillons, passe au forfait."
