          title: "Mare à %{distance} de la limite"
          explanation: "Pour être dispensée de permis, une mare doit se trouver à %{min} au moins des limites de la propriété."
        pond_single:
          title: "%{count} mares sur le terrain"
          explanation: "Dans un jardin, la dispense ne vaut que pour une seule mare par propriété. Hors zone d'habitat du plan de secteur, jusqu'à 10 mares (2 par hectare en moyenne) peuvent en être dispensées."
