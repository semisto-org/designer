        pond_max_area:
          title: "Mare de %{area}"
          explanation: "Une mare n'est dispensée de permis que jusqu'à %{max} dans un jardin. Jusqu'à 300 m², la dispense vaut seulement hors zone d'habitat du plan de secteur et hors site naturel protégé."
