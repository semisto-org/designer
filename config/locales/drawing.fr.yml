          title: "%{count} mares sur le terrain"
          explanation: "Au-delà de %{max} mares par propriété, un permis est toujours demandé."
        shed_max_area:
          title: "%{kind_name} de %{area}"
          explanation: "Un abri de jardin ou une remise n'est dispensé de permis que jusqu'à %{max}, avec 2,50 m sous la gouttière et 3,50 m au faîte au plus."
        shed_boundary_distance:
          title: "%{kind_name} à %{distance} de la limite"
          explanation: "Pour être dispensé de permis, un abri de jardin doit se trouver à %{min} au moins des limites mitoyennes."
        shed_single:
          title: "%{count} abris de jardin"
          explanation: "La dispense de permis ne vaut que pour un seul abri ou une seule remise par propriété."
        greenhouse_total_area:
          title: "%{count} serre(s), %{area} au total"
          explanation: "Les serres de jardin sont dispensées de permis tant qu'elles totalisent %{max} au plus."
        animal_shelter_boundary_distance:
          title: "%{kind_name} à %{distance} de la limite"
          explanation: "Un abri pour animaux est dispensé de permis à %{min} au moins des limites, à 20 m au moins de toute habitation voisine, et pour 20 m² d'abris au total."
        fr_shed_declaration:
          title: "%{kind_name} de %{area}"
          explanation: "Au-delà de %{max}, un abri de jardin demande une déclaration préalable de travaux en mairie (dès le premier m² dans un site protégé)."
        fr_shed_permit:
          title: "%{kind_name} de %{area}"
          explanation: "Au-delà de %{max}, un abri de jardin isolé demande un permis de construire. Le PLU de ta commune peut ajouter ses propres règles."
        fr_greenhouse_permit:
          title: "%{kind_name} de %{area}"
          explanation: "Au-delà de %{max}, une serre demande un permis de construire. En dessous, tout dépend de sa hauteur : libre jusqu'à 1,80 m, déclaration préalable jusqu'à 4 m."
