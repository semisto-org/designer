        body: "%{client} a annulé la mission pour « %{map} ». Rien n'a été payé."
        button: "Voir la mission"
      paid:
        subject: "Mission payée : « %{map} »"
        body: |-
          %{client} a payé la mission pour « %{map} ». Vol prévu : %{date}.

          Le jour venu, dépose tes données depuis la page de la mission : elles arrivent directement sur sa carte.
        button: "Voir la mission"
      paid_out:
        subject: "Ta part est en route : %{amount}"
        body: "Le jardinier a validé la mission « %{map} ». Stripe te vire %{amount} dans les prochains jours."
        button: "Voir la mission"
      accepted:
        subject: "%{pilot} accepte ton vol"
        body: |-
          %{pilot} accepte de survoler ton lieu. Vol prévu : %{date}.

          %{reply}

          Paie la mission (%{total}) pour la confirmer. Le pilote n'est payé qu'une fois les données livrées et acceptées par toi.
        button: "Payer la mission"
      declined:
        subject: "%{pilot} ne peut pas faire ce vol"
        body: |-
          %{pilot} ne peut pas faire ce vol.

          %{reply}

          D'autres pilotes de l'annuaire se déplacent peut-être chez toi.
        button: "Voir la mission"
      delivered:
        subject: "Les images de ton lieu sont arrivées"
        body: |-
          %{pilot} a déposé les données du vol sur ta carte « %{map} ».

          %{note}

          Tu as %{days} jours pour vérifier. Si tout va bien, valide la mission ; sinon, signale-le à Semisto.
        button: "Voir les données"
      refunded:
        subject: "Ta mission drone est remboursée"
        body: "Semisto t'a remboursé %{total} pour la mission avec %{pilot}. Le montant arrive sur ta carte dans les prochains jours."
        button: "Voir la mission"
      disputed:
        greeting: "Bonjour,"
        subject: "Mission drone n° %{id} : problème signalé"
        body: |-
          %{client} signale un problème sur la mission n° %{id} avec %{pilot} :

          %{message}

          La part du pilote reste bloquée tant que ce n'est pas réglé.
        button: "Régler la mission"

