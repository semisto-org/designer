# Permaculture zones 0 to 5: the « Zones » panel of the editor, the zone of
# each element in the inspector, and the companion's placement advice.
fr:
  permaculture_zones:
    panel_title: "Zones"
    intro: "Les zones rangent ton terrain selon tes passages : la zone 1 est ce que tu croises chaque jour, la zone 5 la part sauvage que tu laisses vivre. Chaque élément trouve sa place selon le nombre de visites qu'il demande."
    go_outside_title: "Sors les vérifier."
    go_outside: "Pendant une semaine, ouvre ce panneau sur ton téléphone quand tu fais le tour du jardin. Où tes pas te mènent-ils chaque jour ? Le chemin vers le compost, les poules ou la voiture étire la zone 1 avec lui."
    zone: "Zone %{number}"
    house: "La maison"
    frequency:
      "0": "là où tu vis"
      "1": "chaque jour"
      "2": "quelques fois par semaine"
      "3": "quelques fois par mois"
      "4": "quelques fois par an"
      "5": "pour observer, sans rien gérer"
    holds:
      "0": "La maison, la terrasse, la cuisine d'été."
      "1": "Aromatiques, salades, compost, poules, petits fruits à cueillir en passant, récupération de l'eau du toit."
      "2": "Potager, serre, fruitiers nains, ruches à l'écart du passage, petits élevages."
      "3": "Verger, jardin-forêt de grands arbres, mares, prairie, plus grands animaux."
      "4": "Bois de chauffe, fourrage, haies champêtres, cueillette sauvage."
      "5": "La part sauvage : on n'y gère rien, on y apprend."
    house_title: "La maison, zone 0"
    house_missing: "Dis à Terranova quel bâtiment est ta maison : les zones partent de ses portes."
    house_pick: "Bâtiment"
    house_building: "Bâtiment de %{area}"
    house_set: "C'est la maison"
    house_none: "Dessine d'abord ta maison (Cartographier › Éléments › Existant › Bâtiment) : les zones partent d'elle."
    house_is: "%{name} est la zone 0."
    house_change: "Changer"
    list_title: "Les zones du terrain"
    empty: "Aucune zone pour l'instant."
    propose: "Proposer les zones depuis la maison"
    propose_hint: "Terranova trace des cercles autour de la maison (15, 40, 100 et 250 m), étirés le long de tes chemins, puis coupés au terrain. Ce sont des repères : redessine-les selon ta vie."
    proposal_title: "Zones proposées"
    proposal_place: "Poser ces zones"
    proposal_cancel: "Annuler"
    proposal_empty: "Le terrain tient tout entier dans la maison : rien à proposer."
    proposal_no_boundary: "Dessine d'abord le contour du terrain."
    placed: "Zones posées. Redessine-les à ta façon : ce sont tes habitudes qui comptent."
    save_error: "Les zones n'ont pas pu être enregistrées."
    add: "Dessiner une zone"
    add_number: "Numéro de la zone à dessiner"
    add_start: "Dessiner"
    wild_add: "Choisir la part sauvage (zone 5)"
    sectors_toggle: "Montrer les secteurs autour"
    sectors_none: "Aucun secteur pour l'instant : le panneau Secteurs dit ce qui vient de l'extérieur (vent, feu, vues…)."
    advice_title: "Ce que les zones disent du plan"
    advice_none: "Rien à signaler : chaque élément est dans une zone qui lui convient."
    show: "Voir"
    open_sectors: "Ouvrir les secteurs"
    advice:
      placement_far: "« %{element} » est en zone %{zone}, où l'on passe %{frequency}. %{why}"
      placement_near: "« %{element} » est en zone %{zone}, tout près de la maison. %{why}"
      no_wild: "Pas de zone 5. Garde une part de sauvage, même un coin de haie : c'est là que tu apprends comment ton terrain veut pousser."
      no_house: "Dis quel bâtiment est la maison : sans zone 0, les zones n'ont pas de centre."
      wind_unsheltered: "Le vent %{range} ne rencontre aucune haie de ce côté de la maison. Une haie brise-vent en zone 3 ou 4 de ce côté abriterait le jardin sur dix fois sa hauteur."
      cold_wind_unsheltered: "Le vent froid %{range} ne rencontre aucune haie de ce côté de la maison. Une haie persistante en zone 3 ou 4 de ce côté protégerait les floraisons et la maison."
      fire_side: "Le feu peut venir %{range}. De ce côté, garde entre la maison et la friche des zones 1 et 2 vertes et arrosées, une mare, un chemin, des feuillus plutôt que des résineux, et pas de tas de bois contre les murs."
    why:
      raised_bed: "Un potager se soigne chaque jour : plus près, il est arrosé et récolté à temps."
      greenhouse: "Une serre s'ouvre et s'arrose chaque jour : plus près de la maison, elle est suivie."
      compost: "On y porte les épluchures chaque jour : sur le chemin de la cuisine, il sera nourri."
      poultry_house: "Les poules demandent une visite par jour (œufs, eau, fermeture le soir) et mangent les restes de la cuisine."
      fruit_store: "Un fruitier se visite souvent pour trier : près de la maison, rien ne s'y perd."
      playground: "Les enfants jouent mieux là où on les voit depuis la maison."
      shed: "L'abri à outils sert à chaque séance au jardin : il gagne à être sur le chemin."
      beehive: "Les ruches préfèrent le calme, à l'écart des passages de chaque jour."
      paddock: "Un parc à grands animaux prend de la place et se visite moins souvent : il va plus loin."
    inspector:
      zone: "Zone %{number} · %{frequency}"
      outside: "Hors des zones dessinées."
      choose: "Numéro de la zone"
      holds_title: "On y met :"
      open: "Ouvrir les zones"
