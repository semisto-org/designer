    attribution_default: "Vue drone © Semisto"
    view_label: "%{name} · %{date}"

    # Map editor, « Couches » panel, under the base maps.
    layers:
      title: "Vues drone"
      none: "Sans vue drone"
      hint_one: "Prise par Semisto, elle se pose sur le fond choisi ci-dessus : dessine directement dessus."
      hint_many: "Passe d'une date à l'autre pour comparer ton terrain d'une saison, d'une année à l'autre. Chaque vue se pose sur le fond choisi ci-dessus."
      opacity: "Opacité de la vue drone"
      unreachable: "Cette vue drone ne répond pas pour l'instant. Réessaie un peu plus tard ; si cela dure, écris à Semisto."
      help: "La vue drone"

    # « Publier » panel (owner) and the public view (/p/:token).
    publish:
      legend: "Vue drone"
      show: "Montrer « %{label} »"
      hint: "Désactivée par défaut. Cochée, la plus récente de tes vues drone sert de fond à la vue publique, pour tous ceux qui ont le lien."

