  drone_mailer:
    import_ready:
      subject: "Ta vue drone est prête"
      body: "La vue drone du %{date} (%{file}) est maintenant sur ta carte « %{map} »."
      where: "Tu la retrouves dans le panneau « Couches », sous « Vues drone » (« %{name} »). Elle sert directement de fond pour dessiner, et le prochain vol s'ajoutera à côté pour comparer."
      cta: "Ouvrir ma carte"
      shared: "Elle est visible par les personnes avec qui tu partages cette carte."
      help: "Tout savoir sur la vue drone"
    view_ready:
      subject: "Ta vue drone est sur ta carte"
      body: "Bonne nouvelle : la vue drone de ton terrain, prise le %{date}, est maintenant sur ta carte « %{map} »."
      where: "Elle s'affiche dès l'ouverture de la carte, et tu la retrouves à tout moment dans le panneau « Couches », sous « Vues drone » (« %{name} »). Elle sert directement de fond pour dessiner."
