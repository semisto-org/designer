# « Vues drone »: the dated aerial views on a map, set up by Semisto after a
# drone mission or imported from a file by anyone editing the map (base-map
# choice of the editor, import, staff screen, e-mails). Keys in English, values in French; the backend and the React
# frontend read the same file.
fr:
  activerecord:
    models:
      aerial_view: "Vue drone"
    attributes:
      aerial_view:
        name: "Nom"
        captured_on: "Date de prise de vue"
        kind: "Format"
        url: "Adresse"
        attribution: "Mention"
        min_zoom: "Zoom minimum"
        max_zoom: "Zoom maximum"
        map: "Carte"
        plan_purchase: "Commande"
        status: "État"
        source_filename: "Fichier"
    errors:
      models:
        aerial_view:
          attributes:
            name:
              blank: "Donne un nom à la vue."
              too_long: "Ce nom est trop long (%{count} caractères au maximum)."
            captured_on:
              blank: "Indique la date de la prise de vue."
            kind:
              inclusion: "Choisis le format : archive PMTiles ou tuiles XYZ."
            url:
              blank: "Colle l'adresse de la vue."
              too_long: "Cette adresse est trop longue (%{count} caractères au maximum)."
              malformed: "Cette adresse n'est pas valide : vérifie qu'elle est complète et sans espace."
              not_https: "L'adresse doit commencer par https:// : le navigateur charge les tuiles directement chez l'hébergeur."
              xyz_template: "Pour des tuiles XYZ, l'adresse doit contenir {z}, {x} et {y}."
              pmtiles_file: "Pour une archive PMTiles, l'adresse doit finir par .pmtiles, sans {z}/{x}/{y}."
            attribution:
              too_long: "Cette mention est trop longue (%{count} caractères au maximum)."
            min_zoom:
              not_a_number: "Le zoom est un nombre entier, de 0 à 24."
              not_an_integer: "Le zoom est un nombre entier, de 0 à 24."
              in: "Le zoom est un nombre entier, de 0 à 24."
            max_zoom:
              not_a_number: "Le zoom est un nombre entier, de 0 à 24."
              not_an_integer: "Le zoom est un nombre entier, de 0 à 24."
              in: "Le zoom est un nombre entier, de 0 à 24."
              below_min_zoom: "Le zoom maximum doit être au moins égal au zoom minimum."
            map:
              required: "Aucune carte active ne porte ce numéro."
              not_buyers: "Cette carte n'appartient pas à la personne qui a commandé la mission."
            plan_purchase:
              not_drone: "Cette commande n'est pas une mission drone."

  drone:
    default_name: "Vue drone"
    attribution_default: "Vue drone © Semisto"
    attribution_imported: "Vue drone © %{name}"
    view_label: "%{name} · %{date}"

    # Map editor, « Couches » panel, under the base maps.
    layers:
      title: "Vues drone"
      none: "Sans vue drone"
      hint_one: "Elle se pose sur le fond choisi ci-dessus : dessine directement dessus."
      hint_many: "Passe d'une date à l'autre pour comparer ton terrain d'une saison, d'une année à l'autre. Chaque vue se pose sur le fond choisi ci-dessus."
      opacity: "Opacité de la vue drone"
      unreachable: "Cette vue drone ne répond pas pour l'instant. Réessaie un peu plus tard ; si cela dure, écris à Semisto."
      help: "La vue drone"

    # Importing a drone view from a file, in the « Couches » panel (editors).
    import:
      button: "Importer une vue drone"
      intro_empty: "Tu as fait voler un drone au-dessus de ton terrain ? Importe l'orthophoto : elle devient un fond sur lequel dessiner, et chaque vol suivant s'ajoute à côté, pour voir ton jardin grandir."
      title: "Importer une vue drone"
      file: "Fichier"
      file_hint: "L'orthophoto exportée par ton logiciel de drone (DJI Terra, WebODM, Pix4D…) en GeoTIFF géoréférencé (.tif), ou une archive .mbtiles ou .pmtiles. Jusqu'à %{max} Go, même pour un grand terrain."
      choose: "Choisir le fichier"
      change: "Changer de fichier"
      name: "Nom"
      captured_on: "Date du vol"
      captured_on_hint: "Proposée d'après la date du fichier : vérifie que c'est bien le jour du vol. C'est elle qui range tes vues dans le temps."
      submit: "Envoyer et préparer la vue"
      cancel: "Annuler"
      close: "Fermer"
      reading: "Lecture du fichier…"
      sending: "Envoi : %{percent} % (%{sent} sur %{total})"
      keep_open: "Garde cette page ouverte jusqu'à la fin de l'envoi. Tu peux continuer à travailler sur la carte."
      leave_warning: "La vue drone n'est pas encore entièrement envoyée. Quitter la page arrête l'envoi."
      list_title: "Tes imports"
      statuses:
        uploading: "Envoi en cours"
        processing: "En préparation…"
        ready: "Sur la carte"
        failed: "Pas pu être préparée"
      uploading_stale: "Envoi interrompu : retire-la et envoie le fichier à nouveau."
      processing_hint: "Terranova découpe l'image en tuiles pour qu'elle s'affiche vite, même zoomée. Pour un grand terrain, cela peut prendre une heure : tu reçois un e-mail quand elle est sur la carte."
      file_line: "%{file} · %{size}"
      remove: "Retirer"
      confirm_remove: "Retirer « %{name} » de la carte ? Plus personne ne la verra, et le fichier préparé est supprimé."
      done: "« %{name} » est sur la carte."
      failures:
        upload_incomplete: "Le fichier n'est pas arrivé en entier. Envoie-le à nouveau."
        upload_expired: "L'envoi s'est arrêté avant la fin. Envoie le fichier à nouveau."
        unsupported_format: "Ce fichier n'est ni un GeoTIFF, ni un MBTiles, ni un PMTiles lisible."
        not_georeferenced: "Cette image n'est pas géoréférencée : exporte l'orthophoto en GeoTIFF depuis ton logiciel de drone (une simple photo JPEG ne suffit pas)."
        not_raster: "Ce fichier ne contient pas d'image lisible (deux bandes, ou des tuiles vectorielles). Une orthophoto en couleurs ou un raster à une seule bande (relief, thermique, NDVI) conviennent."
        empty: "Ce fichier ne contient aucune tuile."
        source_unreachable: "L'adresse d'origine des tuiles ne répond pas, ou refuse l'accès."
        conversion_failed: "La préparation a échoué. Réessaie ; si cela recommence, écris à Semisto."
      errors:
        no_file: "Choisis le fichier de ta vue drone."
        format: "Choisis un GeoTIFF (.tif), un .mbtiles ou un .pmtiles."
        too_large: "Ce fichier dépasse %{max} Go. Écris à Semisto : on trouvera comment l'importer."
        checksum: "Le fichier n'a pas pu être vérifié. Envoie-le à nouveau."
        expired: "Cet envoi a expiré. Envoie le fichier à nouveau."
        missing_parts: "Une partie du fichier n'est pas arrivée. Envoie-le à nouveau."
        busy: "La vue est en préparation : attends qu'elle soit prête pour la retirer."
        network: "L'envoi a été coupé. Vérifie ta connexion, puis réessaie."

    # « Publier » panel (owner) and the public view (/p/:token).
    publish:
      legend: "Vue drone"
      show: "Montrer « %{label} »"
      hint: "Désactivée par défaut. Cochée, la plus récente de tes vues drone sert de fond à la vue publique, pour tous ceux qui ont le lien."

    # Staff screen (/admin/drone-views).
    admin:
      title: "Vues drone"
      link: "Vues drone"
      back: "Demandes envoyées depuis les cartes"
      intro: "Les missions drone payées et les vues aériennes posées sur les cartes. Pose la vue sur une carte de l'acheteur : un e-mail lui donne le lien vers sa carte."
