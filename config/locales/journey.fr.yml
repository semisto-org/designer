# Project sheet ("fiche projet"), journey (parcours en étapes), bridges to
# Semisto ("Passer à l'action") and their e-mails. Keys in English, values in
# French. The frontend imports this file too (app/frontend/lib/i18n.ts).
#
# Careful with YAML 1.1: never use yes/no/on/off/y/n as keys.
fr:
  journey:
    affirmative: "Oui"
    nav:
      requests: "Demandes"

    # ----- Welcome card on /maps -----
    welcome:
      title: "Bienvenue dans ton atelier de jardin-forêt"
      intro: "Conçois ton jardin-forêt pas à pas, à ton rythme. Semisto reste à tes côtés pour de beaux plants, la mise en œuvre et le suivi."
      steps_title: "Ton parcours en quatre étapes"
      create: "Créer ma première carte"
      free_note: "Ta première carte est gratuite."
      upgrade: "Voir les formules"

    steps:
      observe:
        summary: "Comprendre ton terrain et ce que tu veux en faire."
      map:
        summary: "Dessiner le contour, relever ce qui existe déjà."
      design:
        summary: "Choisir les aménagements et les plantes, avec les bonnes quantités."
      plant:
        summary: "Passer à la plantation, avec de beaux plants et de l'aide si besoin."

    # ----- Checklist items -----
    items:
      project_sheet:
        label: "Remplir la fiche projet"
        hint: "Qui, ambitions, budget, temps disponible… au moins %{target} %."
        now: "Commence par la fiche projet : tes envies, qui vit sur le lieu, ce que tu sais déjà du site. Elle s'enregistre au fil de l'eau, reviens-y quand tu veux."
      layers_seen:
        label: "Parcourir les couches du terrain"
        hint: "Sols, pentes, eau, zones protégées : ce que le lieu sait déjà de lui-même."
        now: "Sols, pentes, eau, zones protégées : parcours les couches pour voir ce que le lieu dit déjà de lui-même."
      boundary:
        label: "Dessiner le contour du terrain"
        hint: "Il sert de cadre à tout le reste."
        now: "Trace le contour de ton terrain sur la carte, ou choisis ses parcelles cadastrales. Il sert de cadre à tout le reste."
      existing:
        label: "Relever ce qui existe déjà"
        hint: "Arbres, bâtiments, mares, chemins… au moins %{target} éléments."
        now: "Relève ce qui est déjà là : arbres, bâtiments, mares, chemins. Au moins %{target} éléments pour bien partir."
      palette:
        label: "Commencer la palette de plantes"
        hint: "Les espèces qui te plaisent et qui conviennent au lieu."
        now: "Choisis les espèces qui te plaisent et qui conviennent au lieu. Ta palette nourrit tout le plan de plantation."
      design_elements:
        label: "Dessiner un premier aménagement"
        hint: "Mare, haie, abri, chemin, clôture…"
        now: "Dessine un premier aménagement : une mare, une haie, un abri, un chemin. Le plan prend forme."
      plant_plan:
        label: "Placer des plantes sur le plan"
        hint: "Chaque plante placée alimente ta liste de plants."
        now: "Place tes plantes sur le plan. Chaque plante placée alimente ta liste de plants."
      plant_list:
        label: "Préparer la liste de plants"
        hint: "Espèces et quantités, prêtes à commander."
        now: "Prépare ta liste de plants : espèces et quantités, prêtes à commander."
      take_action:
        label: "Passer à l'action avec Semisto"
        hint: "Commander des plants, demander la mise en œuvre ou confier le suivi."
        now: "Quand tu es prêt·e, Semisto peut fournir les plants, t'aider à planter ou suivre le jardin avec toi."
      progress: "%{percent} %"
      count: "%{count} sur %{target}"

    # ----- Journey panel and chip -----
    panel:
      title: "Parcours"
      intro: "Quatre étapes pour aller de l'observation à la plantation. Les cases se cochent d'elles-mêmes à mesure que ta carte avance."
      step_of: "Étape %{index} sur %{total}"
      next_label: "Prochaine action"
      open: "Ouvrir"
      mark_stage: "Je suis à cette étape"
      current: "Étape actuelle"
      stage_saved: "Étape enregistrée : %{stage}."
      step_done: "Étape complète"
      step_count: "%{done} sur %{total}"
      advance_title: "Étape terminée"
      advance_body: "Tu as fait le tour de cette étape. Passe à « %{stage} » quand tu es prêt·e."
      advance_cta: "Passer à « %{stage} »"
      complete_title: "Le parcours est complet"
      complete_body: "Ton jardin-forêt est dessiné et prêt à planter. Continue à l'affiner, ou confie la suite à Semisto."
      tick: "Marquer comme fait"
      untick: "Décocher"
      loading: "Chargement du parcours…"
      unavailable: "Le parcours est momentanément indisponible."
      read_only: "Seuls le propriétaire et les éditeurs peuvent changer l'étape."

