# « Offrir une formule »: plans Semisto gives away from the accounts list
# (Admin::PlanGiftsController, Billing::PlanGift). Keys in English, values in
# French; the backend and the React frontend read the same file.
fr:
  admin:
    plan_gifts:
      note: "Offerte par Semisto"
      event_label:
        one: "%{plan} à %{count} compte"
        other: "%{plan} à %{count} comptes"
      give: "Offrir une formule"
      plan: "Formule"
      until: "Jusqu'au"
      submit: "Offrir"
      cancel: "Annuler"
      gifted_until: "offerte jusqu'au %{date}"
      revoke: "Reprendre"
      confirm_revoke: "Reprendre la formule offerte à %{name} ? Ses cartes au-delà de sa formule passeront en lecture seule, rien n'est effacé."
      bulk:
        title: "Offrir une formule aux comptes existants"
        body: "Chaque compte créé avant la date choisie et resté en formule gratuite reçoit la formule offerte, jusqu'à la date de fin. Les comptes qui paient déjà ne changent pas. On peut le refaire sans risque : un compte qui l'a déjà ne la reçoit pas deux fois."
        created_before: "Comptes créés avant le"
        submit: "Offrir à ces comptes"
        confirm: "Offrir la formule %{plan} jusqu'au %{date} à tous les comptes gratuits créés avant le %{before} ?"
