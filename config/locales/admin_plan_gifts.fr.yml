        given: "Formule %{plan} offerte à %{name} jusqu'au %{date}."
        already: "%{name} a déjà la formule %{plan} jusqu'au %{date} ou plus tard."
        given_all:
          zero: "Aucun compte à qui offrir la formule %{plan} : tous l'ont déjà ou paient."
          one: "Formule %{plan} offerte à 1 compte jusqu'au %{date}."
          other: "Formule %{plan} offerte à %{count} comptes jusqu'au %{date}."
        revoked: "La formule offerte à %{name} est reprise."
      errors:
        invalid: "Choisis une formule et une date de fin à venir."
    dashboard:
      events:
        actions:
          plan_gifted: "a offert une formule à"
          plans_gifted: "a offert la formule"
          plan_gift_revoked: "a repris la formule offerte à"
