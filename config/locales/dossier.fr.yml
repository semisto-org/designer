      cover_layer: "Fond du plan : %{detail}, %{label}."
      cover_layer_plain: "Fond du plan : %{label}."
      layers: "Couches de données : %{detail}, %{label}."
      layers_plain: "Couches de données : %{label}."
      relief: "Relief : %{label}."
      climate: "Climat : %{label}, « %{detail} »."
      climate_plain: "Climat : %{label}."
      plant_catalogue: "Plantes : catalogue de Semisto Designer ; provenance indiquée pour chaque valeur."
      plant_source: "%{source} pour %{fields}"
      plant_license: "licence : %{license}"
      pfaf: "Les valeurs issues de PFAF (Plants For A Future) sont citées comme telles ; aucun texte de PFAF n'est reproduit."
      plant_fields:
        spread: "l'envergure"
        height: "la hauteur"
        hardiness: "la rusticité"
      soil: "Lecture des analyses de sol : repères généraux (%{provenance})."
      bioindicators: "Plantes bio-indicatrices : liste établie par Semisto, à vérifier."
      regulation: "Urbanisme : %{label}."
      planting: "Cohérence de la plantation : règles de densité, d'exposition et d'association issues de la pratique des jardins-forêts."
      photos: "Photos : prises par les membres du projet."
      finances: "Finances : hypothèses saisies pour ce projet, calcul de Semisto Designer. Aucune donnée tierce."
