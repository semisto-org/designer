  mcp:
    tools:
      list_territories:
        title: "Lister les territoires"
        description: "Les territoires des équipes de l'utilisateur (module « Territoire » : une commune lue en entier pour décider où agir) : nom, équipe, surface en km², région, archivé ou non, modifiable ou non, et ce que contient leur dossier par type (actor, source, expectation, marker, lead), avec les brouillons en attente. Passe ensuite l'identifiant à get_territory."
      get_territory:
        title: "Lire un territoire"
        description: "Un territoire en entier : limite de la commune en GeoJSON, emprise, centre, couches de la région lisibles ici (sols, ruissellement, plan de secteur, parcellaire agricole, photos aériennes depuis 1971…), cartes de terrain de l'équipe dans la commune (get_map les lit), et son dossier par type : actor (qui y travaille déjà : à rencontrer avant toute recherche), source (document trouvé : lien, auteur, date, droits, extraits), expectation (ce que la commune a déjà voté, avec son année et ses sources), marker (fait daté et localisable, avec son niveau de preuve : computed, seen, confirmed), lead (piste d'aménagement : rang soil, slow ou structure, thème water ou tree, foncier, ordre de grandeur, réponse de l'exploitant, qui l'entretient, décision du collège). research_grid dit quoi chercher sur ce territoire et où ; rules donne les règles du carnet à respecter dans tes propositions. Avant de proposer, lis aussi get_design_guide avec le chapitre « territory »."
      propose_territory_items:
        title: "Proposer au dossier d'un territoire"
        description: "Pose en brouillons ce que tu as trouvé sur un territoire : personnes et organismes à rencontrer (actor), documents (source : properties.url, author, published_on, rights open, restricted ou unknown, source_kind, excerpts : quelques phrases citées, jamais le document entier), attentes votées par la commune (expectation : properties.year, source_ids), faits datés et localisés (marker : geometry Point, properties.occurred_on, proof, marker_kind, source_ids), pistes d'aménagement (lead : properties.rank, theme, land, magnitude, expectation_ids ; geometry Point, LineString ou Polygon). Chaque brouillon porte sa justification (rationale) : d'où vient l'information et pourquoi elle compte ici. Un axe d'écoulement calculé qui tombe sur une inondation racontée est une concordance à vérifier (proof computed), jamais une preuve. Ne dimensionne aucun ouvrage : un ordre de grandeur seulement. L'humain garde ou écarte chaque brouillon sur la page du territoire. Un doublon (même type et même titre, ou même lien) est refusé."
      withdraw_territory_drafts:
        title: "Retirer des brouillons d'un territoire"
        description: "Retire des brouillons que tu as proposés au dossier d'un territoire et que personne n'a encore revus (item_ids donnés par get_territory). Ce qu'une personne a gardé ne se retire pas."
    params:
      territory_id: "Identifiant du territoire, donné par list_territories."
      territory_items: "Les éléments à proposer au dossier, chacun avec sa justification."
      territory_item_kind: "actor (qui y travaille), source (document), expectation (attente votée), marker (fait daté et localisé), lead (piste d'aménagement)."
      territory_item_title: "Titre court : « Cellule GISER », « PCDN d'Yvoir (2016) », « Inondation rue du Moulin, juillet 2021 », « Haie sur talus en tête du vallon de… »."
      territory_item_body: "Ce qu'il faut savoir, en quelques phrases : résumé d'une source, pourquoi une piste, ce qui s'est passé."
      territory_item_rationale: "D'où vient l'information (lien, page, date) et pourquoi elle compte pour ce territoire."
      territory_item_geometry: "GeoJSON en WGS84 [longitude, latitude] : Point pour un repère ; Point, LineString ou Polygon pour une piste. Rien pour les autres types. À moins de 5 km de la limite du territoire."
      territory_item_properties: "Les attributs du type (voir values dans get_territory) : actor → organization, function, met_on, contact ; source → url, author, published_on, rights, source_kind, excerpts ; expectation → year, source_ids, validated ; marker → occurred_on, proof, marker_kind, source_ids ; lead → rank, theme, land, magnitude, expectation_ids, seen_on_site, keeper {role, gestures, hours_per_year, agreement, lifespan_years}. Les autres clés sont ignorées."
      territory_item_ids: "Identifiants des brouillons à retirer (dossier dans get_territory)."
    errors:
      territory_not_found: "Territoire %{id} introuvable, ou tu ne fais pas partie de son équipe. list_territories donne les tiens."
      territory_archived: "Ce territoire est archivé : il se lit, mais on n'y propose plus rien."
      territory_module_off: "Le module « Territoire » n'est pas attribué à l'équipe de ce territoire : il se lit, mais on n'y propose plus rien."
      territory_duplicate: "déjà au dossier (élément %{id})"
      territory_geometry: "géométrie GeoJSON illisible"
    notes:
      territories: "Un territoire se lit en entier avec get_territory. On y décide où agir ; on conçoit ensuite sous-bassin par sous-bassin, sur des cartes de terrain."
      review_territory_items: "Les brouillons attendent sur la page du territoire (review_url), où la personne garde ou écarte chacun. Dis-lui que rien n'entre dans le carnet sans elle, et invite-la à aller voir sur place les repères et les pistes avant de les montrer au collège."
      territory_rules: "1. On rencontre d'abord ceux qui travaillent déjà sur le territoire (actor) : le carnet relie leur travail, il ne le refait pas. 2. Chaque attente, source et repère porte sa source et sa date ; un document ancien est une attente à confirmer par l'administration. 3. Un axe calculé qui croise un fait raconté est une concordance à vérifier (proof computed) : seul le terrain la change en seen ou confirmed. 4. D'abord le sol (rank soil : couverture d'hiver, sens du travail), puis ralentir en haut du bassin (slow), puis les ouvrages (structure). 5. Ordre de grandeur seulement, jamais de dimensionnement ; quand des biens ou des personnes sont exposés, renvoie vers un bureau d'ingénieurs. 6. Une piste sur terre agricole n'entre au carnet du collège qu'après la rencontre avec l'exploitant et sa réponse ; elle reste une zone floue tant qu'il n'a pas dit oui. 7. Une piste sans gestionnaire est orpheline. 8. Jamais de nom de propriétaire tiré du cadastre : seulement le type de foncier (public, agricultural, private)."
