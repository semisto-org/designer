          why: "Avant toute recherche, rencontre la cellule érosion (GISER en Wallonie), le contrat de rivière, l'agent environnement de la commune. Leur travail est la base du carnet : on le relie, on ne le refait pas."
        sources:
          title: "Aucune source pour l'instant"
          why: "Plans communaux, contrat de rivière, presse sur les inondations, comptes rendus du conseil : demande à ton IA de les chercher (grille de recherche ci-dessous), elle les propose ici avec leur auteur, leur date et leurs droits."
