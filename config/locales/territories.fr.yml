          title: "Ce que le territoire demande déjà"
          why: "Chaque attente vient d'un document que la commune a voté. Note son année : un plan de 2012 n'est plus forcément une attente, fais-la confirmer par l'administration."
        basins:
          title: "Découpe la commune en sous-bassins"
          why: "La commune décide, le sous-bassin se conçoit : l'eau se lit de l'amont vers l'aval. Nomme chaque vallon (le contrat de rivière les connaît), numérote-les depuis le plus en amont, puis rattache-y repères et pistes."
        markers:
          title: "Aucun repère daté"
          why: "Une inondation rue du Moulin en 2021, une mare comblée : place-les sur la carte avec leur source. Un axe calculé qui tombe dessus est une concordance à vérifier, pas une preuve : va voir, si possible sous la pluie."
        leads:
          title: "Aucune piste d'aménagement"
          why: "D'abord le sol (couverture d'hiver, sens du travail), puis ralentir l'eau en haut du bassin, puis seulement les ouvrages. Une piste donne un ordre de grandeur ; on la dimensionne quand elle devient une carte de terrain."
        requests:
          title: "Rien à obtenir pour l'instant"
          why: "Un avis de la cellule GISER, l'inventaire du contrat de rivière, un relevé des plaintes à la commune : note ici ce qu'il faut demander, et à qui. Quand le document arrive, il devient une source."
