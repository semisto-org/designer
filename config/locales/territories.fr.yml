  mcp:
    tools:
      list_territories:
        title: "Lister les territoires"
        description: "Les territoires des équipes de l'utilisateur (module « Territoire » : une commune lue en entier pour décider où agir) : nom, équipe, surface en km², région, archivé ou non, modifiable ou non, et ce que contient leur dossier par type (actor, source, expectation, basin, marker, lead, request), avec les brouillons en attente. Passe ensuite l'identifiant à get_territory."
      get_territory:
        title: "Lire un territoire"
        description: "Un territoire en entier : limite de la commune en GeoJSON, emprise, centre, couches de la région lisibles ici (sols, ruissellement, plan de secteur, parcellaire agricole, photos aériennes depuis 1971…), cartes de terrain de l'équipe dans la commune (get_map les lit), et son dossier par type : actor (qui y travaille déjà : à rencontrer avant toute recherche), basin (sous-bassin versant, l'unité de conception : order 1 pour le plus en amont, outlet, contour facultatif), source (document trouvé : lien, auteur, date, droits, extraits), expectation (ce que la commune a déjà voté, avec son année et ses sources), marker (fait daté et localisable, avec son niveau de preuve : computed, seen, confirmed), lead (piste d'aménagement : rang soil, slow ou structure, thème water ou tree, foncier, ordre de grandeur, réponse de l'exploitant, qui l'entretient, décision du collège), request (document ou information à obtenir, auprès de qui, où on en est). Chaque élément gardé porte, s'il y en a une, la modification que tu as proposée et qui attend (pending_update). properties_by_kind donne les attributs de chaque type et leurs valeurs. research_grid dit quoi chercher sur ce territoire et où ; rules donne les règles du carnet à respecter dans tes propositions. Avant de proposer, lis aussi get_design_guide avec le chapitre « territory »."
      propose_territory_items:
        title: "Proposer au dossier d'un territoire"
        description: "Pose en brouillons ce que tu as trouvé sur un territoire : personnes et organismes à rencontrer (actor), documents (source : properties.url, author, published_on, rights open, restricted ou unknown, source_kind, excerpts : une liste de quelques phrases citées, jamais le document entier), attentes votées par la commune (expectation : properties.year, source_ids), sous-bassins versants (basin : properties.order depuis l'amont, outlet ; geometry Polygon facultative), faits datés et localisés (marker : geometry Point, properties.basin_id, occurred_on, proof, marker_kind, source_ids), pistes d'aménagement (lead : properties.basin_id, rank, theme, land, magnitude, expectation_ids ; geometry Point, LineString ou Polygon), documents ou informations à obtenir (request : properties.request_kind document ou info, from, actor_id, state to_ask, asked, received ou refused). Un basin_id renvoie à un sous-bassin du dossier, brouillon compris. Pour renvoyer à un brouillon du même appel, donne-lui un ref (« b1 ») et utilise basin_ref, actor_ref, source_ref, source_refs ou expectation_refs à la place de l'identifiant : les sous-bassins et leurs repères partent ensemble. Chaque brouillon porte sa justification (rationale) : d'où vient l'information et pourquoi elle compte ici. Un axe d'écoulement calculé qui tombe sur une inondation racontée est une concordance à vérifier (proof computed), jamais une preuve. Ne dimensionne aucun ouvrage : un ordre de grandeur seulement. L'humain garde ou écarte chaque brouillon sur la page du territoire. Un doublon (même type et même titre, ou même lien) est refusé."
      propose_territory_updates:
        title: "Proposer des modifications au dossier d'un territoire"
        description: "Propose de modifier des éléments qu'une personne a déjà gardés dans le dossier d'un territoire (identifiants dans get_territory) : title, body, geometry (null la retire) ou une partie de properties (seules les clés données changent ; null retire une valeur ; keeper, farmer et decision se complètent clé par clé). Exemples : le foncier d'une piste une fois le propriétaire connu, son gestionnaire, le niveau de preuve d'un repère vu sur place, les extraits d'une source. Chaque modification porte sa justification. Rien ne change avant qu'une personne l'accepte, en entier ou champ par champ, sur la page du territoire. Une nouvelle proposition remplace celle qui attendait sur le même élément. Un brouillon ne se modifie pas ainsi : retire-le (withdraw_territory_drafts) et propose-le à nouveau."
      propose_territory_deletions:
        title: "Proposer de retirer des éléments d'un territoire"
        description: "Propose de retirer du dossier d'un territoire des éléments qu'une personne a gardés (une source en double, un repère placé deux fois), avec une justification commune. Rien n'est retiré avant qu'une personne l'accepte sur la page du territoire. Un brouillon se retire directement avec withdraw_territory_drafts."
      get_hydrography:
        title: "L'eau d'un territoire"
        description: "Ce que l'autorité de l'eau de la région publie sur les cours d'eau et les bassins d'un territoire (en Wallonie, le SPW). watercourses : chaque cours d'eau qui traverse la commune, avec son nom, sa catégorie légale (navigable, category_1, category_2, category_3, unclassified), son gestionnaire (manager : qui l'entretient et à qui demander une autorisation), son numéro à l'atlas et sa longueur dans la commune. runoff_axes : les axes de ruissellement concentré (LIDAXES), groupés par classe de surface collectée en amont (by_class, à partir de min_class ; classes_available dit ce que vaut chaque classe), avec leur tracé. water_bodies : les bassins des masses d'eau de surface (limites officielles, 30 à 150 km²), avec leur fiche PDF. sub_basins : les bassins contributifs des secteurs de cours d'eau (en Wallonie les secteurs PARIS, 0,5 à 20 km² : l'échelle de conception d'un territoire), chacun avec son contour officiel, sa surface, sa part dans la commune, ce qui en est en amont hors commune, le secteur où il se jette (flows_into), un ordre suggéré depuis l'amont et un brouillon basin prêt pour propose_territory_items (draft, avec son ref : les repères du même appel le citent par basin_ref). Relis chaque brouillon avant de le proposer : regroupe les petits secteurs d'un même vallon, corrige l'ordre si le terrain le contredit, et dis d'où vient le contour. Sans contours (outlines: false), la réponse est bien plus légère."
        params:
          min_runoff_class: "Plus petite classe d'axes de ruissellement à rendre (1 à 5 ; voir classes_available). Par défaut 3 en Wallonie : 20 ha collectés en amont et plus."
          outlines: "false pour ne pas rendre les tracés et les contours (seulement les noms, les longueurs et les surfaces). Par défaut : true."
        note: "Ces couches sont celles de l'administration : un cours d'eau a pu être déplacé, un axe de ruissellement est calculé sur le relief, pas observé. Le gestionnaire est celui que prévoit la loi pour la catégorie : la commune confirme qui intervient vraiment. Propose les sous-bassins en brouillons, et invite l'équipe à les parcourir avec le contrat de rivière."
      withdraw_territory_drafts:
        title: "Retirer des brouillons d'un territoire"
        description: "Retire des brouillons que tu as proposés au dossier d'un territoire et que personne n'a encore revus (item_ids), et les modifications ou retraits que tu as proposés et qui attendent encore (update_ids, donnés par propose_territory_updates ou pending_update dans get_territory). Ce qu'une personne a gardé ne se retire pas."
    params:
      territory_id: "Identifiant du territoire, donné par list_territories."
      territory_items: "Les éléments à proposer au dossier, chacun avec sa justification."
      territory_item_kind: "actor (qui y travaille), source (document), expectation (attente votée), basin (sous-bassin versant), marker (fait daté et localisé), lead (piste d'aménagement), request (document ou information à obtenir)."
      territory_item_title: "Titre court : « Cellule GISER », « PCDN d'Yvoir (2016) », « Inondation rue du Moulin, juillet 2021 », « Haie sur talus en tête du vallon de… »."
      territory_item_body: "Ce qu'il faut savoir, en quelques phrases : résumé d'une source, pourquoi une piste, ce qui s'est passé."
      territory_item_rationale: "D'où vient l'information (lien, page, date) et pourquoi elle compte pour ce territoire."
      territory_item_geometry: "GeoJSON en WGS84 [longitude, latitude] : Point pour un repère ; Point, LineString ou Polygon pour une piste ; Polygon pour un sous-bassin (facultatif). Rien pour les autres types. À moins de 5 km de la limite du territoire."
      territory_item_properties: "Les attributs du type (voir values dans get_territory) : actor → organization, function, met_on, contact ; source → url, author, published_on, rights, source_kind, excerpts ; expectation → year, source_ids, validated ; basin → order (1 = le plus en amont), outlet ; marker → basin_id, occurred_on, proof, marker_kind, source_ids ; lead → basin_id, rank, theme, land, magnitude, expectation_ids, seen_on_site, keeper {role, gestures, hours_per_year, agreement, lifespan_years} ; request → request_kind, from, actor_id, state, asked_on, received_on, source_id. Pour renvoyer à un brouillon du même appel : basin_ref, actor_ref, source_ref, source_refs, expectation_refs (son ref). Les autres clés sont ignorées."
      territory_item_ids: "Identifiants des brouillons à retirer (dossier dans get_territory)."
      territory_item_ref: "Un nom court pour ce brouillon (« b1 », « giser »), qu'un autre brouillon du même appel peut citer (basin_ref, actor_ref, source_ref, source_refs, expectation_refs)."
      territory_updates: "Les modifications, une par élément, chacune avec sa justification."
      territory_item_id: "Identifiant d'un élément gardé du dossier (get_territory)."
      territory_changes: "Ce qui change : title, body, geometry (GeoJSON, null la retire), properties (seules les clés données ; null retire une valeur ; voir properties_by_kind dans get_territory)."
      territory_deletion_ids: "Identifiants des éléments gardés à retirer (get_territory)."
      territory_deletion_rationale: "Pourquoi les retirer : doublon, erreur, document retiré par son auteur…"
      territory_update_ids: "Identifiants des modifications ou retraits proposés à retirer (propose_territory_updates, propose_territory_deletions ou pending_update dans get_territory)."
    errors:
      territory_not_found: "Territoire %{id} introuvable, ou tu ne fais pas partie de son équipe. list_territories donne les tiens."
      territory_archived: "Ce territoire est archivé : il se lit, mais on n'y propose plus rien."
      territory_module_off: "Le module « Territoire » n'est pas attribué à l'équipe de ce territoire : il se lit, mais on n'y propose plus rien."
      territory_duplicate: "déjà au dossier (élément %{id})"
      territory_geometry: "géométrie GeoJSON illisible"
      territory_ref_twice: "le ref « %{ref} » est déjà donné à un autre brouillon de cet appel"
      territory_ref_unknown: "aucun brouillon de cet appel ne porte le ref « %{ref} »"
      territory_ref_failed: "renvoie au brouillon « %{ref} », qui n'a pas été créé"
      territory_nothing_to_withdraw: "Donne item_ids (brouillons) ou update_ids (modifications proposées)."
      hydrography_not_configured: "La région de ce territoire ne publie pas encore ses cours d'eau et ses bassins dans Terranova."
      hydrography_unavailable: "Le service de l'administration de l'eau ne répond pas pour le moment. Réessaie dans quelques minutes."
    territory_update_errors:
      empty: "aucune modification donnée"
      fields: "champs inconnus : %{fields} (seulement %{allowed})"
      title: "le titre doit faire de 2 à %{max} caractères"
      text: "%{field} doit être un texte"
      geometry: "géométrie GeoJSON illisible"
      properties: "properties doit être un objet non vide"
      property: "« %{key} » n'est pas un attribut de %{kind} (seulement %{allowed})"
      group: "« %{key} » doit être un objet"
      value: "valeur illisible pour « %{key} » (attendu : %{type})"
      value_in: "valeur inconnue pour « %{key} » (seulement %{allowed})"
      not_found: "élément %{id} introuvable dans ce dossier"
      draft: "l'élément %{id} est encore un brouillon : retire-le (withdraw_territory_drafts) et propose-le à nouveau"
      draft_deletion: "l'élément %{id} est encore un brouillon : withdraw_territory_drafts le retire"
      twice: "l'élément %{id} apparaît deux fois dans cet appel"
      same_as_current: "l'élément a déjà ces valeurs"
      already_pending: "la même proposition attend déjà (%{id})"
    notes:
      territories: "Un territoire se lit en entier avec get_territory. On y décide où agir ; on conçoit ensuite sous-bassin par sous-bassin, sur des cartes de terrain."
      review_territory_updates: "Les modifications attendent sur la page du territoire (review_url), en haut du dossier : la personne coche ce qu'elle accepte, champ par champ. Rien ne change sans elle."
      review_territory_deletions: "Les retraits attendent sur la page du territoire (review_url) : rien n'est retiré avant que la personne l'accepte."
      review_territory_items: "Les brouillons attendent sur la page du territoire (review_url), où la personne garde ou écarte chacun. Dis-lui que rien n'entre dans le carnet sans elle, et invite-la à aller voir sur place les repères et les pistes avant de les montrer au collège."
      territory_rules: "1. On rencontre d'abord ceux qui travaillent déjà sur le territoire (actor) : le carnet relie leur travail, il ne le refait pas. 2. Chaque attente, source et repère porte sa source et sa date ; un document ancien est une attente à confirmer par l'administration. 3. Un axe calculé qui croise un fait raconté est une concordance à vérifier (proof computed) : seul le terrain la change en seen ou confirmed. 4. D'abord le sol (rank soil : couverture d'hiver, sens du travail), puis ralentir en haut du bassin (slow), puis les ouvrages (structure). 5. Ordre de grandeur seulement, jamais de dimensionnement ; quand des biens ou des personnes sont exposés, renvoie vers un bureau d'ingénieurs. 6. Une piste sur terre agricole (ou au foncier inconnu) n'entre au carnet du collège qu'après la rencontre avec l'exploitant et sa réponse ; elle reste une zone floue tant qu'il n'a pas dit oui. Seule exception, une pratique du sol (rank soil) : elle y entre sans tracé et sans nommer de ferme ni de parcelle, et la version publique attend le oui. 7. Une piste sans gestionnaire est orpheline. 8. Jamais de nom de propriétaire tiré du cadastre : seulement le type de foncier (public, agricultural, private). 9. L'eau se lit par sous-bassin, de l'amont vers l'aval : rattache chaque repère et chaque piste à son sous-bassin (basin_id). 10. Ce qu'il faut encore obtenir (un avis, un inventaire, une information) est une request, avec à qui le demander ; une fois reçu, le document devient une source (source_id). 11. Un élément gardé appartient aux personnes : pour le corriger, propose une modification (propose_territory_updates) ou un retrait (propose_territory_deletions), jamais un doublon."
