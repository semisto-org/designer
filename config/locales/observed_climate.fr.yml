      spring_none: "Aucune gelée de printemps en %{years} ans."
      autumn: "Les premières gelées arrivent vers le %{mean} ; une année sur cinq, dès le %{early}."
      autumn_rare: "Les gelées d'automne sont rares ici : %{count} années sur %{years}."
      autumn_none: "Aucune gelée d'automne en %{years} ans."
      season: "Entre les deux, environ %{days} jours sans gel pour les fleurs et les jeunes pousses."
      ribbon_label: "Frise de l'année : gelées possibles jusqu'au %{late}, saison sans gel, gelées possibles dès le %{early}."
      mean_short: "en moyenne"
      one_in_five: "1 an sur 5"
      frost_free: "sans gel"
      today: "aujourd'hui"
    months:
      title: "Pluie et température, mois par mois"
