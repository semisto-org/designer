      spring_later: "dernière gelée %{days} jours plus tard"
      autumn_later: "premières gelées %{days} jours plus tard"
      autumn_earlier: "premières gelées %{days} jours plus tôt"
      hot: "journées à 30 °C %{delta} par an"
      rain: "pluie %{delta} par an"
      gdd: "degrés-jours %{delta}"
    grid_note: "Valeurs d'une maille d'environ %{km} km autour de ton terrain : un fond de vallée gèle souvent plus tard, un coteau plus tôt."
