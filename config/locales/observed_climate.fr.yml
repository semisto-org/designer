      rain_legend: "pluie"
      temp_legend: "température moyenne"
      range_legend: "minimum et maximum du jour, en moyenne"
      chart_label: "Graphique : pluie (barres) et température moyenne (ligne) de janvier à décembre."
      rain: "Il tombe %{rain} par an en moyenne ; %{wettest} est le mois le plus arrosé, %{driest} le plus sec."
    year:
      title: "L'année en chiffres"
      cold: "La nuit la plus froide de l'année descend en moyenne à %{temp} (%{coldest} au pire en trente ans) : zone de rusticité %{zone}."
