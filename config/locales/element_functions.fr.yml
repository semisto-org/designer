    look:
      food: "Cueille ce qui pousse déjà : un vieux pommier, des mûres dans la haie, de l'ail des ours au bord du bois. Note-le sur la carte."
      water: "Après une averse, va voir où l'eau coule, où elle reste et d'où elle sort. Un toit, un creux, une source discrète comptent."
      fertility: "Regarde où l'herbe est plus verte et plus haute, et où poussent orties et trèfles : ils disent où le sol est déjà riche."
      soil_protection: "Cherche la terre nue, les rigoles et l'eau boueuse après la pluie : c'est là que le sol part."
      windbreak: "Un jour de vent d'ouest, puis de nord-est, fais le tour : où le vent tape, et derrière quoi on est à l'abri ?"
      shade: "En plein été vers 15 h, repère les coins d'ombre où tu aimes t'asseoir, et ceux qui manquent."
      microclimate: "Un matin de gelée, regarde où le givre reste et où il fond d'abord : un mur au sud, un talus, une mare."
      habitat: "Cherche les tas de bois, les vieux arbres, les ronciers et les herbes hautes : c'est là que vivent les auxiliaires."
      pollination: "Au printemps, compte les abeilles et les bourdons, et note ce qui fleurit de février à octobre."
      wood: "Repère les arbres à recéper, les branches tombées et la haie à tailler : c'est ton bois de chauffe et de paillage."
      fire_protection: "Regarde d'où viendrait un feu en été (herbes sèches, résineux, vent dominant) et où l'eau pourrait l'arrêter."
    resources:
      water: "de l'eau"
      organic_matter: "de la matière organique"
      compost: "du compost"
      food: "de la nourriture"
      wood: "du bois"
      heat: "de la chaleur"
    errors:
      unknown: "Une des fonctions de cet élément n'est pas connue."
