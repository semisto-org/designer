# Collaboration: sharing a map, discussions "façon Basecamp", public view.
# Keys in English, values in French. Backend (mailers, controllers) and the
# React frontend read the same file.
fr:
  activerecord:
    errors:
      models:
        map_invitation:
          attributes:
            email_address:
              already_participant: "a déjà accès à cette carte"
            role:
              editor_limit: "est limité à %{count} éditeurs par carte"
        comment:
          attributes:
            body:
              blank: "ne peut pas être vide"
              too_long: "est trop long (maximum %{count} caractères)"
            commentable:
              invalid: "n'appartient pas à cette carte"
        map_publication:
          attributes:
            title:
              blank: "ne peut pas être vide"
  collab:
    sharing:
      errors:
        editor_limit: "Cette carte a déjà ses %{count} éditeurs, le maximum. Passez un éditeur en lecteur pour libérer une place."
        editor_limit_invite: "Cette carte a déjà ses %{count} éditeurs (invitations en attente comprises). Invitez cette personne comme lecteur, ou libérez une place d'éditeur."
        role: "Ce rôle n'existe pas : choisissez éditeur ou lecteur."
        owner_fixed: "Le rôle du propriétaire ne peut pas changer."
        owner_stays: "Le propriétaire ne peut pas quitter sa carte."
        already_participant: "Cette personne a déjà accès à la carte."
        invalid_email: "Cette adresse e-mail ne semble pas valide."
        rate_limited: "Trop d'invitations envoyées. Réessayez dans une heure."
    joining:
      sign_in_first: "Connectez-vous pour rejoindre la carte « %{map} » : un lien vous sera envoyé par e-mail, sans mot de passe."
      joined: "Bienvenue sur la carte « %{map} »."
    comments:
      errors:
        author_only: "Seul l'auteur peut modifier ce commentaire."
        cannot_delete: "Seuls l'auteur du commentaire et le propriétaire de la carte peuvent le supprimer."
  map_invitation_mailer:
    invite:
      subject: "%{inviter} vous invite sur la carte « %{map} »"
      greeting: "Bonjour,"
      body: "%{inviter} vous invite à rejoindre la carte « %{map} » sur Semisto Designer, en tant que %{role}."
      role_editor: "Un éditeur dessine et modifie la carte, et participe aux discussions."
      role_viewer: "Un lecteur consulte la carte et participe aux discussions."
      button: "Rejoindre la carte"
      signin_hint: "Vous serez invité à vous connecter (avec Google ou un lien par e-mail, sans mot de passe) si ce n'est pas déjà fait."
      expiry: "Cette invitation est valable jusqu'au %{date}."
  comment_mailer:
    open_thread: "Voir la discussion"
    how_to_stop: "Pour ne plus recevoir ces e-mails, ouvrez le panneau « Discussions » de la carte et décochez « Recevoir les discussions par e-mail »."
    on_element: "« %{title} » (carte « %{map} »)"
    mentioned:
      subject: "%{author} vous a mentionné dans « %{title} »"
      intro: "%{author} vous a mentionné dans la discussion de %{title} :"
      reason: "Vous recevez ce message parce que vous avez été mentionné."
    new_comment:
      subject: "%{author} a commenté « %{title} »"
      intro: "%{author} a écrit dans la discussion de %{title} :"
      reason: "Vous recevez ce message parce que vous suivez cette discussion."
