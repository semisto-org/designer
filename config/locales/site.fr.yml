  site:
    seo:
      home:
        title: "Cartographie ton terrain, conçois ton jardin-forêt"
        description: "L'atelier en ligne de Semisto : cartographie ton terrain avec précision, comprends-le, puis conçois ton jardin-forêt pour le climat qui vient, avec ton IA à tes côtés."
      features:
        title: "Fonctionnalités"
        description: "Fond de carte et couches du Géoportail, dessin de l'existant, palette de plantes, fiche projet, partage et commentaires, et ton IA qui lit ta carte."
      pricing:
