    home:
      story:
        cta: "Ouvrir mon carnet"
        months: ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"]
        stamp:
          bare: "terrain nu"
          observe: "on observe"
          planting: "jour de plantation"
          growing: "an %{year} du jardin-forêt"
        canvas:
          wind: "vent d'ouest"
          water: "l'eau s'arrête ici"
          slope: "pente douce vers le sud"
          walnut: "noyer · 18 m à 30 ans"
          hedge: "haie champêtre"
          shade: "l'ombre atteint le potager"
          yours: "ton terrain"
        # One entry per chapter of CHAPTERS in app/frontend/components/site/timelapse/model.ts.
        # The first one is the opening: its kicker is the scroll cue.
        chapters:
          - kicker: "fais défiler : trente ans vont passer"
            title: "Dessine aujourd'hui le jardin-forêt de 2056."
            body: "Designer te montre ce que ton terrain va devenir, saison après saison, et t'apprend à le lire en chemin."
          - kicker: "janvier 2026"
            title: "Voici ton terrain."
            body: "Un quart d'hectare de prairie, une pente douce vers le sud, un creux qui reste humide en hiver. Une maison, un vieux chemin. Pour l'instant, c'est tout."
          - kicker: "avril 2026 · observer"
            title: "Avant de dessiner, on regarde."
            body: "Designer lit les couches de ta région : la pente, le sol, l'eau qui ruisselle, le vent dominant. Ici, l'eau descend vers le creux. C'est là que la mare voudra être."
          - kicker: "novembre 2026 · planter"
            title: "Chaque cercle, c'est un arbre à trente ans."
            body: "Une haie champêtre tout autour, les grands arbres au nord, puis des fruitiers et des arbustes qui descendent en lisière jusqu'aux sentiers. Les pointillés montrent la place que chacun prendra adulte. C'est là que se jouent la plupart des erreurs."
          - kicker: "avril 2027 · an 1"
            title: "Le premier printemps."
            body: "Les plants font un mètre. Le sol entre eux est couvert de paille : c'est lui qui travaille cette année."
          - kicker: "août 2031 · an 5"
            title: "Les premières récoltes."
            body: "Pommes, cassis, framboises. La haie et les aulnes cassent déjà le vent d'ouest, et le sol ne se voit plus sous la consoude et les fraisiers. Le noyer, lui, prend son temps."
          - kicker: "octobre 2041 · an 15"
            title: "L'ombre a changé de place."
            body: "Les couronnes se touchent. En fin de journée, l'ombre du noyer atteint le potager. Avec Designer, tu l'aurais vu venir dès le dessin."
          - kicker: "janvier 2056 · an 30"
            title: "En hiver, on voit la structure."
            body: "Les branches nues laissent passer la lumière basse. C'est la saison où l'on taille, où l'on observe, où l'on prépare la suite."
          - kicker: "juin 2056 · an 30"
            title: "Une forêt qui nourrit."
            body: "De grands arbres, des fruitiers, des arbustes, des plantes couvre-sol le long des sentiers, et des fruits de juin à novembre. Les oiseaux sont revenus."
            hint: "Clique sur le terrain pour y planter un arbre, et regarde-le pousser."
          - kicker: "et tout autour"
            title: "Ton jardin-forêt, et tous les autres."
            body: "Chaque carte dessinée dans Designer est un jardin-forêt de plus en Europe. En route vers l'ère des forêts comestibles."
        final_cta: "Créer ma carte gratuite"
        final_secondary: "Voir les forfaits"
        free: "ta première carte est gratuite, pour de bon"
        example: "Terrain d'exemple. Le tien, Designer le dessine sur un vrai fond de carte."
      practical:
        kicker: "en pratique"
        title: "Ce qu'il faut savoir avant d'ouvrir ton carnet"
        data:
          kicker: "tes données"
          title: "Ton terrain, à sa vraie précision"
          body: "Là où ta région publie mieux, Designer prend le meilleur. Ailleurs en Europe, le socle commun prend le relais."
          sources:
            - name: "Wallonie"
              detail: "Cadastre, plan de secteur, relief LiDAR et sols du Géoportail"
            - name: "France"
              detail: "Cadastre et relief RGE ALTI de l'IGN"
            - name: "Luxembourg"
              detail: "Couches de geoportail.lu"
            - name: "Europe"
              detail: "Relief Copernicus, OpenStreetMap, climat qui vient"
          cta: "Toutes les fonctionnalités"
        claude:
          kicker: "avec ton Claude"
          title: "Un assistant qui connaît ton terrain"
          body: "Ton propre Claude, ou tout assistant compatible MCP, se branche sur tes cartes. Il lit la pente, le sol et ta fiche projet, puis propose des brouillons que tu acceptes ou refuses, un par un. Designer n'envoie tes cartes à aucune IA de son côté."
          cta: "Comment connecter Claude"
        pricing:
          kicker: "ce que ça coûte"
          title: "Gratuit pour commencer"
          body: "Pas d'abonnement pour les particuliers : le forfait se paie une fois par an, sans reconduction automatique."
          tiers:
            - name: "Carte gratuite"
              price: "0 €"
              note: "une carte, pour de bon"
            - name: "Forfait particulier"
              price: "%{yearly}"
              note: "par an, payé une seule fois"
            - name: "Pour les pros"
              price: "dès %{atelier}"
              note: "par mois, résiliable"
          cta: "Comparer les formules"
        open:
          kicker: "né sur un vrai terrain"
          body: "Designer a été éprouvé sur un lieu réel avant d'être ouvert à tous. Son code est libre (AGPL-3.0) et chaque source de données est citée."
          cta: "Un outil libre et transparent"
    features:
      hero:
        eyebrow: "Fonctionnalités"
        title: "Tout ce qu'il faut pour passer de la parcelle au projet"
        lead: "Cartographier, comprendre, concevoir, partager : chaque étape s'appuie sur la précédente, et Claude peut lire le tout."
      groups:
        - id: "cartographier"
          icon: "map"
          title: "Cartographier"
          intro: "Retrouve ta parcelle, vois ce qu'elle contient et relève l'existant."
          items:
            - title: "Fond de carte et cadastre"
              body: "Photos aériennes (SPW, IGN, geoportail.lu ; en Wallonie, aussi des prises de vue anciennes) et cadastre. Ta parcelle se retrouve à partir d'une adresse ou d'un numéro de parcelle."
            - title: "Couches des géoportails"
              body: "Sols, pentes, relief LiDAR, ruissellement, Natura 2000, forêts… selon ta région, et des couches européennes partout ailleurs. Chaque couche s'active en un clic ; en Wallonie, un clic sur la carte lit la donnée sous ton curseur."
            - title: "Dessin de l'existant"
              body: "Zones, lignes et points : haies, arbres, bâtiments, réseaux, mares. Longueurs et surfaces se mesurent sur la carte."
            - title: "Vue drone datée"
              body: "Une prise de vue récente de ton terrain, réalisée par Semisto et configurée sur ta carte."
              link: "/mission-drone"
              link_label: "En savoir plus sur la mission drone"
        - id: "comprendre"
          icon: "mountain"
          title: "Comprendre"
          intro: "Les données publiques deviennent des réponses sur ton terrain."
          items:
            - title: "Eau et relief"
              body: "Le terrain en relief et en courbes de niveau, simulation de pluie et de ruissellement, axes d'écoulement, cuvettes : où poser une mare ou une baissière."
              plan: "yearly"
            - title: "Climat futur"
              body: "Ce que sera le climat de ton terrain en 2050 et 2080, et ce que cela change pour le choix des plantes."
              plan: "yearly"
            - title: "Sol"
              body: "Un guide pour bien prélever, la carte des sols de la Wallonie et les plantes bio-indicatrices qui parlent de ta terre."
              plan: "yearly"
            - title: "Photos du lieu"
              body: "Tes photos se rangent sur la carte, là où elles ont été prises : un journal visuel du terrain, saison après saison."
        - id: "concevoir"
          icon: "sprout"
          title: "Concevoir"
          intro: "Dessine le jardin-forêt, plante après plante, sans perdre de vue le terrain."
          items:
            - title: "Éléments et patches"
              body: "Pose mares, haies, chemins, serres et abris, puis des patches de plantes : ces zones où se mêlent arbres, arbustes, vivaces et couvre-sols."
            - title: "Palette de plantes"
              body: "Un catalogue de plantes avec leurs besoins, leur rusticité et leurs usages. Filtre par strate, sol, exposition, mellifère, fixateur d'azote…"
            - title: "Liste de plants"
              body: "Les quantités viennent des patches que tu dessines : la liste de plants se calcule toute seule, prête pour la commande."
            - title: "Fiche projet"
              body: "Objectifs, contraintes, rythme de l'année : tout ce qui doit guider le design est noté au même endroit, et lu par Claude."
            - title: "Brouillons de Claude"
              body: "Claude propose des aménagements directement sur la carte. Chaque proposition reste un brouillon que tu acceptes ou refuses."
              plan: "yearly"
        - id: "partager"
          icon: "users"
          title: "Partager"
          intro: "Montre, discute, imprime."
          items:
            - title: "Commentaires sur la carte"
              body: "Pose un commentaire à l'endroit exact : sur un arbre, une zone, un point. Le fil de discussion reste attaché au lieu."
            - title: "Invitations et lien de partage"
              body: "Invite des personnes en lecture ou en édition, ou partage un lien en lecture seule avec ceux qui n'ont pas de compte."
            - title: "PDF à l'échelle"
              body: "Un plan imprimable à l'échelle, pour le chantier, un dossier ou l'affichage."
              plan: "yearly"
            - title: "Claude lit ta carte"
              body: "Connecte ton assistant en MCP : il lit les couches, les dessins et la fiche projet. La lecture est gratuite."
              link: "/help/connecter-claude"
              link_label: "Comment connecter Claude"
      cta:
        title: "Essaie avec ton propre terrain"
        body: "La première carte est gratuite : il suffit d'une adresse ou d'un numéro de parcelle."
    pricing:
      hero:
        eyebrow: "Tarifs"
        title: "Gratuit pour commencer, un forfait quand le projet s'étoffe"
        lead: "Pas d'abonnement pour les particuliers : le forfait se paie une fois par an, sans reconduction automatique. Tous les prix sont TTC, TVA comprise."
      individuals:
        title: "Pour les particuliers"
        intro: "Concevoir son propre jardin-forêt, à son rythme."
      pros:
