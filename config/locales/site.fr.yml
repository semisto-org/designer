      member:
        eyebrow: "Membres de Semisto"
        title: "Home à %{member} pour les membres de Semisto"
        body: "Si ta cotisation à Semisto est en ordre et que tu te connectes avec l'adresse e-mail de ton adhésion, Terranova le reconnaît tout seul : Home passe de %{yearly} à %{member}, sans code à saisir."
        note: "Pas encore membre ? Rejoins Semisto et soutiens la mission qui fait vivre cet outil."
        cta: "Découvrir Semisto"
      drone:
        title: "Mission drone : %{drone}, achat unique"
        body: "Une vue aérienne datée de ton terrain, prise par Semisto et configurée sur ta carte. Elle se commande à part, sans forfait obligatoire."
        cta: "Voir la mission drone"
      faq:
        title: "Questions fréquentes"
        items:
          - q: "Que se passe-t-il à l'échéance de Home ?"
            a: "Rien ne se renouvelle tout seul et rien n'est supprimé. Tes cartes restent lisibles, exportables et commentables, et la plus ancienne reste modifiable comme dans la formule gratuite. Quelques semaines avant l'échéance, Terranova te propose de renouveler ; si tu le fais avant la date, aucun jour n'est perdu : la nouvelle année commence à la fin de l'ancienne."
          - q: "Pourquoi pas d'abonnement pour les particuliers ?"
            a: "Un projet de jardin-forêt avance par saisons, pas par mois. Tu paies une année quand tu en as besoin, sans prélèvement automatique à surveiller."
          - q: "Quelle différence entre Home, Pro et Team ?"
            a: "Home couvre 3 cartes actives pour tes propres lieux. Pro (6 cartes actives) et Team (30 cartes actives, pour toute une équipe) sont des abonnements pensés pour mener des projets de clients, avec les offres et les barèmes. Ils se paient au mois (%{atelier} et %{bureau}) ou à l'année avec deux mois offerts (%{atelier_yearly} et %{bureau_yearly})."
          - q: "Qu'est-ce qu'une carte archivée ?"
            a: "Un projet terminé que tu ranges : il reste lisible, exportable et commentable, et ne compte plus dans tes cartes actives. Tu peux le désarchiver quand ta formule a de la place. Toutes les formules payantes gardent les cartes archivées sans limite."
          - q: "Y a-t-il une offre de lancement ?"
            a: "Oui : un abonnement Pro ou Team payé à l'année et souscrit avant le 31 décembre 2026 a un mois de plus offert sur sa première année, soit %{atelier_launch} pour Pro et %{bureau_launch} pour Team."
          - q: "Les prix sont-ils TTC ?"
            a: "Oui. Le prix affiché est celui que tu paies, TVA comprise. La TVA applicable est calculée au paiement selon ton pays, et une facture détaillée t'est envoyée automatiquement par e-mail."
          - q: "Comment se passe le paiement ?"
            a: "Le paiement est traité par Stripe, un prestataire de paiement spécialisé : Semisto ne voit ni ne conserve ton numéro de carte. Tu reçois une facture par e-mail, et tu la retrouves dans ta page « Formule et facturation »."
          - q: "Comment obtenir le prix membre de Semisto ?"
            a: "Il n'y a rien à faire : connecte-toi avec l'adresse e-mail de ton adhésion. Si ta cotisation est en ordre, Home te coûte %{member} au lieu de %{yearly}, et la réduction s'applique toute seule au paiement."
          - q: "Puis-je résilier un abonnement professionnel ?"
            a: "À tout moment, depuis « Gérer l'abonnement » dans ta page de facturation. L'accès continue jusqu'à la fin de la période déjà payée."
          - q: "Mes cartes m'appartiennent-elles ?"
            a: "Oui. Tes cartes et tes dessins restent à toi. Le code de Terranova est libre, et tu peux à tout moment demander la suppression de ton compte."
      contact:
        title: "Une question avant de te lancer ?"
        body: "Écris-nous, nous répondons volontiers : %{email}."
    drone:
      hero:
        eyebrow: "Mission drone"
        title: "Une vue aérienne de ton terrain, prise par Semisto"
        lead: "Les orthophotos publiques ont quelques années. Avec la mission drone, Semisto photographie ton terrain d'en haut, à une date que tu choisis, et configure la vue sur ta carte."
        price_note: "achat unique, TTC"
        cta_signed_out: "Commander la mission"
        cta_signed_in: "Commander la mission"
        needs_account: "Un compte gratuit suffit : tu seras invité à te connecter avant le paiement."
      how:
        title: "Comment ça se passe"
        steps:
          - title: "Tu commandes en ligne"
            body: "Le paiement est sécurisé et une facture t'est envoyée par e-mail. Aucun forfait n'est nécessaire."
          - title: "Semisto te recontacte"
            body: "Nous organisons ensemble la prise de vue : l'accès au terrain, la période, la météo."
          - title: "La vue arrive sur ta carte"
            body: "Semisto configure la vue drone sur ta carte, datée, à côté des orthophotos publiques."
      gets:
        title: "Ce que tu obtiens"
        items:
          - "Une vue aérienne récente de ton terrain, datée, qui s'ajoute aux orthophotos publiques."
          - "La vue configurée sur ta carte par Semisto : elle sert directement de fond pour dessiner."
          - "Une trace dans l'historique des vues : tu pourras comparer d'une saison, d'une année à l'autre."
      good_to_know:
        title: "Bon à savoir"
        items:
          - "Le vol dépend de la météo et du lieu : Semisto te confirme qu'il est possible avant de commencer."
          - "Le prix est TTC. Il s'agit d'une prestation réalisée par une équipe, pas d'un téléchargement automatique : compte un échange par e-mail pour organiser la prise de vue."
      faq:
        title: "Questions fréquentes"
        items:
          - q: "Faut-il un forfait pour commander ?"
            a: "Non. Il suffit d'un compte, gratuit. La mission drone est un achat à part, avec ou sans forfait."
          - q: "Pour quels terrains ?"
            a: "Pour tout terrain où le survol par drone est autorisé. Si ce n'est pas possible chez toi, Semisto te l'explique avant toute prise de vue."
          - q: "Qui voit la vue drone ?"
            a: "Elle est ajoutée à ta carte : elle est visible par les personnes avec qui tu partages cette carte."
    open_source:
      hero:
        eyebrow: "Open source"
        title: "Un outil libre, construit au grand jour"
        lead: "Semisto Terranova est un logiciel libre. Tu peux lire son code, le vérifier, l'améliorer et même l'héberger toi-même."
      licence:
        title: "Licence AGPL-3.0"
        body:
          - "Le code de Semisto Terranova est publié sous la licence GNU AGPL-3.0. En clair : tu peux l'utiliser, l'étudier, le modifier et le partager. Si tu le modifies et l'offres en ligne à d'autres personnes, tu partages tes modifications sous la même licence."
          - "Le service hébergé sur terranova.semisto.org est celui de Semisto. Le code est celui que tout le monde peut lire."
        cta: "Voir le code sur GitHub"
        url: "https://github.com/semisto-org/designer"
      why:
        title: "Pourquoi libre ?"
        body: "Parce que le savoir sur le sol, l'eau et le vivant gagne à circuler, et parce que tu dois pouvoir vérifier ce que fait l'outil de ton terrain. Le service payant finance le temps nécessaire pour le faire vivre ; le code reste à tous."
      data:
        title: "Données et licences"
        intro: "Terranova n'invente pas les données du terrain : il les affiche, avec leur source. Voici d'où elles viennent."
        columns:
          source: "Source"
          use: "Ce que nous en faisons"
          licence: "Licence et mention"
        rows:
          - source: "Géoportail de Wallonie (SPW)"
            use: "Orthophotos, cadastre, relief, sols, pentes, ruissellement, Natura 2000, plan de secteur et autres couches."
            licence: "Données ouvertes du Service public de Wallonie, réutilisées selon la licence de chaque couche. La source est citée sur la carte."
          - source: "IGN – Géoplateforme (France)"
            use: "Photos aériennes, plan IGN, cadastre (DGFiP), relief RGE ALTI et LiDAR HD, pentes, cours d'eau, forêts, carte des sols (INRAE), Natura 2000 et ZNIEFF (PatriNat)."
            licence: "Licence Ouverte 2.0 (Etalab). La source est citée sur la carte."
          - source: "UrbIS – paradigm.brussels (Bruxelles)"
            use: "Photos aériennes de la Région de Bruxelles-Capitale, la plus récente et celle de 2004."
            licence: "Données ouvertes (CC0). La source est citée sur la carte."
          - source: "Digitaal Vlaanderen et Databank Ondergrond Vlaanderen (Flandre)"
            use: "Photos aériennes d'hiver, d'été et de 1971, carte de Ferraris, relief ombré du LiDAR (DHMV II) et carte des sols."
            licence: "Données ouvertes de l'Autorité flamande (Modellicentie Gratis Hergebruik). La source est citée sur la carte."
          - source: "SPF Finances – AGDP (Belgique)"
            use: "Cadastre de Bruxelles et de Flandre : limites et numéros des parcelles."
            licence: "Données ouvertes de l'Administration générale de la Documentation patrimoniale. La source est citée sur la carte."
          - source: "geoportail.lu (Luxembourg)"
            use: "Photos aériennes, carte topographique, cadastre et relief LiDAR de l'Administration du cadastre et de la topographie."
            licence: "Données ouvertes (CC0). La source est citée sur la carte."
          - source: "Copernicus, Agence européenne pour l'environnement, ISRIC"
            use: "Hors des régions équipées : relief (Copernicus DEM GLO-30), occupation du sol (Corine Land Cover), Natura 2000 et estimations du sol (SoilGrids)."
            licence: "Copernicus DEM : © DLR e.V. 2010-2014 et © Airbus Defence and Space GmbH 2014-2018, fourni sous COPERNICUS par l'Union européenne et l'ESA. EEA : réutilisation avec mention. SoilGrids : CC BY 4.0."
          - source: "OpenStreetMap"
            use: "Données du fond de carte."
            licence: "ODbL. © les contributrices et contributeurs d'OpenStreetMap."
          - source: "OpenFreeMap"
            use: "Diffusion des tuiles vectorielles du fond de carte."
            licence: "Service ouvert, fondé sur les données OpenStreetMap (ODbL)."
          - source: "PFAF (Plants For A Future)"
            use: "Certaines valeurs de la base de plantes (rusticité, usages…)."
            licence: "Licence non commerciale : les valeurs sont affichées avec PFAF cité comme source, sans reprise de ses textes ni de ses images."
          - source: "Base de plantes de Semisto"
            use: "Les fiches de plantes, enrichies par les contributrices et contributeurs."
            licence: "La provenance est indiquée champ par champ (sourcé, à vérifier, vide)."
        outro: "D'autres sources (météo, climat) pourront s'ajouter ; chacune sera citée ici avec sa licence."
      contribute:
        title: "Contribuer"
        body: "Une erreur, une idée, une couche de données à ajouter ? Ouvre une discussion sur GitHub ou écris-nous. Les contributions sont les bienvenues, des développeuses comme des jardinières."
        cta: "Ouvrir une discussion"
        url: "https://github.com/semisto-org/designer/issues"
    legal:
      updated_on: "20 octobre 2026"
      privacy:
        title: "Politique de confidentialité"
        lead: "Ce que Semisto Terranova collecte, pourquoi, qui l'héberge, combien de temps nous le gardons, et comment exercer vos droits."
        sections:
          - title: "Qui est responsable de vos données ?"
            paragraphs:
              - "Le responsable du traitement est Semisto ASBL, l'association qui édite le service Semisto Terranova (terranova.semisto.org, anciennement designer.semisto.org)."
              - "Siège : Fonds d'Ahinvaux 1, 5530 Yvoir, Belgique. Numéro d'entreprise (BCE) et de TVA : BE 0790.631.657."
              - "Pour toute question sur vos données ou pour exercer vos droits : %{email}, ou par courrier à l'adresse du siège."
              - "Semisto n'a pas désigné de délégué à la protection des données : la loi ne l'y oblige pas, parce que l'association n'est pas une autorité publique et que son activité principale ne consiste ni à suivre des personnes à grande échelle ni à traiter des données sensibles. Les demandes sont traitées par l'équipe de Semisto à l'adresse ci-dessus."
              - "Quand un professionnel ou une équipe utilise Terranova pour recueillir les données de ses propres clients (formulaire de demande de projet, fiche projet partagée, réponses à ses formulaires), c'est lui qui est responsable de ces données et Semisto agit pour son compte (voir « Les données que des professionnels recueillent avec Terranova »)."
          - title: "Quelles données collectons-nous ?"
            items:
              - "Votre compte : votre adresse e-mail, votre nom, et votre photo de profil si vous vous connectez avec Google ou en choisissez une. Si vous vous connectez avec Apple, nous recevons votre nom (une seule fois) et votre adresse e-mail, ou l'adresse relais qu'Apple crée pour vous si vous choisissez de masquer la vôtre. Si vous choisissez un mot de passe, nous n'en gardons qu'une empreinte chiffrée."
              - "Votre profil : si vous concevez pour d'autres, le type de compte (particulier ou professionnel), votre numéro d'entreprise ou de TVA et votre logo, pour des factures et des documents corrects."
              - "Vos contenus : les cartes, contours, parcelles, dessins, plantations, notes, fiches projet, tâches, journaux de récolte, commentaires, documents, photos et vidéos que vous créez ou ajoutez. Une photo garde la position et la date où elle a été prise, qui servent à la placer sur la carte ; le fichier d'origine, avec toutes ses métadonnées, n'est montré qu'aux éditeurs de la carte, les autres personnes n'en voient que des versions sans métadonnées."
              - "Les personnes que vous invitez : l'adresse e-mail des personnes à qui vous partagez une carte, que vous invitez dans une équipe ou à qui vous confiez une tâche."
              - "Vos paiements : la formule achetée, le montant, la TVA, la date, le code promotionnel éventuel et l'adresse de facturation. Le paiement lui-même est traité par Stripe : nous ne voyons ni ne conservons votre numéro de carte. Si vous demandez à payer sur facture, nous recevons aussi le nom et l'adresse de l'organisation, son numéro d'entreprise, l'adresse e-mail de facturation et le numéro de bon de commande."
              - "Vos demandes : ce que vous nous écrivez (assistance, suppression de compte, commande de plants, mission drone, demande de réalisation ou de cogestion) et nos réponses."
              - "Vos retours : le message que vous envoyez avec « Un retour ? », la page et, le cas échéant, la carte où vous étiez, et, si vous le cochez, votre accord pour que nous vous appelions."
              - "Pendant la bêta, et seulement si vous l'acceptez : l'enregistrement de vos premières séances par Sentry (les écrans, les clics et la carte affichée), lié au seul numéro de votre compte, jamais à votre nom ni à votre adresse e-mail. Ce que vous tapez, vos textes, vos photos et vidéos, et les noms et adresses des autres personnes restent masqués. La question vous est posée une fois, et vous pouvez changer d'avis dans « Mon compte »."
              - "Des données techniques : l'adresse IP et le navigateur utilisés pour chaque connexion à votre compte, et les journaux du serveur, utiles à la sécurité et au dépannage."
              - "Un essai « Et chez toi ? », sans compte : l'adresse que vous tapez, les parcelles choisies et ce que Terranova lit du terrain (pente, orientation). Si vous créez ensuite un compte, l'essai devient votre première carte ; sinon il est effacé après 48 heures."
              - "Si vous créez un compte après avoir regardé une carte publiée, nous notons de quelle carte vous venez. Son auteur n'en voit qu'un nombre (« 2 ont commencé le leur »), jamais votre nom ; il voit de même le nombre de visites de sa carte, sans rien qui identifie les visiteurs."
              - "Dans l'application mobile, si vous l'autorisez : la position de votre téléphone, pour vous situer sur le plan, placer une photo ou enregistrer une trace le long d'une haie ou d'une limite (y compris écran éteint, pendant l'enregistrement d'une trace que vous avez lancé), et l'appareil photo et le micro, pour les photos et vidéos que vous prenez."
            outro: "Terranova n'a pas besoin de données sensibles (santé, opinions, origine…) : n'en mettez pas dans vos cartes, vos notes ou vos commentaires. Nous ne faisons aucun profilage publicitaire et nous ne vendons aucune donnée."
          - title: "Ce que nous recevons de Google"
            paragraphs:
              - "Si vous choisissez « Continuer avec Google », Google nous transmet uniquement votre nom, votre adresse e-mail et votre photo de profil. Nous ne demandons accès à rien d'autre : ni vos e-mails, ni vos contacts, ni vos fichiers, ni votre agenda."
              - "Nous utilisons ces informations pour créer votre compte Semisto Terranova, vous reconnaître quand vous revenez, afficher votre nom et votre photo à vous et aux personnes avec qui vous partagez une carte, et vous écrire au sujet de votre compte (lien de connexion, factures, rappels)."
              - "Nous ne vendons pas ces informations, ne les utilisons pas pour de la publicité, ne les transmettons à aucun tiers en dehors des prestataires listés plus bas, et ne les utilisons pas pour entraîner des modèles d'intelligence artificielle."
              - "L'utilisation des informations reçues des API de Google respecte la politique relative aux données utilisateur des services d'API Google (Google API Services User Data Policy), y compris ses exigences d'utilisation limitée (Limited Use)."
              - "Vous pouvez retirer cet accès à tout moment depuis les paramètres de votre compte Google (myaccount.google.com/permissions) ; votre compte Semisto Terranova reste utilisable par lien de connexion envoyé par e-mail. Pour effacer aussi les informations déjà reçues, demandez la suppression de votre compte depuis « Mon compte » ou écrivez à %{email}."
          - title: "Ce que nous recevons d'Apple"
            paragraphs:
              - "Si vous choisissez « Continuer avec Apple », Apple nous transmet un identifiant propre à Semisto Terranova, votre adresse e-mail (ou une adresse relais qui vous transfère nos messages, si vous masquez la vôtre) et, à la première connexion seulement, votre nom. Nous ne recevons rien d'autre."
              - "Nous les utilisons comme celles reçues de Google : créer votre compte, vous reconnaître, afficher votre nom aux personnes avec qui vous partagez une carte, et vous écrire au sujet de votre compte. Nous ne les vendons pas, ne les utilisons pas pour de la publicité et ne les transmettons à aucun tiers en dehors des prestataires listés plus bas."
              - "Vous pouvez retirer cet accès à tout moment dans les réglages de votre identifiant Apple (« Se connecter avec Apple ») ; votre compte Semisto Terranova reste utilisable par lien de connexion envoyé par e-mail. Pour effacer aussi les informations déjà reçues, demandez la suppression de votre compte depuis « Mon compte » ou écrivez à %{email}."
          - title: "Pourquoi, et sur quelle base légale ?"
            items:
              - "Fournir le service que vous avez demandé (créer vos cartes, les partager, les publier, vous connecter, vous envoyer les e-mails du service, répondre à vos demandes) : l'exécution du contrat qui nous lie (article 6.1.b du RGPD)."
              - "L'essai « Et chez toi ? » sans compte : des mesures précontractuelles prises à votre demande (article 6.1.b). Si vous laissez votre adresse e-mail pour garder l'essai, un compte est créé à cette adresse et un lien de connexion vous est envoyé."
              - "Vérifier si vous êtes membre de Semisto en ordre de cotisation, pour vous appliquer automatiquement le prix membre de Home : notre intérêt légitime à appliquer ce prix sans vous demander de justificatif (article 6.1.f). Quand la page de facturation s'ouvre ou au paiement, votre adresse e-mail est envoyée à l'application de gestion interne de Semisto, qui répond seulement oui ou non et jusqu'à quelle date ; la réponse n'est gardée que dix minutes. Vous pouvez vous y opposer en nous écrivant : vous paierez alors le prix normal, ou nous vérifierons votre adhésion autrement."
              - "Facturer, émettre les factures légales (y compris par le réseau Peppol pour les entreprises belges) et tenir la comptabilité : nos obligations légales comptables et fiscales (article 6.1.c)."
              - "Vous prévenir de l'échéance de votre formule, de la fin d'un essai ou de la reconduction d'un abonnement : l'exécution du contrat et, le cas échéant, nos obligations légales envers les consommateurs."
              - "Sécuriser le service, détecter et corriger les erreurs (dont le suivi des erreurs par Sentry), prévenir et traiter les abus et les signalements de contenus illicites : notre intérêt légitime et nos obligations légales (article 6.1.c et f)."
              - "Lire vos retours et vous répondre : notre intérêt légitime à améliorer le service (article 6.1.f)."
              - "Enregistrer vos premières séances pendant la bêta, pour voir où le service fait hésiter : votre consentement (article 6.1.a), que vous pouvez retirer à tout moment dans « Mon compte »."
              - "Compter les visites du site de façon anonyme avec Plausible, et compter les visites et les inscriptions venues d'une carte publiée pour en montrer le nombre à son auteur : notre intérêt légitime à savoir quelles pages aident et à montrer à un auteur que sa carte inspire, sans identifier personne (article 6.1.f)."
              - "Montrer vos plantations à d'autres jardiniers (« Propriétaires du lieu ») et recevoir des demandes de multiplication : votre consentement, que vous pouvez retirer à tout moment en désactivant le partage (article 6.1.a)."
              - "Laisser Semisto regarder votre carte quand vous lui demandez des plants, une réalisation ou une cogestion : votre consentement, donné avec la demande (article 6.1.a)."
              - "Vous écrire au sujet des nouveautés de Terranova ou des activités de Semisto : nous ne le faisons pas aujourd'hui. Les nouveautés sont affichées dans l'application. Si nous lancions un jour une lettre d'information, nous vous demanderions d'abord votre accord, et chaque message permettrait de vous désinscrire."
            outro: "Terranova ne prend aucune décision fondée exclusivement sur un traitement automatisé qui produirait des effets juridiques à votre égard ou vous affecterait de manière significative (article 22 du RGPD)."
          - title: "Cartes partagées, équipes et cartes publiées"
            items:
              - "Une carte n'est visible que par vous et par les personnes que vous y invitez : éditeurs, lecteurs (qui peuvent commenter) et membres de l'équipe de la carte. Elles voient votre nom, votre photo de profil et vos contributions sur cette carte."
              - "Un lien de partage ouvre la carte à quiconque le reçoit, avec le rôle choisi ; vous pouvez le couper ou le renouveler à tout moment."
              - "Une carte publiée est visible sans compte par toute personne qui a son adresse. Elle montre ce que vous avez choisi ; l'adresse, les réseaux (eau, gaz, électricité, câbles), les notes et les noms des zones sont masqués par défaut. Son contour, posé sur un fond de carte, permet toutefois de reconnaître le lieu : publiez en connaissance de cause. Les moteurs de recherche sont priés de ne pas l'indexer, et vous pouvez la dépublier ou changer son adresse à tout moment."
              - "Si vous partagez vos plantations en tant que propriétaire du lieu, les autres jardiniers voient les espèces et variétés en terre, depuis quand, la région et une distance arrondie à 5 km ; jamais le nom de la carte, son adresse, sa position exacte ni ses participants. Les adresses e-mail ne sont échangées que si vous acceptez une demande de multiplication."
          - title: "Les données que des professionnels recueillent avec Terranova"
            paragraphs:
              - "Un professionnel ou une équipe peut utiliser Terranova pour son propre travail : un formulaire public de demande de projet, une fiche projet à faire remplir par ses clients, des réponses à ses propres formulaires (par exemple Tally) classées dans une carte, des offres de prix."
              - "Si vous remplissez un tel formulaire, c'est ce professionnel ou cette équipe qui est responsable de vos données : adressez-vous d'abord à lui pour exercer vos droits. Semisto les héberge pour son compte, selon ses instructions, sans les utiliser pour elle-même, et vous aidera s'il ne vous répond pas."
          - title: "Terranova et l'intelligence artificielle"
            items:
              - "Aucune intelligence artificielle ne lit vos cartes du côté de Semisto. Si vous connectez votre propre assistant IA (Claude, ChatGPT, Le Chat ou un autre) à vos cartes par le protocole MCP, c'est vous qui le choisissez, qui décidez de ce qu'il peut lire ou proposer, et qui pouvez révoquer son accès à tout moment depuis « Mon compte ». Ce que votre assistant fait des données qu'il lit relève de votre contrat avec son fournisseur. Les réseaux sensibles ne lui sont pas montrés."
              - "Les propositions d'une IA restent des brouillons : rien ne change sur votre carte avant qu'une personne les accepte."
              - "« Mettre en image » : quand vous le demandez, la photo de votre terrain, avec l'esquisse que vous y avez dessinée et vos consignes, est transmise à Magnific (Freepik Company, Espagne), qui la fait peindre par le modèle Gemini de Google. Magnific la télécharge par un lien signé valable une heure. Nous ne lui transmettons ni votre nom ni votre adresse e-mail. Évitez d'utiliser des photos où l'on reconnaît des personnes."
              - "Identifier une plante par photo : quand vous le demandez, les photos choisies (une à cinq) sont envoyées à Pl@ntNet, un service d'identification des plantes issu de la recherche publique française, qui répond par une liste d'espèces probables. Elles sont d'abord réduites dans votre navigateur, ce qui efface en principe leurs métadonnées, dont la position GPS. Terranova ne garde pas ces photos."
              - "La vérification du catalogue de plantes (Jev, de TypeSafe) ne porte que sur les fiches des espèces : aucune donnée personnelle ne lui est transmise."
          - title: "Qui reçoit vos données ?"
            paragraphs:
              - "Nous faisons appel à des prestataires (sous-traitants), qui ne traitent vos données que pour notre compte et selon nos instructions :"
            items:
              - "Infomaniak (Suisse) : stockage de vos photos, vidéos et documents (Public Cloud, à Genève) et de leurs copies de sauvegarde (Swiss Backup)."
              - "Infomaniak (Suisse) : le serveur qui fait tourner le service et sa base de données, un serveur privé virtuel réservé à Semisto et administré par elle."
              - "Cloudflare : réseau qui protège le site contre les attaques et achemine les échanges entre votre navigateur et notre serveur ; il voit passer votre adresse IP et les pages demandées."
              - "Amazon Web Services (Amazon Simple Email Service) : envoi des e-mails du service (liens de connexion, invitations, commentaires, factures, rappels)."
              - "Sentry : suivi des erreurs du serveur, du navigateur et de l'application mobile. Il reçoit la description technique d'une erreur (page, navigateur, message), configurée pour ne pas inclure votre nom ni votre adresse e-mail ; et, seulement si vous l'acceptez, l'enregistrement de vos premières séances, avec une copie des retours envoyés pendant une séance enregistrée."
              - "Stripe : paiement, facturation, calcul de la TVA et portail de gestion de l'abonnement. Pour la lutte contre la fraude et ses propres obligations légales, Stripe agit aussi comme responsable de traitement indépendant."
              - "Billit (Belgique) : uniquement pour les entreprises belges qui donnent leur numéro de TVA, émission de la facture légale et envoi par le réseau Peppol ou par e-mail (nom, adresse de facturation, numéro de TVA, e-mail, montants)."
              - "Magnific (Espagne), et Google pour le modèle d'image : uniquement si vous utilisez « Mettre en image »."
              - "Pl@ntNet (France) : uniquement si vous demandez l'identification d'une plante par photo."
              - "Les services de cartographie et de données publiques (par exemple le Service public de Wallonie, Urbis, Digitaal Vlaanderen, le SPF Finances, l'IGN, geoportail.lu, l'Agence européenne pour l'environnement, ISRIC, Copernicus, OpenFreeMap, OpenStreetMap, l'IRM, MET Norway, GBIF, Géorisques) : pour afficher les fonds de carte et les couches, et pour lire votre terrain (relief, sol, climat, cadastre, règles), ils reçoivent la zone affichée ou les coordonnées du terrain, et l'adresse IP de votre navigateur ou de notre serveur. Ils ne reçoivent ni votre nom ni votre adresse e-mail."
              - "La recherche d'adresse (Nominatim, d'OpenStreetMap, et Photon, de Komoot, en secours) : elle reçoit, depuis notre serveur, le texte que vous tapez pour trouver votre terrain."
            outro: "Reçoivent aussi vos données, en tant que responsables de leur propre traitement : Google ou Apple, si vous vous connectez par leur intermédiaire ; votre assistant IA, si vous le connectez ; les personnes avec qui vous partagez une carte. Au sein de Semisto, seules les personnes qui en ont besoin y ont accès : l'équipe peut se connecter à votre compte pour résoudre un problème que vous lui signalez ou un abus, pour une heure au plus, et chaque accès est journalisé. Pendant la phase de lancement, l'équipe reçoit aussi une copie des e-mails que le service vous envoie, jamais celle des liens et codes de connexion, pour vérifier qu'ils sont justes et utiles (notre intérêt légitime) ; ces copies suivent la durée de conservation de vos échanges avec nous. Nous ne communiquons des données aux autorités que si la loi nous y oblige."
          - title: "Vos données quittent-elles l'Union européenne ?"
            paragraphs:
              - "Le service, sa base de données, vos photos, vidéos et documents sont hébergés en Suisse, chez Infomaniak. La Commission européenne reconnaît à la Suisse un niveau de protection des données adéquat (décision d'adéquation)."
              - "Certains prestataires sont établis aux États-Unis ou peuvent y traiter des données : Sentry (dont les données sont hébergées aux États-Unis), Cloudflare, Stripe, Amazon Web Services, Google et Apple. Ces transferts reposent sur la décision d'adéquation de la Commission pour les entreprises certifiées au cadre de protection des données UE-États-Unis, ou à défaut sur les clauses contractuelles types de la Commission européenne. Vous pouvez nous demander une copie de ces garanties à %{email}."
          - title: "Combien de temps les conservons-nous ?"
            items:
              - "Votre compte, vos cartes et vos fichiers : tant que votre compte existe. Après votre demande de suppression, ils sont effacés du service dans le mois, et de nos copies de sauvegarde au plus tard 90 jours après leur effacement."
              - "Un élément supprimé d'une carte : 30 jours dans la corbeille de la carte, d'où vous pouvez le rétablir, puis il est effacé."
              - "Les pièces comptables (factures, paiements, demandes de paiement sur facture) : 10 ans à partir du 1er janvier qui suit la clôture de l'exercice, comme le droit belge l'exige, même après la suppression du compte."
              - "Les notifications de paiement reçues de Stripe : 90 jours."
              - "L'adresse IP et le navigateur d'une connexion : tant que cette connexion reste ouverte ; ils sont effacés quand vous vous déconnectez ou que votre compte est supprimé."
              - "Les journaux du serveur : 12 mois au plus. Les rapports d'erreur chez Sentry : 90 jours au plus."
              - "Les liens et codes de connexion : 20 minutes, et ils ne servent qu'une fois."
              - "Un essai « Et chez toi ? » qui n'est pas devenu une carte : 48 heures, puis il est effacé lors du nettoyage de la nuit suivante."
              - "Un fichier envoyé par votre assistant IA et jamais rattaché à une carte : 24 heures."
              - "Vos échanges avec nous (assistance, demandes) : le temps de les traiter, puis 3 ans au plus pour garder la trace de ce qui a été convenu, sauf s'ils font partie des pièces comptables."
              - "Vos retours : tant que votre compte existe."
              - "Les séances enregistrées : 90 jours au plus, chez Sentry. Pour les effacer plus tôt, écrivez-nous."
              - "Les statistiques de visite : elles ne contiennent aucune donnée personnelle."
          - title: "Cookies et stockage sur votre appareil"
            paragraphs:
              - "Terranova n'utilise ni cookies publicitaires, ni cookies de mesure d'audience, ni traceurs de tiers. Il ne dépose que des cookies nécessaires au fonctionnement du service que vous demandez, qui ne requièrent pas votre consentement :"
            items:
              - "Le cookie de session de l'application : il protège les formulaires contre la falsification de requêtes, garde votre essai « Et chez toi ? » en cours et, quand vous ouvrez une carte publiée, retient quelles cartes publiées vous avez déjà vues dans cette session de navigation, pour ne compter votre visite qu'une fois et relier une éventuelle inscription à la carte qui vous a amené. Il s'efface à la fermeture du navigateur."
              - "Le cookie de connexion (session_id) : il vous garde connecté. Il reste dans votre navigateur jusqu'à ce que vous vous déconnectiez."
              - "Le cookie des autres comptes (other_session_ids) : si vous vous connectez à plusieurs comptes dans le même navigateur, il permet de passer de l'un à l'autre. Il s'efface quand vous vous déconnectez de ces comptes."
            outro: "Ces cookies sont signés pour ne pas pouvoir être falsifiés, et ne sont lus que par Terranova. Votre navigateur garde aussi quelques préférences d'affichage (stockage local), qui ne quittent pas votre appareil. Nous comptons les visites avec Plausible, installé sur nos propres serveurs : il ne pose aucun cookie, ne garde ni votre adresse IP ni aucun identifiant, et ne donne que des chiffres d'ensemble (pages vues, pays, type d'appareil). Le suivi des erreurs (Sentry) ne pose pas de cookie non plus ; si vous acceptez l'enregistrement de vos premières séances, il garde le temps de la séance un identifiant dans le stockage de votre navigateur."
          - title: "L'application mobile"
            paragraphs:
              - "L'application mobile Semisto Terranova se connecte à votre compte par le même système de connexion que le site, et garde son jeton de connexion dans le coffre sécurisé de votre téléphone. Elle demande votre accord avant d'utiliser la position, l'appareil photo ou le micro ; vous pouvez retirer ces autorisations dans les réglages de votre téléphone. La position n'est enregistrée écran éteint que pendant une trace que vous avez lancée, et jusqu'à ce que vous l'arrêtiez."
              - "Elle envoie ses erreurs à Sentry, sans votre nom ni votre adresse e-mail, et télécharge ses mises à jour depuis les serveurs d'Expo, qui voient alors l'adresse IP du téléphone. Elle ne contient aucun outil publicitaire ni de mesure d'audience."
          - title: "Vos droits"
            paragraphs:
              - "Vous pouvez à tout moment demander l'accès à vos données, leur rectification, leur effacement, la limitation de leur traitement, leur portabilité, ou vous opposer à un traitement fondé sur notre intérêt légitime. Quand un traitement repose sur votre consentement, vous pouvez le retirer à tout moment, sans que cela remette en cause ce qui a été fait avant."
              - "Beaucoup se fait directement dans Terranova : corriger votre profil, exporter une carte (GeoJSON), télécharger vos photos et documents, couper un partage ou une publication, ne plus recevoir les e-mails de commentaires, révoquer l'accès d'un assistant IA, arrêter de montrer vos plantations."
              - "Pour supprimer votre compte, utilisez le bouton de votre page « Mon compte » ou écrivez à %{email}. Nous vous proposons d'abord d'exporter vos cartes ou de les confier à une autre personne, puis nous supprimons le compte. Nous répondons à toute demande dans un délai d'un mois, qui peut être prolongé de deux mois pour une demande complexe ; nous vous le dirions alors dans le premier mois. Nous pouvons vous demander de confirmer votre identité, par exemple en écrivant depuis l'adresse de votre compte."
              - "Si vous estimez que vos droits ne sont pas respectés, vous pouvez introduire une plainte auprès de l'Autorité de protection des données (Rue de la Presse 35, 1000 Bruxelles, autoriteprotectiondonnees.be) ou de l'autorité de votre pays de résidence (en France, la CNIL ; au Luxembourg, la CNPD)."
          - title: "Mineurs"
            paragraphs:
              - "Terranova s'adresse aux adultes. Une personne de moins de 16 ans ne peut l'utiliser qu'avec l'accord de ses parents, ou dans une équipe encadrée par son école ou une organisation de jeunesse. Les achats sont réservés aux personnes majeures. Si vous apprenez qu'un enfant nous a confié des données sans cet accord, écrivez-nous : nous les supprimerons."
          - title: "Sécurité"
            paragraphs:
              - "Les échanges sont chiffrés (HTTPS). La connexion se fait par lien ou code envoyé par e-mail (valable 20 minutes, une seule fois), par Google, par Apple ou, si vous en choisissez un, par un mot de passe dont nous ne gardons qu'une empreinte chiffrée. Les fichiers ne sont jamais publics : Terranova vérifie votre rôle sur la carte avant chaque accès. Les copies de sauvegarde sont chiffrées en transit et gardées chez un autre prestataire que les fichiers d'origine. L'accès de l'équipe aux outils d'administration est limité et journalisé."
          - title: "En cas de violation de données"
            paragraphs:
              - "Si un incident de sécurité touche vos données, nous le notifions à l'Autorité de protection des données dans les 72 heures quand il présente un risque pour vos droits, et nous vous prévenons sans tarder si ce risque est élevé, en vous disant ce qui s'est passé, ce que nous avons fait et ce que vous pouvez faire."
          - title: "Modifications de cette politique"
            paragraphs:
              - "Si cette politique change de façon importante, nous vous en informons par e-mail ou dans l'application avant que le changement ne s'applique. La date de la dernière mise à jour figure en haut de cette page."
      terms:
        title: "Conditions d'utilisation"
        lead: "Les règles du jeu pour utiliser Semisto Terranova : compte, formules, paiement, rétractation, contenus et responsabilités."
        sections:
          - title: "Qui sommes-nous ?"
            paragraphs:
              - "Semisto Terranova est un service en ligne de cartographie et de conception de jardins-forêts, accessible à l'adresse terranova.semisto.org, édité par Semisto ASBL, association sans but lucratif de droit belge."
              - "Siège : Fonds d'Ahinvaux 1, 5530 Yvoir, Belgique. Numéro d'entreprise (BCE) et de TVA : BE 0790.631.657. Contact : %{email}."
          - title: "Objet et acceptation de ces conditions"
            paragraphs:
              - "Ces conditions forment le contrat entre vous et Semisto pour l'utilisation de Terranova, gratuite ou payante. Vous les acceptez en créant un compte, et à nouveau lors de chaque achat. Elles sont complétées par notre politique de confidentialité et, pour un achat, par le récapitulatif de la commande. Vous pouvez les enregistrer ou les imprimer depuis cette page ; la version en vigueur au moment de votre achat vous reste applicable pour la période payée, sous réserve de la section « Évolution du service et de ces conditions »."
              - "Le contrat est conclu en français. Le mot « consommateur » désigne une personne qui agit à des fins qui n'entrent pas dans le cadre de son activité professionnelle ; certaines règles ci-dessous ne s'appliquent qu'à elle."
          - title: "Le service"
            paragraphs:
              - "Terranova vous permet de cartographier un terrain réel à partir de données publiques, d'y dessiner l'existant et votre projet, de choisir des plantes, de suivre les plantations, de travailler à plusieurs et de connecter votre propre assistant IA. Le détail des fonctions de chaque formule est décrit sur la page des tarifs."
              - "Le service fonctionne dans un navigateur récent et dans l'application mobile, avec une connexion à Internet. Certaines fonctions dépendent de services tiers (couches de données, identification de plantes, génération d'images) et peuvent être indisponibles quand ils le sont."
          - title: "Votre compte"
            paragraphs:
              - "Vous vous connectez avec votre adresse e-mail (lien ou code), avec Google, avec Apple, ou avec un mot de passe si vous en choisissez un. Vous êtes responsable de l'accès à votre adresse e-mail et à vos moyens de connexion, et des actions faites avec votre compte. Prévenez-nous sans tarder si vous pensez que quelqu'un d'autre y accède."
              - "Les informations que vous donnez doivent être exactes. Il faut avoir au moins 16 ans, ou l'accord de ses parents, ou être encadré par son école ou une organisation de jeunesse ; les achats sont réservés aux personnes majeures."
          - title: "Les formules et les prix"
            items:
              - "La formule gratuite comprend une carte active et 1 Go de stockage, avec les fonctions décrites sur la page des tarifs. Elle n'a pas de durée limitée."
              - "La formule Home coûte %{yearly} TTC. Elle se paie en une fois, vaut un an à partir du paiement et ne se renouvelle pas automatiquement. Un renouvellement fait avant l'échéance s'ajoute à la période en cours."
              - "Pro (%{atelier} TTC par mois, 6 cartes actives) et Team (%{bureau} TTC par mois, 30 cartes actives) sont des abonnements, mensuels ou annuels (%{atelier_yearly} et %{bureau_yearly} TTC par an), reconduits à chaque période jusqu'à résiliation. La formule Team est payée par un administrateur d'une équipe et couvre les cartes de cette équipe."
              - "Un abonnement Pro ou Team annuel souscrit au plus tard le 31 décembre 2026 bénéficie d'un mois offert sur sa première année (%{atelier_launch} et %{bureau_launch} TTC la première année). Les années suivantes sont au prix annuel en vigueur."
              - "La mission drone (%{drone} TTC) est une prestation unique, réalisée par Semisto après un échange avec vous (voir « La mission drone »)."
              - "Tous les prix sont en euros, toutes taxes comprises (TVA belge de 21 %). Un professionnel établi dans un autre pays de l'Union européenne qui donne un numéro de TVA valide est facturé sans TVA belge, selon le régime de l'autoliquidation. Il n'y a pas de frais de livraison ni d'autres frais."
            outro: "Les membres de Semisto dont la cotisation est en ordre paient la formule Home %{member} TTC au lieu de %{yearly}. La réduction est reconnue automatiquement à partir de l'adresse e-mail de votre compte, en la demandant au fichier des membres de Semisto ; si votre adhésion utilise une autre adresse, écrivez-nous."
          - title: "Commander et payer"
            paragraphs:
              - "Pour acheter, vous choisissez une formule depuis la page des tarifs ou « Formule et facturation », vérifiez le récapitulatif (formule, durée, prix TTC, réduction éventuelle), puis payez sur la page sécurisée de Stripe. Le contrat est conclu à la confirmation du paiement. Vous recevez par e-mail une confirmation et un reçu ; une entreprise belge assujettie à la TVA reçoit en outre sa facture légale par le réseau Peppol ou par e-mail."
              - "Une commune, une école, une association ou une entreprise peut aussi demander à payer sur facture, par virement, pour une formule d'un an. La facture est payable dans les 30 jours ; la formule peut commencer avant le paiement et ne se reconduit pas d'elle-même."
              - "Si le paiement d'un abonnement échoue, l'accès est maintenu pendant 7 jours, le temps de mettre à jour votre moyen de paiement, puis revient à la formule gratuite. Rien n'est supprimé."
          - title: "Durée, reconduction et résiliation"
            items:
              - "Un abonnement mensuel se reconduit chaque mois, un abonnement annuel chaque année, au prix en vigueur, jusqu'à ce que vous le résiliiez."
              - "Vous pouvez résilier à tout moment, en quelques clics, depuis « Formule et facturation », ou en nous écrivant. La résiliation prend effet à la fin de la période payée, sans frais ; l'accès continue jusque-là."
              - "Pour un abonnement annuel, nous vous rappelons par e-mail la date de reconduction, son prix et la façon de résilier, au plus tôt trois mois et au plus tard un mois avant la reconduction. Si nous ne l'avons pas fait, et de toute façon dès qu'un abonnement annuel a été reconduit, vous pouvez le résilier à tout moment, sans frais, et nous vous remboursons la part de la période qui n'est pas encore écoulée."
              - "Si nous changeons le prix d'un abonnement, nous vous prévenons par e-mail au moins 30 jours avant la reconduction à laquelle il s'applique ; vous pouvez résilier avant. Un changement de prix ne touche jamais une période déjà payée."
              - "Home et les formules payées sur facture durent un an et s'arrêtent d'elles-mêmes ; nous vous écrivons 30 jours et 7 jours avant l'échéance, et le jour même."
          - title: "À l'échéance, rien n'est supprimé"
            paragraphs:
              - "Quand une formule prend fin, vos cartes restent lisibles, exportables et commentables, et les plus anciennes restent modifiables dans la limite de la formule gratuite. Les cartes qui dépassent la formule gratuite passent en lecture seule jusqu'au renouvellement."
          - title: "Droit de rétractation"
            paragraphs:
              - "Si vous êtes un consommateur, vous disposez de 14 jours pour vous rétracter d'un achat fait en ligne, sans avoir à donner de motif. Le délai court à partir du jour de la conclusion du contrat, c'est-à-dire du paiement."
              - "Formules Home, Pro et Team : le droit vaut pour l'achat de la formule et pour la première souscription d'un abonnement, pas pour ses reconductions. Même si vous avez commencé à utiliser la formule pendant ce délai, nous vous remboursons l'intégralité du prix payé."
              - "Mission drone : si vous vous rétractez avant le vol, nous vous remboursons l'intégralité du prix. Nous ne réalisons le vol pendant le délai de 14 jours que si vous nous le demandez expressément par écrit (un e-mail suffit) ; vous reconnaissez alors que vous perdez votre droit de rétractation une fois la mission entièrement exécutée, c'est-à-dire la vue livrée sur votre carte. Si vous vous rétractez après le début de l'exécution que vous avez demandée, vous ne payez que la part du prix qui correspond au service déjà fourni."
              - "Pour vous rétracter, envoyez-nous avant la fin du délai une déclaration claire, par e-mail à %{email} ou par courrier à Semisto ASBL, Fonds d'Ahinvaux 1, 5530 Yvoir, Belgique. Vous pouvez utiliser le modèle de formulaire ci-dessous, sans obligation. Nous vous confirmons la réception par e-mail."
              - "Nous vous remboursons dans les 14 jours qui suivent la réception de votre rétractation, par le même moyen de paiement que celui utilisé pour l'achat, sauf accord contraire, et sans frais pour vous. La formule achetée prend fin au remboursement ; vos cartes passent à la formule gratuite et rien n'est supprimé."
              - "Le droit de rétractation ne s'applique pas aux professionnels, qui peuvent toutefois résilier un abonnement à tout moment pour la fin de la période en cours."
          - title: "Modèle de formulaire de rétractation"
            paragraphs:
              - "Veuillez compléter et renvoyer le présent formulaire uniquement si vous souhaitez vous rétracter du contrat."
            items:
              - "À l'attention de Semisto ASBL, Fonds d'Ahinvaux 1, 5530 Yvoir, Belgique, %{email} :"
              - "Je vous notifie par la présente ma rétractation du contrat portant sur la prestation de service suivante : …"
              - "Commandé le : …"
              - "Nom du consommateur : …"
              - "Adresse du consommateur : …"
              - "Adresse e-mail du compte Terranova : …"
              - "Signature du consommateur (uniquement si ce formulaire est envoyé sur papier) : …"
              - "Date : …"
          - title: "La mission drone"
            paragraphs:
              - "Après votre commande, Semisto vous contacte pour organiser la prise de vue : l'accès au terrain, la période, la météo. Semisto vérifie d'abord que le survol est autorisé et possible ; s'il ne l'est pas, ou si aucune date n'a pu être convenue dans les six mois de la commande pour une raison qui ne vous est pas imputable, nous vous remboursons intégralement. Semisto réalise le vol dans le respect des règles applicables aux drones et livre la vue aérienne, datée, sur la carte que vous avez choisie."
              - "Vous nous confirmez avoir le droit de faire survoler et photographier le terrain, ou l'accord de son propriétaire. La vue est faite pour votre carte : vous pouvez l'utiliser librement pour votre projet. Si elle montre des voisins ou des passants, ne la diffusez pas sans les flouter ou obtenir leur accord."
          - title: "Conformité et garanties légales"
            paragraphs:
              - "Semisto fournit un service conforme à ce qui est décrit dans ces conditions et sur la page des tarifs, pendant toute la durée de votre formule. Si vous êtes un consommateur, vous bénéficiez de la garantie légale de conformité des contenus et services numériques prévue par la directive (UE) 2019/770 et par le droit de votre pays qui la transpose : en cas de défaut de conformité, vous pouvez obtenir la mise en conformité dans un délai raisonnable et sans frais ou, à défaut, une réduction de prix ou la résolution du contrat avec remboursement. Pendant la durée de la fourniture, c'est à nous de prouver que le service était conforme."
              - "Pour la mission drone, la garantie légale relative aux services s'applique. Ces garanties légales s'ajoutent à tout engagement de ces conditions, qui ne peut jamais les réduire."
          - title: "Évolution du service et de ces conditions"
            paragraphs:
              - "Terranova est un logiciel vivant : nous l'améliorons souvent, corrigeons les erreurs et pouvons faire évoluer ses fonctions, notamment pour suivre la loi, la sécurité, les services de données dont il dépend ou nos moyens. Ces changements ne vous coûtent rien de plus pendant la période payée."
              - "Si un changement réduit de façon plus que mineure votre accès à une fonction payante ou son utilité, nous vous prévenons par e-mail au moins 30 jours à l'avance ; vous pouvez alors résilier sans frais dans les 30 jours qui suivent le changement, et nous vous remboursons la part non utilisée de la période payée."
              - "Nous pouvons modifier ces conditions pour l'avenir. Nous vous prévenons par e-mail au moins 30 jours avant qu'un changement important ne s'applique. Si vous le refusez, vous pouvez résilier sans frais avant son entrée en vigueur et être remboursé de la part non utilisée de la période payée ; sinon, les nouvelles conditions s'appliquent à la reconduction suivante."
          - title: "Vos contenus"
            paragraphs:
              - "Vos cartes, dessins, notes, photos et documents restent à vous. Vous accordez seulement à Semisto, pour le monde entier, gratuitement et tant qu'ils sont hébergés, le droit non exclusif de les stocker, de les copier techniquement (sauvegardes, miniatures, documents PDF) et de les afficher pour faire fonctionner le service : à vous, aux personnes avec qui vous les partagez et, si vous publiez une carte, à toute personne qui en a l'adresse. Nous n'utilisons pas vos contenus pour entraîner des modèles d'intelligence artificielle, et nous ne les utilisons pas pour notre communication sans votre accord."
              - "Vous êtes responsable de ce que vous ajoutez et partagez, et vous garantissez en avoir le droit : droit d'auteur sur les photos et documents, accord des personnes reconnaissables sur une photo, respect de la vie privée des voisins."
          - title: "Cartes partagées, équipes et cartes publiées"
            paragraphs:
              - "Le propriétaire d'une carte choisit qui y accède. Les éditeurs modifient la carte ; les lecteurs la voient et la commentent ; les membres d'une équipe éditent les cartes de l'équipe. Seul le propriétaire fait entrer une carte dans une équipe ou l'en sort, la transfère, la publie ou change son partage. Quitter une équipe ne retire pas ses cartes de l'équipe."
              - "Une carte publiée est visible sans compte par quiconque a son adresse, telle qu'elle était au moment de la publication. Vous pouvez la dépublier ou changer son adresse à tout moment. Avant de publier, vérifiez que vous avez l'accord des autres personnes concernées par le lieu."
          - title: "Les données que vous traitez pour vos clients"
            paragraphs:
              - "Si vous utilisez Terranova dans le cadre d'une activité professionnelle ou associative pour traiter des données personnelles de tiers (formulaire public de demande de projet, fiche projet remplie par un client, réponses à vos formulaires, offres, cartes de vos clients), vous êtes responsable de ces traitements et Semisto agit comme votre sous-traitant au sens de l'article 28 du RGPD. Cette section constitue notre contrat de sous-traitance."
            items:
              - "Objet et durée : l'hébergement et le traitement de ces données pour vous fournir Terranova, pendant la durée de votre utilisation du service. Données concernées : identité, coordonnées, adresse et parcelles du lieu, réponses et documents de vos prospects, clients et partenaires."
              - "Semisto ne traite ces données que selon vos instructions, qui sont ces conditions et l'usage que vous faites des fonctions de Terranova, et vous informe si une instruction lui paraît contraire à la loi. Elle ne les utilise jamais à ses propres fins."
              - "Les personnes de Semisto qui y ont accès sont tenues à la confidentialité. Semisto applique les mesures de sécurité décrites dans sa politique de confidentialité."
              - "Vous autorisez Semisto à faire appel aux sous-traitants listés dans sa politique de confidentialité. Elle vous informe par e-mail ou dans l'application de tout ajout ou remplacement ; vous pouvez vous y opposer en résiliant sans frais, avec remboursement de la part non utilisée de la période payée."
              - "Semisto vous aide, dans la mesure du possible, à répondre aux demandes d'exercice des droits des personnes et à respecter vos obligations de sécurité, de notification des violations et d'analyse d'impact. Elle vous notifie toute violation de ces données sans retard injustifié après en avoir pris connaissance."
              - "À la fin du service, vous pouvez exporter vos données ; Semisto les supprime ensuite, sauf obligation légale de conservation, et ses copies de sauvegarde s'effacent dans les 90 jours."
              - "Semisto met à votre disposition les informations nécessaires pour démontrer le respect de ces obligations et se prête, sur demande raisonnable, à un audit, à vos frais."
            outro: "Vous vous engagez à informer les personnes concernées, à disposer d'une base légale pour leurs données et à ne pas demander par vos formulaires des données sensibles."
          - title: "Utilisation acceptable"
            items:
              - "Pas de contenu illicite : atteinte aux droits d'autrui (droit d'auteur, vie privée, image), contenu haineux, diffamatoire, violent ou à caractère sexuel impliquant des mineurs."
              - "Pas d'usage du service pour envoyer des messages non sollicités, collecter des données sur des personnes à leur insu, ou publier les données personnelles de quelqu'un sans son accord."
              - "Pas d'atteinte au fonctionnement du service : contournement des limites ou des contrôles d'accès, extraction massive automatisée, surcharge volontaire, diffusion de logiciels malveillants. Les accès automatisés passent par le serveur MCP ou l'API prévus pour cela, dans leurs limites."
              - "Pas d'usage contraire à la loi, notamment aux règles d'urbanisme, de protection de la nature ou de survol par drone."
          - title: "Signaler un contenu illicite"
            paragraphs:
              - "Si vous pensez qu'un contenu hébergé par Terranova, par exemple une carte publiée, est illicite, signalez-le par e-mail à %{email}. Indiquez : l'adresse exacte (URL) du contenu ; pourquoi vous estimez qu'il est illicite ; votre nom et votre adresse e-mail, sauf s'il s'agit d'un contenu pédopornographique ; et une déclaration confirmant que vous pensez de bonne foi que les informations de votre signalement sont exactes et complètes."
              - "Nous accusons réception de votre signalement, l'examinons avec soin, de façon objective et sans délai excessif, et vous informons de notre décision et des recours possibles. Ces décisions sont prises par des personnes, sans outil de décision automatisé."
              - "Cette adresse est aussi notre point de contact unique pour les utilisateurs et pour les autorités des États membres, de la Commission européenne et du Comité européen des services numériques (règlement (UE) 2022/2065, articles 11 et 12). Vous pouvez nous y écrire en français ou en anglais."
              - "Si nous avons connaissance d'informations qui laissent soupçonner une infraction pénale menaçant la vie ou la sécurité de personnes, nous en informons les autorités compétentes."
          - title: "Modération et restrictions"
            paragraphs:
              - "Si un contenu est illicite ou contraire à ces conditions, nous pouvons le rendre inaccessible ou le retirer, dépublier une carte, limiter certaines fonctions ou suspendre un compte, en proportion de la gravité et en tenant compte des droits et intérêts légitimes de chacun, notamment la liberté d'expression. Nous ne surveillons pas les contenus de façon générale : nous agissons sur signalement ou quand nous constatons un problème."
              - "Sauf urgence ou obligation légale contraire, nous vous informons de toute restriction, au plus tard quand elle s'applique, avec ses motifs : les faits, la règle concernée, si la décision fait suite à un signalement, et vos possibilités de recours. Vous pouvez la contester en répondant à notre message ; une autre personne de Semisto réexamine la décision. Vous pouvez aussi saisir un organe de règlement extrajudiciaire des litiges certifié au titre du règlement sur les services numériques, ou les tribunaux."
              - "Nous pouvons suspendre, après avertissement, le compte d'une personne qui publie fréquemment des contenus manifestement illicites, ou l'examen des signalements d'une personne qui en envoie fréquemment de manifestement infondés."
          - title: "Données publiques et aides à la décision"
            paragraphs:
              - "Les couches de données viennent de sources publiques, affichées en l'état, avec leur date et leur source quand elles sont connues ; elles peuvent être incomplètes ou dépassées. Les analyses, suggestions et brouillons de l'IA sont des aides à la réflexion : vérifiez-les sur le terrain et auprès des autorités compétentes (urbanisme, cadastre, zones protégées, règles sur les mares et les haies) avant de vous engager dans des travaux. Terranova ne remplace pas un géomètre, un permis ou un conseil professionnel."
          - title: "Votre assistant IA et les fonctions d'IA"
            paragraphs:
              - "Si vous connectez un assistant IA à vos cartes via MCP, vous choisissez l'assistant et ce qu'il peut lire ou proposer. Ses propositions restent des brouillons jusqu'à ce qu'une personne les accepte. Ce qu'il fait des données qu'il lit relève des conditions de son fournisseur. Vous pouvez révoquer l'accès à tout moment depuis « Mon compte »."
              - "Les images de « Mettre en image » sont produites par un modèle d'intelligence artificielle, dans la limite mensuelle de votre formule : ce sont des évocations, pas des plans ni des promesses de résultat. N'y envoyez que des photos que vous avez le droit d'utiliser. L'identification de plantes par photo propose des espèces probables, que vous choisissez ou non."
          - title: "Disponibilité et responsabilité"
            paragraphs:
              - "Nous faisons de notre mieux pour que le service fonctionne bien et soit disponible, et pour prévenir à l'avance des interruptions prévues. Nous ne pouvons pas garantir qu'il ne sera jamais interrompu, notamment lors des maintenances, d'une panne d'un prestataire ou d'un cas de force majeure."
              - "Si vous êtes un consommateur, Semisto répond des dommages causés par un manquement à ses obligations, conformément à la loi. Rien dans ces conditions ne limite notre responsabilité en cas de décès ou de dommage corporel, de faute intentionnelle ou de faute grave, ni en cas d'inexécution de nos obligations essentielles, ni les droits que la loi vous reconnaît."
              - "Si vous êtes un professionnel, et sauf faute intentionnelle, faute grave, décès ou dommage corporel, la responsabilité de Semisto est limitée aux dommages directs et prévisibles, et au montant que vous avez payé pour le service au cours des douze mois qui précèdent le fait dommageable."
              - "Vous répondez des contenus que vous ajoutez et de l'usage que vous faites du service ; vous ne répondez envers Semisto des réclamations de tiers que dans la mesure où elles résultent de votre faute."
          - title: "Suspension et fin du compte"
            paragraphs:
              - "Vous pouvez arrêter d'utiliser Terranova et demander la suppression de votre compte à tout moment, depuis « Mon compte » ou par e-mail. Avant la suppression, vous pouvez exporter vos cartes (GeoJSON), télécharger vos photos et documents, ou confier vos cartes à une autre personne. Un abonnement en cours doit être résilié ; la suppression n'ouvre pas droit au remboursement d'une période commencée, sauf dans les cas prévus par ces conditions."
              - "Nous pouvons suspendre ou fermer un compte en cas de manquement grave ou répété à ces conditions, d'abus ou d'obligation légale, après vous avoir prévenu et permis de vous expliquer, sauf urgence. Sauf contenu illicite ou décision de justice, vous gardez la possibilité d'exporter vos données pendant au moins 30 jours. Si nous fermons un compte payant sans faute de votre part, nous remboursons la part non utilisée de la période payée."
              - "Si Semisto devait arrêter le service, elle vous préviendrait au moins trois mois à l'avance, vous laisserait exporter vos données et rembourserait la part non utilisée des périodes payées. Le code de Terranova étant libre, une autre organisation pourrait aussi l'héberger."
          - title: "Open source"
            paragraphs:
              - "Le code de Semisto Terranova est publié sous licence AGPL-3.0. Ces conditions régissent l'utilisation du service hébergé par Semisto, pas votre droit d'utiliser, d'étudier, de modifier ou de redistribuer le code, régi par cette licence. Les marques « Semisto » et « Semisto Terranova » appartiennent à Semisto."
          - title: "Droit applicable, litiges et médiation"
            paragraphs:
              - "Ces conditions sont régies par le droit belge. Si vous êtes un consommateur résidant dans un autre pays, ce choix ne vous prive pas de la protection des règles impératives de la loi de votre pays de résidence."
              - "En cas de difficulté, écrivez-nous d'abord à %{email} : nous cherchons une solution avec vous. Vous pouvez aussi vous adresser gratuitement au Service de médiation pour le consommateur (mediationconsommateur.be) et, si vous résidez dans un autre pays de l'Union européenne, au Centre européen des consommateurs de votre pays."
              - "Si vous êtes un consommateur, vous pouvez porter un litige devant les tribunaux belges ou devant ceux de votre domicile, et nous ne pouvons agir contre vous que devant ceux de votre domicile. Entre professionnels, les tribunaux de l'arrondissement judiciaire de Namur sont seuls compétents."
              - "Si une clause de ces conditions était déclarée nulle, les autres resteraient applicables."
