# Public website: home, features, pricing, drone mission, open source,
# privacy, terms. Long copy is kept as YAML lists and maps and read on the
# client with content('site.…'); prices come from the catalogue as %{vars}.
fr:
  site:
    seo:
      home:
        title: "Cartographie ton terrain, conçois ton jardin-forêt"
        description: "L'atelier en ligne de Semisto : cartographie ton terrain avec précision, comprends-le, puis conçois ton jardin-forêt pour le climat qui vient, avec Claude à tes côtés."
      features:
        title: "Fonctionnalités"
        description: "Fond de carte et couches du Géoportail, dessin de l'existant, palette de plantes, fiche projet, partage et commentaires, et Claude qui lit ta carte."
      pricing:
        title: "Tarifs"
        description: "Une carte gratuite, un forfait particulier à 79 € par an payé une seule fois, des formules pour les professionnels. 30 % de réduction pour les membres de Semisto."
      drone:
        title: "Mission drone"
        description: "Une vue aérienne datée de ton terrain, prise par Semisto et configurée sur ta carte. 280 € TTC, achat unique."
      open_source:
        title: "Open source"
        description: "Semisto Designer est un logiciel libre (AGPL-3.0). Le code, les sources de données et leurs licences, en toute transparence."
