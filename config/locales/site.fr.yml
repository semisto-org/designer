        description: "Les conditions d'utilisation de Semisto Terranova : compte, formules, paiement, contenus et responsabilités. Projet à valider."
      help:
        title: "Centre d'aide"
        description: "Des guides concrets pour créer sa première carte, lire les couches du Géoportail, dessiner l'existant, construire sa palette et connecter son IA."
