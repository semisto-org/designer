# Public website: home, features, pricing, drone mission, open source,
# privacy, terms. Long copy is kept as YAML lists and maps and read on the
# client with content('site.…'); prices come from the catalogue as %{vars}.
fr:
  site:
    seo:
      home:
        title: "Cartographie ton terrain, conçois ton jardin-forêt"
        description: "L'atelier en ligne de Semisto : cartographie ton terrain avec précision, comprends-le, puis conçois ton jardin-forêt pour le climat qui vient, avec ton IA à tes côtés."
      features:
        title: "Fonctionnalités"
        description: "Une visite d'un vrai carnet, étape par étape : retrouver son terrain, lire ses couches et son climat, dessiner l'existant, l'eau avant les plantes, la palette, trente ans de croissance, et ton IA qui lit ta carte."
      gallery:
        title: "Carnets ouverts"
        description: "Des jardins-forêts et des forêts comestibles conçus dans Terranova, publiés par leurs propriétaires et montrés avec leur accord, à tous les âges."
      pricing:
        title: "Tarifs"
        description: "Une carte gratuite, Home à 79 € par an payé une seule fois (59 € pour les membres de Semisto), Pro et Team pour les professionnels, au mois ou à l'année."
      drone:
        title: "Mission drone"
        description: "Une vue aérienne datée de ton terrain, prise par Semisto et configurée sur ta carte. 380 € TTC, achat unique."
      open_source:
        title: "Open source"
        description: "Semisto Terranova est un logiciel libre (AGPL-3.0). Le code, les sources de données et leurs licences, en toute transparence."
      privacy:
        title: "Politique de confidentialité"
        description: "Quelles données Semisto Terranova collecte, pourquoi, qui les héberge et comment exercer vos droits. Projet à valider."
      terms:
        title: "Conditions d'utilisation"
        description: "Les conditions d'utilisation de Semisto Terranova : compte, formules, paiement, contenus et responsabilités. Projet à valider."
      help:
        title: "Centre d'aide"
        description: "Des guides concrets pour créer sa première carte, lire les couches du Géoportail, dessiner l'existant, construire sa palette et connecter son IA."
    common:
      start_free: "Créer ma carte gratuite"
      see_pricing: "Voir les tarifs"
      see_features: "Découvrir les fonctionnalités"
      open_maps: "Ouvrir mes cartes"
      with_plan: "Avec le forfait"
      included: "Inclus"
      not_included: "Non inclus"
      contact: "Écrire à Semisto"
      draft_banner: "Projet — à valider"
      draft_note: "Ce texte est un projet de travail. Il sera relu par un juriste avant l'ouverture des paiements et peut encore changer."
      updated: "Dernière mise à jour : %{date}"
    nav:
      menu: "Menu principal"
    footer:
      tagline: "Un outil libre pour cartographier son terrain et concevoir son jardin-forêt."
      product: "Le produit"
      about: "À propos"
      drone: "Mission drone"
      gallery: "Carnets ouverts"
      rights: "© Semisto"
    home:
      story:
        cta: "Ouvrir mon carnet"
        months: ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"]
        stamp:
          bare: "terrain nu"
          observe: "on observe"
          planting: "jour de plantation"
          growing: "an %{year} du jardin-forêt"
        canvas:
          wind: "vent d'ouest"
          water: "l'eau s'arrête ici"
          slope: "pente douce vers le sud"
          walnut: "noyer · 18 m à 30 ans"
          hedge: "haie champêtre"
          shade: "l'ombre atteint le potager"
          yours: "ton terrain"
        # One entry per chapter of CHAPTERS in app/frontend/components/site/timelapse/model.ts.
        # The first one is the opening: its kicker is the scroll cue.
        chapters:
          - kicker: "fais défiler : trente ans vont passer"
            title: "Dessine aujourd'hui le jardin-forêt de 2056."
            body: "Terranova te montre ce que ton terrain va devenir, saison après saison, et t'apprend à le lire en chemin."
          - kicker: "janvier 2026"
            title: "Voici ton terrain."
            body: "Un quart d'hectare de prairie, une pente douce vers le sud, un creux qui reste humide en hiver. Une maison, un vieux chemin. Pour l'instant, c'est tout."
          - kicker: "avril 2026 · observer"
            title: "Avant de dessiner, on regarde."
            body: "Terranova lit les couches de ta région : la pente, le sol, l'eau qui ruisselle, le vent dominant. Ici, l'eau descend vers le creux. C'est là que la mare voudra être."
          - kicker: "novembre 2026 · planter"
            title: "Chaque cercle, c'est un arbre à trente ans."
            body: "Une haie champêtre tout autour, les grands arbres au nord, puis des fruitiers et des arbustes qui descendent en lisière jusqu'aux sentiers. Les pointillés montrent la place que chacun prendra adulte. C'est là que se jouent la plupart des erreurs."
          - kicker: "avril 2027 · an 1"
            title: "Le premier printemps."
            body: "Les plants font un mètre. Le sol entre eux est couvert de paille : c'est lui qui travaille cette année."
          - kicker: "août 2031 · an 5"
            title: "Les premières récoltes."
            body: "Pommes, cassis, framboises. La haie et les aulnes cassent déjà le vent d'ouest, et le sol ne se voit plus sous la consoude et les fraisiers. Le noyer, lui, prend son temps."
          - kicker: "octobre 2041 · an 15"
            title: "L'ombre a changé de place."
            body: "Les couronnes se touchent. En fin de journée, l'ombre du noyer atteint le potager. Avec Terranova, tu l'aurais vu venir dès le dessin."
          - kicker: "janvier 2056 · an 30"
            title: "En hiver, on voit la structure."
            body: "Les branches nues laissent passer la lumière basse. C'est la saison où l'on taille, où l'on observe, où l'on prépare la suite."
          - kicker: "juin 2056 · an 30"
            title: "Une forêt qui nourrit."
            body: "De grands arbres, des fruitiers, des arbustes, des plantes couvre-sol le long des sentiers, et des fruits de juin à novembre. Les oiseaux sont revenus."
            hint: "Clique sur le terrain pour y planter un arbre, et regarde-le pousser."
          - kicker: "et tout autour"
            title: "Ton jardin-forêt, et tous les autres."
            body: "Chaque carte dessinée dans Terranova est un jardin-forêt de plus en Europe. En route vers l'ère des forêts comestibles."
        where:
          title: "Où est ton terrain ?"
          label: "L'adresse de ton terrain"
          placeholder: "Rue, numéro, commune"
          hint: "Tape ton adresse : ton terrain apparaît tout de suite, avec ce que sa pente et son eau racontent. Sans compte."
          starting: "Je cherche ton terrain…"
        final_cta: "Ou crée ton compte d'abord"
        final_secondary: "Voir les forfaits"
        free: "ta première carte est gratuite, pour de bon"
        example: "Terrain d'exemple. Le tien, Terranova le dessine sur un vrai fond de carte."
      practical:
        kicker: "en pratique"
        title: "Ce qu'il faut savoir avant d'ouvrir ton carnet"
        data:
          kicker: "tes données"
          title: "Ton terrain, à sa vraie précision"
          body: "Là où ta région publie mieux, Terranova prend le meilleur. Ailleurs en Europe, le socle commun prend le relais."
          sources:
            - name: "Wallonie"
              detail: "Cadastre, plan de secteur, relief LiDAR et sols du Géoportail"
            - name: "France"
              detail: "Cadastre et relief RGE ALTI de l'IGN"
            - name: "Bruxelles"
              detail: "Photos aériennes UrbIS et cadastre fédéral"
            - name: "Flandre"
              detail: "Photos d'hiver et d'été, carte de Ferraris, relief LiDAR et sols"
            - name: "Luxembourg"
              detail: "Couches de geoportail.lu"
            - name: "Europe"
              detail: "Relief Copernicus, OpenStreetMap, climat qui vient"
          cta: "Toutes les fonctionnalités"
        pricing:
          kicker: "ce que ça coûte"
          title: "Gratuit pour commencer"
          body: "Pas d'abonnement pour les particuliers : le forfait se paie une fois par an, sans reconduction automatique."
          tiers:
            - name: "Carte gratuite"
              price: "0 €"
              note: "une carte, pour de bon"
            - name: "Home"
              price: "%{yearly}"
              note: "par an, payé une seule fois"
            - name: "Pour les pros"
              price: "dès %{atelier}"
              note: "par mois, ou deux mois offerts à l'année"
          cta: "Comparer les formules"
        open:
          kicker: "né sur un vrai terrain"
          body: "Terranova a été éprouvé sur un lieu réel avant d'être ouvert à tous. Son code est libre (AGPL-3.0) et chaque source de données est citée."
          cta: "Un outil libre et transparent"
    # The standout features, told on the home page and at the top of
    # « Fonctionnalités » (app/frontend/components/site/Standouts.tsx).
    # `image` is the file name in app/frontend/components/site/standouts/.
    standouts:
      kicker: "dans le carnet"
      title: "Ce que Terranova sait faire, et que tu ne trouveras nulle part ailleurs"
      intro: "Des outils pensés pour apprendre à lire ton terrain, pas pour remplir un formulaire. Les voici, tels qu'ils tournent aujourd'hui."
      plan: "avec le forfait"
      entries:
        - id: "eau"
          image: "rain"
          kicker: "une averse de novembre"
          title: "Fais pleuvoir sur ton terrain, avant de creuser."
          body: "Sur le relief en 3D de ton terrain, Terranova fait tomber une averse : tu vois où l'eau ruisselle, où le sol la boit et où elle s'arrête. Dessine une mare ou une baissière, creuse-la dans le relief simulé, relance la pluie : la même averse tombe sur le terrain actuel pour comparer."
          note: "l'eau s'arrête ici : la mare voudra être là"
          caption: "la pluie simulée, et ce qu'en retient une mare"
          alt: "Le relief d'un terrain en 3D sous une averse simulée : l'eau ruisselle dans le creux et remplit une mare dessinée sur la carte."
          link: "/help/lire-le-relief-et-l-eau"
          link_label: "Lire le relief et l'eau"
          plan: true
        - id: "ia"
          image: "ai-drafts"
          kicker: "ce soir, à deux"
          title: "Conçois avec ton IA, et garde la main."
          body: "Branche ton propre assistant (Claude, ChatGPT, Le Chat…) sur ta carte. Il lit la pente, le sol, l'eau et ta fiche projet, suit la méthode de Semisto, puis pose ses idées en brouillons : une haie, une mare, des plantes pour ta palette, chacune avec son pourquoi. Tu gardes ou tu refuses, une par une. Terranova, lui, n'envoie ta carte à aucune IA."
          note: "chaque brouillon dit pourquoi il est là"
          caption: "les brouillons de ton IA, à garder ou à refuser"
          alt: "Des brouillons proposés par une IA dans le panneau de la carte, chacun avec sa justification et deux boutons : garder ou refuser."
          link: "/help/connecter-son-ia"
          link_label: "Connecter ton IA"
          plan: true
          plan_note: "essai de 14 jours, puis avec le forfait"
        - id: "sol"
          image: "bioindicators"
          kicker: "au printemps, avant la fauche"
          title: "Une photo des herbes folles, et ton sol se raconte."
          body: "Photographie un coin de prairie avec toutes ses plantes sauvages. Ton IA reconnaît chaque espèce et ce qu'elle dit du sol : l'ortie parle d'azote, la renoncule rampante d'une terre qui reste humide en hiver. Tu gardes ce qui est juste ; ce que tu gardes compte pour lire ton sol."
          note: "l'ortie : un sol riche en azote"
          caption: "ce que ton IA a vu sur la photo"
          alt: "Les plantes reconnues sur une photo de prairie : ortie dioïque et gaillet gratteron, avec ce qu'elles disent du sol et les boutons garder ou refuser."
          link: "/help/analyser-son-sol"
          link_label: "Analyser ton sol"
          plan: true
        - id: "esquisse"
          image: "sketch"
          kicker: "aujourd'hui, et dans cinq ans"
          title: "Gribouille ton idée sur une photo, et vois-la pousser."
          body: "Sur une photo de ton terrain, trace au doigt ou au crayon le sentier, la mare, les arbres. « Mettre en image » en fait une photo, une aquarelle ou un croquis au crayon qui suit ton trait. Glisse le curseur entre l'avant et l'après pour montrer le projet à celles et ceux qui le vivront."
          note: "ton trait orange devient le sentier"
          caption: "aux 4 Sources : l'esquisse, puis l'aquarelle"
          alt: "Une photo de drone avec une esquisse à main levée (sentier orange, arbres et mare dessinés en blanc) et, à côté, la même scène rendue à l'aquarelle."
          link: "/help/esquisser-et-mettre-en-image"
          link_label: "Esquisser et mettre en image"
          plan: true
      margins:
        kicker: "et dans les marges"
        notes:
          - kicker: "avant de dessiner"
            title: "Ton terrain lu par six sources ouvertes"
            body: "La course du soleil au-dessus de tes collines, trente ans de climat observé sur ta parcelle, les stations météo proches, la hauteur des arbres déjà en place ; en France, ce que disent le PLU, les zones inondables et les argiles."
            link: "/help/le-soleil-et-l-horizon"
            link_label: "Le soleil et l'horizon"
          - kicker: "sur le terrain"
            title: "Une app dans ta poche, même sans réseau"
            body: "Télécharge ta carte avant de partir, puis relève un point au GPS, marche une haie pour la tracer, photographie un arbre là où il pousse. Tout part vers ta carte quand le réseau revient. Bientôt sur iPhone et Android."
          - kicker: "pour un projet confié"
            title: "La fiche projet remplie par celles et ceux qui le portent"
            body: "Tu conçois pour quelqu'un d'autre ? Envoie-lui un lien privé : il répond aux questions sans compte et sans voir la carte, et tout arrive dans ta fiche projet."
            link: "/help/remplir-la-fiche-projet"
            link_label: "Remplir la fiche projet"
    features:
      hero:
        kicker: "Fonctionnalités"
        title: "Visite un vrai carnet"
        lead: "Pas de liste d'outils : un lieu réel, « %{place} », dessiné dans Terranova. Fais défiler, chaque outil apparaît au moment où il sert, dans l'ordre où l'on conçoit un jardin-forêt."
        lead_plain: "Pas de liste d'outils : les quatre étapes de la conception d'un jardin-forêt, et chaque outil au moment où il sert."
        facts: "%{area} · %{place}"
        open: "Ouvrir ce carnet"
        scroll: "Fais défiler, le carnet se remplit"
      canvas:
        north: "N"
        area: "%{area} à lire avant de dessiner"
        sun: "le soleil, bas au sud en hiver"
        wind: "le vent d'ouest, qui sèche et qui casse"
        existing: "%{buildings} bâtiments et %{hedges} de haies déjà là"
        existing_plain: "ce qui est déjà là"
        water: "%{ponds} mares, la plus grande : %{pond}"
        water_plain: "l'eau d'abord"
        draft: "un brouillon de ton IA : à toi de dire oui"
        plants: "%{plants} plants, %{species} espèces"
        plants_plain: "les premiers plants"
        comment: "une question, posée à l'endroit exact"
      stamp:
        now: "le jardin aujourd'hui"
        later:
          one: "dans %{count} an"
          other: "dans %{count} ans"
      step: "Étape %{number}"
      with_plan: "avec une formule"
      chapters:
        - id: "observer"
          number: "1"
          title: "Observer"
          intro: "Lire le lieu avant de dessiner quoi que ce soit."
          stations:
            - scene: "place"
              kicker: "une adresse suffit"
              title: "Retrouve ton terrain"
              body: "Une adresse ou un numéro de parcelle, et le contour se pose sur la photo aérienne et le cadastre. La surface se calcule toute seule, au mètre près."
              link: "/help/creer-sa-premiere-carte"
              link_label: "Créer sa première carte"
            - scene: "layers"
              kicker: "ce que sait ta région"
              title: "Les couches de ton territoire"
              body: "Sols, pentes, relief LiDAR, ruissellement, Natura 2000, plan de secteur… selon ta région, et un socle européen partout ailleurs. Un clic sur la carte lit la donnée sous ton curseur."
              link: "/help/lire-les-couches-du-geoportail"
              link_label: "Lire les couches"
            - scene: "climate"
              kicker: "soleil, vent, climat qui vient"
              title: "Le climat de ce lieu, aujourd'hui et en 2050"
              body: "La course du soleil et l'horizon, la météo observée aux stations proches, et le climat de 2050 et 2080 : de quoi choisir des plantes qui tiendront dans trente ans."
              plan: "yearly"
              link: "/help/le-climat-d-aujourd-hui-et-de-demain"
              link_label: "Le climat d'aujourd'hui et de demain"
            - scene: "climate"
              kicker: "les plantes parlent du sol"
              title: "Le sol, par les plantes qui y poussent"
              body: "Un guide pour bien prélever, la carte des sols, et les bio-indicatrices : photographie une prairie, ton IA y reconnaît chaque espèce et dit ce qu'elle raconte de ta terre."
              plan: "yearly"
              link: "/help/analyser-son-sol"
              link_label: "Analyser son sol"
        - id: "cartographier"
          number: "2"
          title: "Cartographier"
          intro: "Relever ce qui est déjà là, avant d'y toucher."
          stations:
            - scene: "existing"
              kicker: "le lieu tel qu'il est"
              title: "Dessine l'existant"
              body: "Bâtiments, haies, arbres, chemins, réseaux : chaque élément a sa forme exacte, ses longueurs et ses surfaces. Les réseaux restent cachés de tout ce que tu partages."
              link: "/help/dessiner-l-existant"
              link_label: "Dessiner l'existant"
            - scene: "field"
              kicker: "au jardin, téléphone en main"
              title: "L'app terrain"
              body: "Ta carte dans ta poche, même hors réseau : un arbre relevé au GPS, une haie tracée en marchant, une photo rangée là où elle a été prise. Bientôt sur iPhone et Android."
              link: "/help/photos-et-suivi-dans-le-temps"
              link_label: "Photos et suivi dans le temps"
            - scene: "field"
              kicker: "vu d'en haut, daté"
              title: "La vue drone"
              body: "Une prise de vue récente de ton terrain, réalisée par Semisto et posée sur ta carte, à côté des orthophotos publiques qui ont souvent quelques années."
              link: "/mission-drone"
              link_label: "La mission drone"
        - id: "concevoir"
          number: "3"
          title: "Concevoir"
          intro: "L'eau d'abord, puis les accès et la structure."
          stations:
            - scene: "water"
              kicker: "l'eau avant les plantes"
              title: "Où va la pluie"
              body: "Le terrain en relief, la pluie qui ruisselle, le bassin versant d'une mare et son trop-plein, la courbe de niveau exacte pour une baissière : l'eau décide de l'emplacement de tout le reste."
              plan: "yearly"
              link: "/help/lire-le-relief-et-l-eau"
              link_label: "Lire le relief et l'eau"
            - scene: "structure"
              kicker: "ce que tu veux vivre ici"
              title: "La fiche projet"
              body: "Tes envies, ton temps, ton budget, tes contraintes : tout ce qui doit guider le design est noté au même endroit, et ton IA le lit avant de te proposer quoi que ce soit."
              link: "/help/remplir-la-fiche-projet"
              link_label: "Remplir la fiche projet"
            - scene: "drafts"
              kicker: "ton IA propose, tu décides"
              title: "Les brouillons de ton IA"
              body: "Claude, ChatGPT, Le Chat ou une autre : ton IA pose ses idées sur la carte en brouillons, chacune avec son pourquoi. Tu acceptes, tu ajustes ou tu refuses, un par un."
              plan: "yearly"
              link: "/help/relire-les-brouillons-de-l-ia"
              link_label: "Relire les brouillons de l'IA"
        - id: "planter"
          number: "4"
          title: "Planter"
          intro: "Des plantes qui conviennent à ce lieu, et qui grandissent."
          stations:
            - scene: "palette"
              kicker: "ce qui convient ici"
              title: "La palette végétale"
              body: "Pour chaque espèce, ce qui convient à ton terrain critère par critère (rusticité, sol, exposition, place), et ce que le catalogue ne sait pas encore. Les patches mêlent arbres, arbustes, vivaces et couvre-sols."
              link: "/help/construire-sa-palette-et-ses-patches"
              link_label: "Construire sa palette"
            - scene: "palette"
              kicker: "prête pour la commande"
              title: "La liste de plants"
              body: "Les quantités viennent de ce que tu dessines : la liste de plants se calcule toute seule, espèce par espèce et variété par variété."
              link: "/help/la-liste-de-plants-et-la-commande"
              link_label: "La liste de plants"
            - scene: "palette"
              kicker: "chaque plant a son numéro"
              title: "Planter, puis observer"
              body: "Le jour de la plantation, les numéros et les dates. Ensuite, la reprise, la floraison, les récoltes : le carnet garde la mémoire du lieu, saison après saison."
              link: "/help/planter-puis-observer"
              link_label: "Planter puis observer"
            - scene: "growth"
              kicker: "le temps du vivant"
              title: "Trente ans, d'un défilement"
              body: "Les houppiers grandissent, l'ombre s'étend, les strates se remplissent. La vue 3D montre le jardin à hauteur d'yeux, en décembre comme en juin."
              link: "/help/la-vue-3d-du-terrain"
              link_label: "La vue 3D du terrain"
        - id: "echanger"
          number: ""
          title: "Échanger"
          intro: "Un carnet se partage, se discute et s'imprime."
          stations:
            - scene: "share"
              kicker: "à plusieurs"
              title: "Commenter à l'endroit exact"
              body: "Invite qui tu veux, en lecture ou en édition, sans limite. Une question se pose sur un arbre, une mare, une zone, et la discussion reste attachée au lieu."
              link: "/help/partager-et-commenter"
              link_label: "Partager et commenter"
            - scene: "share"
              kicker: "un lien, sans compte"
              title: "Publier ton carnet"
              body: "Une page publique de ton lieu, avec le curseur des années. Tu choisis ce qu'elle montre : l'adresse et les réseaux restent cachés tant que tu ne dis rien."
              link: "/help/publier-sa-carte"
              link_label: "Publier sa carte"
            - scene: "share"
              kicker: "sur papier, à l'échelle"
              title: "Le plan et le carnet de planches"
              body: "Un plan à l'échelle pour le chantier, et un carnet de planches thématiques (eau, accès, strates, plantes) pour un dossier ou une demande de subside."
              plan: "yearly"
              link: "/help/imprimer-un-plan-a-l-echelle"
              link_label: "Imprimer un plan à l'échelle"
            - scene: "share"
              kicker: "n'importe quelle IA"
              title: "Ton IA lit ta carte"
              body: "Connecte ton assistant en MCP : il lit le contour, les couches, les dessins, la fiche projet, et la méthode de Semisto. Il ne modifie jamais rien sans toi."
              link: "/help/connecter-son-ia"
              link_label: "Connecter son IA"
      gallery:
        kicker: "carnets ouverts"
        title: "Des lieux qui grandissent déjà"
        intro: "Des cartes publiées par leurs propriétaires, et montrées ici avec leur accord, à tous les âges : certaines commencent à peine, d'autres ont déjà des années de plantations."
