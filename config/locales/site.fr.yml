        description: "Une carte gratuite, Home à 79 € par an payé une seule fois (59 € pour les membres de Semisto), Pro et Team pour les professionnels, au mois ou à l'année."
      drone:
        title: "Mission drone"
        description: "Une vue aérienne datée de ton terrain, prise par Semisto et configurée sur ta carte. 380 € TTC, achat unique."
      open_source:
        title: "Open source"
        description: "Semisto Terranova est un logiciel libre (AGPL-3.0). Le code, les sources de données et leurs licences, en toute transparence."
      privacy:
