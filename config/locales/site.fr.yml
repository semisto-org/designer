    legal:
      updated_on: "17 octobre 2026"
      privacy:
        title: "Politique de confidentialité"
        lead: "Ce que Semisto Terranova collecte, pourquoi, qui l'héberge, et comment exercer vos droits."
        sections:
          - title: "Qui est responsable de vos données ?"
            paragraphs:
              - "Le responsable du traitement est Semisto ASBL, l'association qui édite le service Semisto Terranova."
              - "Siège : Fonds d'Ahinvaux 1, 5530 Yvoir, Belgique. Numéro d'entreprise (BCE) : 0790.631.657."
              - "Pour toute question sur vos données : %{email}."
          - title: "Quelles données collectons-nous ?"
            items:
              - "Votre compte : votre adresse e-mail, votre nom, et votre photo de profil si vous vous connectez avec Google. Si vous vous connectez avec Apple, nous recevons votre nom (une seule fois) et votre adresse e-mail, ou l'adresse relais qu'Apple crée pour vous si vous choisissez de masquer la vôtre."
              - "Vos contenus : les cartes, contours, dessins, notes, commentaires et photos que vous créez ou ajoutez."
              - "Vos paiements : la formule achetée, le montant, la TVA, la date et le code promotionnel éventuel. Le paiement lui-même est traité par Stripe : nous ne voyons ni ne conservons votre numéro de carte."
              - "Des données techniques : votre adresse IP et des journaux de connexion, utiles à la sécurité et au dépannage."
              - "Un essai « Et chez toi ? », sans compte : l'adresse que vous tapez, les parcelles choisies et ce que Terranova lit du terrain (pente, orientation). Si vous créez ensuite un compte, l'essai devient votre première carte ; sinon il est effacé après 48 heures."
              - "Si vous créez un compte après avoir regardé une carte publiée, nous notons de quelle carte vous venez. Son auteur n'en voit qu'un nombre (« 2 ont commencé le leur »), jamais votre nom ; il voit de même le nombre de visites de sa carte, sans rien qui identifie les visiteurs."
            outro: "Nous utilisons un cookie de session, nécessaire pour vous garder connecté. Nous n'utilisons ni cookies publicitaires ni traceurs tiers. Nous comptons les visites avec Plausible, installé sur nos propres serveurs : il ne pose aucun cookie, ne garde ni votre adresse IP ni aucun identifiant, et ne donne que des chiffres d'ensemble (pages vues, pays, type d'appareil)."
          - title: "Ce que nous recevons de Google"
            paragraphs:
              - "Si vous choisissez « Continuer avec Google », Google nous transmet uniquement votre nom, votre adresse e-mail et votre photo de profil. Nous ne demandons accès à rien d'autre : ni vos e-mails, ni vos contacts, ni vos fichiers, ni votre agenda."
              - "Nous utilisons ces informations pour créer votre compte Semisto Terranova, vous reconnaître quand vous revenez, afficher votre nom et votre photo à vous et aux personnes avec qui vous partagez une carte, et vous écrire au sujet de votre compte (lien de connexion, factures, rappels)."
              - "Nous ne vendons pas ces informations, ne les utilisons pas pour de la publicité, ne les transmettons à aucun tiers en dehors des prestataires listés plus bas, et ne les utilisons pas pour entraîner des modèles d'intelligence artificielle."
              - "L'utilisation des informations reçues des API de Google respecte la politique relative aux données utilisateur des services d'API Google (Google API Services User Data Policy), y compris ses exigences d'utilisation limitée (Limited Use)."
              - "Vous pouvez retirer cet accès à tout moment depuis les paramètres de votre compte Google (myaccount.google.com/permissions) ; votre compte Semisto Terranova reste utilisable par lien de connexion envoyé par e-mail. Pour effacer aussi les informations déjà reçues, supprimez votre compte depuis « Mon compte » ou écrivez à %{email}."
          - title: "Ce que nous recevons d'Apple"
            paragraphs:
              - "Si vous choisissez « Continuer avec Apple », Apple nous transmet un identifiant propre à Semisto Terranova, votre adresse e-mail (ou une adresse relais qui vous transfère nos messages, si vous masquez la vôtre) et, à la première connexion seulement, votre nom. Nous ne recevons rien d'autre."
              - "Nous les utilisons comme celles reçues de Google : créer votre compte, vous reconnaître, afficher votre nom aux personnes avec qui vous partagez une carte, et vous écrire au sujet de votre compte. Nous ne les vendons pas, ne les utilisons pas pour de la publicité et ne les transmettons à aucun tiers en dehors des prestataires listés plus bas."
              - "Vous pouvez retirer cet accès à tout moment dans les réglages de votre identifiant Apple (« Se connecter avec Apple ») ; votre compte Semisto Terranova reste utilisable par lien de connexion envoyé par e-mail. Pour effacer aussi les informations déjà reçues, supprimez votre compte depuis « Mon compte » ou écrivez à %{email}."
          - title: "Pourquoi, et sur quelle base légale ?"
            items:
              - "Fournir le service que vous avez demandé (créer vos cartes, les partager, vous envoyer un lien de connexion) : l'exécution du contrat."
              - "Facturer et tenir la comptabilité : une obligation légale."
              - "Vous prévenir de l'échéance de votre forfait : l'exécution du contrat et notre intérêt légitime à vous éviter une surprise."
              - "Sécuriser le service et prévenir les abus : notre intérêt légitime."
              - "Compter les visites, de façon anonyme, pour savoir quelles pages aident et lesquelles améliorer : notre intérêt légitime."
          - title: "Qui reçoit vos données ?"
            paragraphs:
              - "Nous faisons appel à des prestataires, qui ne traitent vos données que pour notre compte :"
            items:
              - "Infomaniak (Suisse) : hébergement du service, de ses bases de données, de vos photos et documents, et de leurs copies de sauvegarde."
              - "Stripe : paiement, facturation et calcul de la TVA."
              - "Google : uniquement si vous choisissez de vous connecter avec votre compte Google."
              - "Apple : uniquement si vous choisissez de vous connecter avec votre identifiant Apple, et pour transférer nos e-mails si vous masquez votre adresse."
              - "Amazon Simple Email Service (Amazon Web Services, centres de données dans l'Union européenne) : envoi des e-mails (liens de connexion, factures, rappels)."
              - "Votre propre assistant IA : uniquement si vous le connectez à vos cartes via MCP. C'est vous qui le choisissez et qui décidez de ce qu'il lit ; Terranova n'envoie vos cartes à aucune IA de son côté."
              - "Les services de cartographie (Service public de Wallonie, IGN, geoportail.lu, Agence européenne pour l'environnement, ISRIC, Copernicus sur Amazon Web Services, OpenFreeMap) : pour afficher les fonds de carte et les couches, ils reçoivent la zone affichée et l'adresse IP de votre navigateur ou de notre serveur."
              - "La recherche d'adresse (Nominatim, d'OpenStreetMap) : elle reçoit, depuis notre serveur, le texte que vous tapez pour trouver votre terrain."
              - "Pl@ntNet : uniquement si vous demandez l'identification d'une plante par photo. Les photos choisies lui sont envoyées réduites et sans leur position GPS ; Terranova ne les conserve pas. [Conditions de Pl@ntNet à vérifier.]"
            outro: "Nous ne vendons pas vos données et ne les utilisons pas pour de la publicité."
          - title: "Combien de temps les conservons-nous ?"
            items:
              - "Votre compte, vos cartes et vos fichiers : tant que votre compte existe. Quand vous le supprimez, ils sont effacés du service tout de suite, et de nos copies de sauvegarde au plus tard 90 jours plus tard."
              - "Les pièces comptables (factures, paiements) : 10 ans à partir du 1er janvier qui suit l'exercice, comme le droit belge l'exige, même après la suppression du compte."
              - "Les journaux techniques (adresses IP, connexions) : 12 mois au plus."
              - "Les liens et codes de connexion : 20 minutes, et ils ne servent qu'une fois."
              - "Un essai « Et chez toi ? » qui n'est pas devenu une carte : 48 heures."
          - title: "Vos données quittent-elles l'Union européenne ?"
            paragraphs:
              - "Le service et vos fichiers sont hébergés en Suisse, chez Infomaniak. La Commission européenne reconnaît à la Suisse un niveau de protection des données équivalent à celui de l'Union (décision d'adéquation)."
              - "Certains prestataires (Stripe, Google, Apple) peuvent traiter des données hors de l'Union européenne, avec les garanties prévues par le RGPD : clauses contractuelles types et cadre de protection des données UE-États-Unis."
          - title: "Vos droits"
            paragraphs:
              - "Vous pouvez à tout moment demander l'accès à vos données, leur rectification, leur effacement, la limitation de leur traitement, leur portabilité, ou vous opposer à un traitement fondé sur notre intérêt légitime."
              - "Pour supprimer votre compte, utilisez le bouton de votre page « Mon compte » ou écrivez à %{email}. Nous vous répondons dans un délai d'un mois."
              - "Si vous estimez que vos droits ne sont pas respectés, vous pouvez introduire une plainte auprès de l'Autorité de protection des données (autoriteprotectiondonnees.be)."
          - title: "Sécurité"
            paragraphs:
              - "Les échanges sont chiffrés (HTTPS). La connexion se fait par lien envoyé par e-mail, par Google ou, si vous en choisissez un, par un mot de passe que nous ne conservons que sous forme chiffrée (hachée). L'accès à vos cartes est limité à vous et aux personnes que vous invitez."
          - title: "Modifications de cette politique"
            paragraphs:
              - "Si cette politique change de façon importante, nous vous en informons par e-mail ou sur le site avant que le changement ne s'applique."
      terms:
        title: "Conditions d'utilisation"
        lead: "Les règles du jeu pour utiliser Semisto Terranova : compte, formules, paiement, contenus et responsabilités."
        sections:
          - title: "Qui sommes-nous ?"
            paragraphs:
              - "Semisto Terranova est un service en ligne de cartographie et de conception de jardins-forêts, édité par Semisto ASBL. Siège : Fonds d'Ahinvaux 1, 5530 Yvoir, Belgique. Numéro d'entreprise (BCE) : 0790.631.657. Contact : %{email}."
          - title: "Votre compte"
            paragraphs:
              - "Vous vous connectez avec votre adresse e-mail ou avec Google. Vous êtes responsable de l'accès à votre adresse e-mail et des actions faites avec votre compte. Les informations que vous donnez doivent être exactes."
          - title: "Les formules et les prix"
            items:
              - "La carte gratuite comprend une carte que vous possédez, avec les fonctions décrites sur la page des tarifs."
              - "La formule Home coûte %{yearly} TTC. Elle se paie en une fois, vaut un an à partir du paiement et ne se renouvelle pas automatiquement. Un renouvellement fait avant l'échéance s'ajoute à la période en cours."
              - "Pro (%{atelier} par mois, 6 cartes actives) et Team (%{bureau} par mois, 30 cartes actives) sont des abonnements, mensuels ou annuels (%{atelier_yearly} et %{bureau_yearly} par an), reconduits à chaque période jusqu'à résiliation. Vous pouvez résilier à tout moment depuis votre page de facturation ; l'accès continue jusqu'à la fin de la période payée."
              - "Un abonnement Pro ou Team annuel souscrit avant le 31 décembre 2026 bénéficie d'un mois offert sur sa première année (%{atelier_launch} et %{bureau_launch}). Les années suivantes sont au prix annuel."
              - "La mission drone (%{drone} TTC) est une prestation unique, réalisée par Semisto après un échange avec vous."
              - "Tous les prix sont TTC. Un prix peut changer pour l'avenir ; il ne change jamais une période déjà payée."
            outro: "Les membres de Semisto dont la cotisation est en ordre paient la formule Home %{member} au lieu de %{yearly}. La réduction est reconnue automatiquement à partir de l'adresse e-mail de l'adhésion."
          - title: "Paiement et facturation"
            paragraphs:
              - "Le paiement passe par Stripe. Une facture vous est envoyée par e-mail. Si le paiement d'un abonnement échoue, l'accès est maintenu pendant 7 jours, le temps de mettre à jour votre moyen de paiement, puis revient à la formule gratuite."
          - title: "À l'échéance, rien n'est supprimé"
            paragraphs:
              - "Quand un forfait prend fin, vos cartes restent lisibles, exportables et commentables, et la plus ancienne reste modifiable comme dans la formule gratuite. Les cartes qui dépassent la formule gratuite passent en lecture seule jusqu'au renouvellement."
          - title: "Rétractation et remboursement"
            paragraphs:
              - "[À valider avec un juriste : droit de rétractation de 14 jours des consommateurs et ses exceptions pour les contenus numériques fournis immédiatement avec votre accord, conditions de remboursement.]"
          - title: "Vos contenus"
            paragraphs:
              - "Vos cartes, dessins, notes et photos restent à vous. Vous nous donnez seulement le droit de les héberger et de les afficher pour faire fonctionner le service, y compris auprès des personnes avec qui vous choisissez de les partager."
              - "Vous êtes responsable de ce que vous ajoutez et de ce que vous partagez. N'ajoutez pas de contenu illicite, ni de contenu qui porte atteinte aux droits d'autrui."
          - title: "Données publiques et aides à la décision"
            paragraphs:
              - "Les couches de données viennent de sources publiques, affichées en l'état. Les analyses, suggestions et brouillons de l'IA sont des aides à la réflexion : vérifiez-les sur le terrain et auprès des autorités compétentes (urbanisme, cadastre, zones protégées, règles sur les mares et les haies) avant de vous engager dans des travaux."
          - title: "Votre assistant IA"
            paragraphs:
              - "Si vous connectez un assistant IA à vos cartes via MCP, vous choisissez l'assistant et ce qu'il lit. Ce qu'il fait des données qu'il lit relève des conditions de son fournisseur. Vous pouvez révoquer l'accès à tout moment."
          - title: "Disponibilité et responsabilité"
            paragraphs:
              - "Nous faisons de notre mieux pour que le service fonctionne bien, sans pouvoir garantir qu'il ne sera jamais interrompu. Dans la mesure permise par la loi, et sans exclure les droits que la loi vous reconnaît en tant que consommateur, notre responsabilité est limitée aux dommages directs."
          - title: "Open source"
            paragraphs:
              - "Le code de Semisto Terranova est publié sous licence AGPL-3.0. Ces conditions régissent l'utilisation du service hébergé par Semisto, pas votre droit d'utiliser le code."
          - title: "Fin du compte"
            paragraphs:
              - "Vous pouvez demander la suppression de votre compte à tout moment. Nous pouvons suspendre un compte en cas d'abus ou de non-respect de ces conditions, en vous prévenant autant que possible."
          - title: "Droit applicable"
            paragraphs:
              - "Ces conditions sont régies par le droit belge. En cas de litige, les tribunaux de l'arrondissement judiciaire de Namur sont compétents, sans préjudice des règles impératives de protection des consommateurs. Vous pouvez aussi vous adresser gratuitement au Service de médiation pour le consommateur (mediationconsommateur.be)."
