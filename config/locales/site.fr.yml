        intro: "Bureaux d'études, pépiniéristes : plusieurs projets à la fois, en abonnement mensuel résiliable."
      badge_individual: "Sans abonnement"
      cta_free: "Créer ma carte gratuite"
      cta_choose: "Choisir"
      compare:
        title: "Ce que contient chaque formule"
        columns:
          free: "Gratuit"
          yearly: "Forfait"
          atelier: "Atelier"
          bureau: "Bureau d'études"
        rows:
          - label: "Cartes que tu possèdes"
            values: ["1", "10", "5", "20"]
          - label: "Fond de carte et couches du Géoportail"
            values: ["yes", "yes", "yes", "yes"]
          - label: "Dessin, palette, liste de plants, fiche projet"
            values: ["yes", "yes", "yes", "yes"]
          - label: "Commentaires et partage"
            values: ["yes", "yes", "yes", "yes"]
          - label: "Claude en lecture seule (MCP)"
            values: ["yes", "yes", "yes", "yes"]
          - label: "Autres cartes que la première"
