      member:
        eyebrow: "Membres de Semisto"
        title: "30 % de réduction sur le forfait particulier"
        body: "Les membres de Semisto reçoivent par e-mail un code promotionnel personnel. Saisis-le sur la page de paiement : le forfait passe de %{yearly} à %{member}."
        note: "Pas encore membre ? Rejoins Semisto et soutiens la mission qui fait vivre cet outil."
        cta: "Découvrir Semisto"
      drone:
        title: "Mission drone : %{drone}, achat unique"
        body: "Une vue aérienne datée de ton terrain, prise par Semisto et configurée sur ta carte. Elle se commande à part, sans forfait obligatoire."
        cta: "Voir la mission drone"
      faq:
        title: "Questions fréquentes"
        items:
          - q: "Que se passe-t-il à l'échéance de mon forfait particulier ?"
            a: "Rien ne se renouvelle tout seul et rien n'est supprimé. Tes cartes restent lisibles, exportables et commentables, et la plus ancienne reste modifiable comme dans la formule gratuite. Quelques semaines avant l'échéance, Designer te propose de renouveler ; si tu le fais avant la date, aucun jour n'est perdu : la nouvelle année commence à la fin de l'ancienne."
          - q: "Pourquoi pas d'abonnement pour les particuliers ?"
            a: "Un projet de jardin-forêt avance par saisons, pas par mois. Tu paies une année quand tu en as besoin, sans prélèvement automatique à surveiller."
          - q: "Quelle différence avec Atelier et Bureau d'études ?"
            a: "Le forfait particulier couvre jusqu'à 10 cartes pour ton usage personnel. Atelier (5 cartes) et Bureau d'études (20 cartes) sont des abonnements mensuels résiliables à tout moment, pensés pour mener des projets de clients, avec des éditeurs invités gratuits."
          - q: "Les prix sont-ils TTC ?"
            a: "Oui. Le prix affiché est celui que tu paies, TVA comprise. La TVA applicable est calculée au paiement selon ton pays, et une facture détaillée t'est envoyée automatiquement par e-mail."
          - q: "Comment se passe le paiement ?"
            a: "Le paiement est traité par Stripe, un prestataire de paiement spécialisé : Semisto ne voit ni ne conserve ton numéro de carte. Tu reçois une facture par e-mail, et tu la retrouves dans ta page « Formule et facturation »."
          - q: "Comment obtenir la réduction de 30 % des membres de Semisto ?"
            a: "Les membres reçoivent un code promotionnel personnel par e-mail. Il se saisit à la caisse, sur la page de paiement du forfait particulier."
          - q: "Puis-je résilier un abonnement professionnel ?"
            a: "À tout moment, depuis « Gérer l'abonnement » dans ta page de facturation. L'accès continue jusqu'à la fin de la période déjà payée."
          - q: "Mes cartes m'appartiennent-elles ?"
            a: "Oui. Tes cartes et tes dessins restent à toi. Le code de Designer est libre, et tu peux à tout moment demander la suppression de ton compte."
      contact:
        title: "Une question avant de te lancer ?"
        body: "Écris-nous, nous répondons volontiers : %{email}."
    drone:
      hero:
        eyebrow: "Mission drone"
        title: "Une vue aérienne de ton terrain, prise par Semisto"
        lead: "Les orthophotos publiques ont quelques années. Avec la mission drone, Semisto photographie ton terrain d'en haut, à une date que tu choisis, et configure la vue sur ta carte."
        price_note: "achat unique, TTC"
        cta_signed_out: "Commander la mission"
        cta_signed_in: "Commander la mission"
        needs_account: "Un compte gratuit suffit : tu seras invité à te connecter avant le paiement."
      how:
        title: "Comment ça se passe"
        steps:
          - title: "Tu commandes en ligne"
            body: "Le paiement est sécurisé et une facture t'est envoyée par e-mail. Aucun forfait n'est nécessaire."
          - title: "Semisto te recontacte"
            body: "Nous organisons ensemble la prise de vue : l'accès au terrain, la période, la météo."
          - title: "La vue arrive sur ta carte"
            body: "Semisto configure la vue drone sur ta carte, datée, à côté des orthophotos publiques."
      gets:
        title: "Ce que tu obtiens"
        items:
          - "Une vue aérienne récente de ton terrain, datée, qui s'ajoute aux orthophotos publiques."
          - "La vue configurée sur ta carte par Semisto : elle sert directement de fond pour dessiner."
          - "Une trace dans l'historique des vues : tu pourras comparer d'une saison, d'une année à l'autre."
      good_to_know:
        title: "Bon à savoir"
        items:
          - "Le vol dépend de la météo et du lieu : Semisto te confirme qu'il est possible avant de commencer."
          - "Le prix est TTC. Il s'agit d'une prestation réalisée par une équipe, pas d'un téléchargement automatique : compte un échange par e-mail pour organiser la prise de vue."
      faq:
        title: "Questions fréquentes"
        items:
          - q: "Faut-il un forfait pour commander ?"
            a: "Non. Il suffit d'un compte, gratuit. La mission drone est un achat à part, avec ou sans forfait."
          - q: "Pour quels terrains ?"
            a: "Pour tout terrain où le survol par drone est autorisé. Si ce n'est pas possible chez toi, Semisto te l'explique avant toute prise de vue."
          - q: "Qui voit la vue drone ?"
            a: "Elle est ajoutée à ta carte : elle est visible par les personnes avec qui tu partages cette carte."
    open_source:
      hero:
        eyebrow: "Open source"
        title: "Un outil libre, construit au grand jour"
        lead: "Semisto Designer est un logiciel libre. Tu peux lire son code, le vérifier, l'améliorer et même l'héberger toi-même."
      licence:
        title: "Licence AGPL-3.0"
        body:
          - "Le code de Semisto Designer est publié sous la licence GNU AGPL-3.0. En clair : tu peux l'utiliser, l'étudier, le modifier et le partager. Si tu le modifies et l'offres en ligne à d'autres personnes, tu partages tes modifications sous la même licence."
          - "Le service hébergé sur designer.semisto.org est celui de Semisto. Le code est celui que tout le monde peut lire."
        cta: "Voir le code sur GitHub"
        url: "https://github.com/semisto-org/designer"
      why:
        title: "Pourquoi libre ?"
        body: "Parce que le savoir sur le sol, l'eau et le vivant gagne à circuler, et parce que tu dois pouvoir vérifier ce que fait l'outil de ton terrain. Le service payant finance le temps nécessaire pour le faire vivre ; le code reste à tous."
      data:
        title: "Données et licences"
        intro: "Designer n'invente pas les données du terrain : il les affiche, avec leur source. Voici d'où elles viennent."
        columns:
          source: "Source"
          use: "Ce que nous en faisons"
          licence: "Licence et mention"
        rows:
          - source: "Géoportail de Wallonie (SPW)"
            use: "Orthophotos, cadastre, relief, sols, pentes, ruissellement, Natura 2000, plan de secteur et autres couches."
            licence: "Données ouvertes du Service public de Wallonie, réutilisées selon la licence de chaque couche. La source est citée sur la carte."
          - source: "IGN – Géoplateforme (France)"
            use: "Photos aériennes, plan IGN, cadastre (DGFiP), relief RGE ALTI et LiDAR HD, pentes, cours d'eau, forêts, carte des sols (INRAE), Natura 2000 et ZNIEFF (PatriNat)."
            licence: "Licence Ouverte 2.0 (Etalab). La source est citée sur la carte."
          - source: "geoportail.lu (Luxembourg)"
            use: "Photos aériennes, carte topographique, cadastre et relief LiDAR de l'Administration du cadastre et de la topographie."
            licence: "Données ouvertes (CC0). La source est citée sur la carte."
          - source: "Copernicus, Agence européenne pour l'environnement, ISRIC"
            use: "Hors des régions équipées : relief (Copernicus DEM GLO-30), occupation du sol (Corine Land Cover), Natura 2000 et estimations du sol (SoilGrids)."
            licence: "Copernicus DEM : © DLR e.V. 2010-2014 et © Airbus Defence and Space GmbH 2014-2018, fourni sous COPERNICUS par l'Union européenne et l'ESA. EEA : réutilisation avec mention. SoilGrids : CC BY 4.0."
          - source: "OpenStreetMap"
            use: "Données du fond de carte."
            licence: "ODbL. © les contributrices et contributeurs d'OpenStreetMap."
          - source: "OpenFreeMap"
            use: "Diffusion des tuiles vectorielles du fond de carte."
            licence: "Service ouvert, fondé sur les données OpenStreetMap (ODbL)."
          - source: "PFAF (Plants For A Future)"
            use: "Certaines valeurs de la base de plantes (rusticité, usages…)."
            licence: "Licence non commerciale : les valeurs sont affichées avec PFAF cité comme source, sans reprise de ses textes ni de ses images."
          - source: "Base de plantes de Semisto"
            use: "Les fiches de plantes, enrichies par les contributrices et contributeurs."
            licence: "La provenance est indiquée champ par champ (sourcé, à vérifier, vide)."
        outro: "D'autres sources (météo, climat) pourront s'ajouter ; chacune sera citée ici avec sa licence."
      contribute:
        title: "Contribuer"
        body: "Une erreur, une idée, une couche de données à ajouter ? Ouvre une discussion sur GitHub ou écris-nous. Les contributions sont les bienvenues, des développeuses comme des jardinières."
        cta: "Ouvrir une discussion"
        url: "https://github.com/semisto-org/designer/issues"
    legal:
      updated_on: "3 octobre 2026"
      privacy:
        title: "Politique de confidentialité"
        lead: "Ce que Semisto Designer collecte, pourquoi, qui l'héberge, et comment exercer vos droits."
        sections:
          - title: "Qui est responsable de vos données ?"
            paragraphs:
              - "Le responsable du traitement est Marco & Vespucci SRL, qui édite le service Semisto Designer sous la marque Semisto."
              - "Adresse : [adresse à compléter]. Numéro d'entreprise (BCE) : [numéro BCE à compléter]."
              - "Pour toute question sur vos données : %{email}."
          - title: "Quelles données collectons-nous ?"
            items:
              - "Votre compte : votre adresse e-mail, votre nom, et votre photo de profil si vous vous connectez avec Google."
              - "Vos contenus : les cartes, contours, dessins, notes, commentaires et photos que vous créez ou ajoutez."
              - "Vos paiements : la formule achetée, le montant, la TVA, la date et le code promotionnel éventuel. Le paiement lui-même est traité par Stripe : nous ne voyons ni ne conservons votre numéro de carte."
              - "Des données techniques : votre adresse IP et des journaux de connexion, utiles à la sécurité et au dépannage."
            outro: "Nous utilisons un cookie de session, nécessaire pour vous garder connecté. Nous n'utilisons ni cookies publicitaires ni traceurs tiers."
          - title: "Pourquoi, et sur quelle base légale ?"
            items:
              - "Fournir le service que vous avez demandé (créer vos cartes, les partager, vous envoyer un lien de connexion) : l'exécution du contrat."
              - "Facturer et tenir la comptabilité : une obligation légale."
              - "Vous prévenir de l'échéance de votre forfait : l'exécution du contrat et notre intérêt légitime à vous éviter une surprise."
              - "Sécuriser le service et prévenir les abus : notre intérêt légitime."
          - title: "Qui reçoit vos données ?"
            paragraphs:
              - "Nous faisons appel à des prestataires, qui ne traitent vos données que pour notre compte :"
            items:
              - "Hébergement : un serveur privé virtuel (VPS) [hébergeur et pays à confirmer]."
              - "Stripe : paiement, facturation et calcul de la TVA."
              - "Google : uniquement si vous choisissez de vous connecter avec votre compte Google."
              - "Un service d'envoi d'e-mails [prestataire à confirmer] : liens de connexion, factures, rappels."
              - "Votre propre assistant IA : uniquement si vous le connectez à vos cartes via MCP. C'est vous qui le choisissez et qui décidez de ce qu'il lit ; Designer n'envoie vos cartes à aucune IA de son côté."
              - "Les services de cartographie (Service public de Wallonie, IGN, geoportail.lu, Agence européenne pour l'environnement, ISRIC, Copernicus sur Amazon Web Services, OpenFreeMap) : pour afficher les fonds de carte et les couches, ils reçoivent la zone affichée et l'adresse IP de votre navigateur ou de notre serveur."
              - "La recherche d'adresse (Nominatim, d'OpenStreetMap) : elle reçoit, depuis notre serveur, le texte que vous tapez pour trouver votre terrain."
              - "Pl@ntNet : uniquement si vous demandez l'identification d'une plante par photo. Les photos choisies lui sont envoyées réduites et sans leur position GPS ; Designer ne les conserve pas. [Conditions de Pl@ntNet à vérifier.]"
            outro: "Nous ne vendons pas vos données et ne les utilisons pas pour de la publicité."
          - title: "Combien de temps les conservons-nous ?"
            items:
              - "Votre compte et vos cartes : tant que votre compte existe."
              - "Les pièces comptables (factures, paiements) : [7 ans, à valider], comme la loi l'exige."
              - "Les journaux techniques : [durée à définir]."
          - title: "Vos données quittent-elles l'Union européenne ?"
            paragraphs:
              - "Certains prestataires (Stripe, Google) peuvent traiter des données hors de l'Union européenne, avec les garanties prévues par le RGPD (clauses contractuelles types, cadre de protection des données UE-États-Unis). [À valider.]"
          - title: "Vos droits"
            paragraphs:
              - "Vous pouvez à tout moment demander l'accès à vos données, leur rectification, leur effacement, la limitation de leur traitement, leur portabilité, ou vous opposer à un traitement fondé sur notre intérêt légitime."
              - "Pour supprimer votre compte, utilisez le bouton de votre page « Mon compte » ou écrivez à %{email}. Nous vous répondons dans un délai d'un mois."
              - "Si vous estimez que vos droits ne sont pas respectés, vous pouvez introduire une plainte auprès de l'Autorité de protection des données (autoriteprotectiondonnees.be)."
          - title: "Sécurité"
            paragraphs:
              - "Les échanges sont chiffrés (HTTPS). La connexion se fait par lien envoyé par e-mail ou par Google : il n'y a pas de mot de passe à voler. L'accès à vos cartes est limité à vous et aux personnes que vous invitez."
          - title: "Modifications de cette politique"
            paragraphs:
              - "Si cette politique change de façon importante, nous vous en informons par e-mail ou sur le site avant que le changement ne s'applique."
      terms:
        title: "Conditions d'utilisation"
        lead: "Les règles du jeu pour utiliser Semisto Designer : compte, formules, paiement, contenus et responsabilités."
        sections:
          - title: "Qui sommes-nous ?"
            paragraphs:
              - "Semisto Designer est un service en ligne de cartographie et de conception de jardins-forêts, édité par Marco & Vespucci SRL sous la marque Semisto. Adresse : [adresse à compléter]. Numéro d'entreprise (BCE) : [numéro BCE à compléter]. Contact : %{email}."
          - title: "Votre compte"
            paragraphs:
              - "Vous vous connectez avec votre adresse e-mail ou avec Google. Vous êtes responsable de l'accès à votre adresse e-mail et des actions faites avec votre compte. Les informations que vous donnez doivent être exactes."
          - title: "Les formules et les prix"
            items:
              - "La carte gratuite comprend une carte que vous possédez, avec les fonctions décrites sur la page des tarifs."
              - "Le forfait particulier coûte %{yearly} TTC. Il se paie en une fois, vaut un an à partir du paiement et ne se renouvelle pas automatiquement. Un renouvellement fait avant l'échéance s'ajoute à la période en cours."
              - "Atelier (%{atelier} par mois, 5 cartes) et Bureau d'études (%{bureau} par mois, 20 cartes) sont des abonnements mensuels, reconduits chaque mois jusqu'à résiliation. Vous pouvez résilier à tout moment depuis votre page de facturation ; l'accès continue jusqu'à la fin de la période payée."
              - "La mission drone (%{drone} TTC) est une prestation unique, réalisée par Semisto après un échange avec vous."
              - "Tous les prix sont TTC. Un prix peut changer pour l'avenir ; il ne change jamais une période déjà payée."
            outro: "Les membres de Semisto bénéficient de 30 % de réduction sur le forfait particulier, avec un code personnel."
          - title: "Paiement et facturation"
            paragraphs:
              - "Le paiement passe par Stripe. Une facture vous est envoyée par e-mail. Si le paiement d'un abonnement échoue, l'accès est maintenu pendant 7 jours, le temps de mettre à jour votre moyen de paiement, puis revient à la formule gratuite."
          - title: "À l'échéance, rien n'est supprimé"
            paragraphs:
              - "Quand un forfait prend fin, vos cartes restent lisibles, exportables et commentables, et la plus ancienne reste modifiable comme dans la formule gratuite. Les cartes qui dépassent la formule gratuite passent en lecture seule jusqu'au renouvellement."
          - title: "Rétractation et remboursement"
            paragraphs:
              - "[À valider avec un juriste : droit de rétractation de 14 jours des consommateurs et ses exceptions pour les contenus numériques fournis immédiatement avec votre accord, conditions de remboursement.]"
          - title: "Vos contenus"
            paragraphs:
              - "Vos cartes, dessins, notes et photos restent à vous. Vous nous donnez seulement le droit de les héberger et de les afficher pour faire fonctionner le service, y compris auprès des personnes avec qui vous choisissez de les partager."
              - "Vous êtes responsable de ce que vous ajoutez et de ce que vous partagez. N'ajoutez pas de contenu illicite, ni de contenu qui porte atteinte aux droits d'autrui."
          - title: "Données publiques et aides à la décision"
            paragraphs:
              - "Les couches de données viennent de sources publiques, affichées en l'état. Les analyses, suggestions et brouillons de Claude sont des aides à la réflexion : vérifiez-les sur le terrain et auprès des autorités compétentes (urbanisme, cadastre, zones protégées, règles sur les mares et les haies) avant de vous engager dans des travaux."
          - title: "Votre assistant IA"
            paragraphs:
              - "Si vous connectez un assistant IA à vos cartes via MCP, vous choisissez l'assistant et ce qu'il lit. Ce qu'il fait des données qu'il lit relève des conditions de son fournisseur. Vous pouvez révoquer l'accès à tout moment."
          - title: "Disponibilité et responsabilité"
            paragraphs:
              - "Nous faisons de notre mieux pour que le service fonctionne bien, sans pouvoir garantir qu'il ne sera jamais interrompu. Dans la mesure permise par la loi, et sans exclure les droits que la loi vous reconnaît en tant que consommateur, notre responsabilité est limitée aux dommages directs."
          - title: "Open source"
            paragraphs:
              - "Le code de Semisto Designer est publié sous licence AGPL-3.0. Ces conditions régissent l'utilisation du service hébergé par Semisto, pas votre droit d'utiliser le code."
          - title: "Fin du compte"
            paragraphs:
              - "Vous pouvez demander la suppression de votre compte à tout moment. Nous pouvons suspendre un compte en cas d'abus ou de non-respect de ces conditions, en vous prévenant autant que possible."
          - title: "Droit applicable"
            paragraphs:
              - "Ces conditions sont régies par le droit belge. En cas de litige, les tribunaux de [arrondissement à préciser] sont compétents, sans préjudice des règles impératives de protection des consommateurs. [Médiation de la consommation à préciser.]"
