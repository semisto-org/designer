      too_many: "Une présentation compte au plus %{count} étapes."
    templates:
      pre_design:
        name: "Pré-design"
        steps:
          cover:
            title: "Votre jardin-forêt"
            note: "La page de garde, avec le nom du lieu et des personnes. Laisse le temps de saluer et de raconter ce que vous avez vu en arrivant."
          project:
            title: "Votre projet"
            note: "Le lieu et l'intention : nourrir, accueillir, protéger. Rappelle avec leurs mots ce que la famille veut vivre ici."
          microclimates:
            title: "Micro-climats"
            note: "Zones chaudes près du bâti, coulées d'air froid au fond du vallon : quelques degrés font la différence entre gel et non-gel à la floraison."
          sun:
            title: "Ensoleillement"
            note: "Soleil d'été, soleil d'hiver, et l'ombre de midi en décembre. Montre où le soleil reste le plus longtemps."
          soil:
            title: "Sol"
            note: "Les échantillons, le pH, la texture, la pollution recherchée là où elle compte (le futur potager). Et ce que le sol demande."
          water_slope:
            title: "Eau et pente"
            note: "Par où l'eau arrive, où elle s'accumule, ce que disent les plantes des zones humides."
          wind:
            title: "Vent"
            note: "Vents dominants doux et humides, vents d'est asséchants : le côté à protéger."
          access:
            title: "Flux et accès existants"
            note: "Les passages déjà là (tracteur, voitures) et les sorties de la maison."
          views:
            title: "Vues et intimité"
            note: "Les belles vues à garder, les vis-à-vis et les éléments à masquer."
          flora_fauna:
            title: "Flore et faune"
            note: "Ce qui pousse déjà et se mange, les indices de passage des animaux."
          challenges:
            title: "Défis et atouts"
            note: "Le « trousseau de clés » du bureau d'études commence ici : ce qui résiste (pente, route, vis-à-vis, entretien) et ce qui porte le projet (exposition, sol, eau, envies de la famille)."
          functions:
            title: "Besoins et fonctions"
            note: "Les besoins de la famille, ceux du lieu, et en miroir les fonctions que le jardin-forêt remplira : nourrir, protéger, accueillir, régénérer le sol."
          purpose:
            title: "Raison d'être de votre jardin-forêt"
            note: "Une à trois phrases, volontairement évolutives : notre lecture du lien entre la famille et ce lieu, qu'elle pourra s'approprier et réécrire."
          sketch:
            title: "Esquisse du pré-projet"
            note: "Le projet en entier, une première fois, avant de le décomposer couche par couche."
          earthworks:
            title: "Terrassement"
            note: "Terrasses et talus, déblais et remblais, l'eau guidée vers les zones d'infiltration."
          water_design:
            title: "Eau"
            note: "Citernes, conduites, points d'eau, mares et trop-pleins."
          structures:
            title: "Structures"
            note: "Serre, abris, poulailler, rangements : chaque structure à sa place, avec sa raison."
          strata_low:
            title: "Strates basses"
            note: "Petits fruits, vivaces, couvre-sols : ils dessinent le relief et allongent la perspective."
          strata_middle:
            title: "Strates moyennes"
            note: "Arbustes et petits arbres : brise-vue, ambiance forestière, intégration des structures."
          strata_high:
            title: "Strates hautes"
            note: "Les grands arbres qui structurent le jardin pour trente ans."
          screens:
            title: "Brise-vues dans 5 ans"
            note: "La hauteur des écrans végétaux dans 5 ans et leur ombre en hiver."
          zones:
            title: "Zones"
            note: "Des zones les plus fréquentées aux plus sauvages ; les lieux de vie et de rassemblement."
          flows:
            title: "Flux"
            note: "Récolte, convivialité, travail, intimité, engins : un parcours à la fois (une étiquette par flux)."
          synthesis:
            title: "Synthèse dans 15 ans"
            note: "Toutes les couches ensemble, quand le jardin aura grandi."
          next_steps:
            title: "Prochaines étapes"
            note: "Validation du pré-projet, terrassement, liste de plantation, première plantation. La page Mise en œuvre donne le calendrier."
          budget:
            title: "Plants et budget"
            note: "La liste de plantation et son ordre de grandeur : prioriser ce qu'on veut voir grandir en premier."
