      fair: "Limite"
      bad: "Trop loin"
      frost: "Gel"
    overall:
      good: "Les fruits s'y gardent bien."
      fair: "Ça peut aller, avec un peu d'attention."
      bad: "Les fruits ne s'y garderont pas longtemps."
      frost: "Il a gelé : les fruits gelés ne se gardent plus."
    advice:
      warm_bad: "Trop chaud : à 18–20 °C, une pomme mûrit plusieurs fois plus vite qu'à 4 °C. Un jour au chaud vaut une semaine en cave. Garde ici les fruits à manger vite, et cherche un endroit plus frais pour l'hiver."
      warm_fair: "Un peu chaud : une cave à 6–8 °C garde encore bien les pommes. Aère les nuits fraîches et ferme le jour."
      dry_bad: "Trop sec : sous 75 %, les fruits se rident et perdent du poids. Pose un linge humide ou un bac d'eau, ou emballe les fruits dans du papier journal."
      dry_fair: "Un peu sec : un bac d'eau ou un sol arrosé de temps en temps aide les fruits à rester fermes."
      wet: "Très humide : c'est bon pour les fruits tant que l'air circule. Surveille la pourriture et écarte les fruits abîmés."
      frost: "Le thermomètre est descendu à 0 °C ou en dessous : protège les caisses (couverture, paille) ou rentre-les plus au chaud par grand froid."
      apart: "Garde les pommes à l'écart des légumes : elles dégagent de l'éthylène qui fait germer les pommes de terre et vieillir les choux."
    winter:
      none: "L'hiver décidera : relève chaque semaine de novembre à mars, idéalement avec un thermomètre mini-maxi. C'est là qu'on voit si ce lieu garde les fruits jusqu'au printemps."
      seen: "Cet hiver : %{count} relevés, de %{low} à %{high} °C."
    compare: "Tu as plusieurs lieux ? Relève-les le même jour pour voir lequel garde le mieux."
