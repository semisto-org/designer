fr:
  admin:
    design:
      title: "Design"
      intro: "Les primitives « carnet » partagées par tout Terranova, en vrai code, avec leurs états. Un écran qui en a besoin les importe depuis components/ui au lieu de refaire un bouton, une confirmation ou un message à sa façon."
      use: "Quand"
      guard:
        title: "Ce qui reste à reprendre"
        intro: "Le garde-fou de la CI refuse tout nouvel écart. Les écarts d'avant sont gelés et se résorbent chantier par chantier : chaque fichier nettoyé fait baisser ces compteurs."
        files: "%{count} fichiers à reprendre. Les plus chargés :"
        clean: "Plus aucun écart. Le carnet est partout."
        command: "Après un nettoyage : npm run design:lint -- --update"
        rules:
          small-text: "Textes trop petits"
          native-confirm: "Confirmations du navigateur"
          hex-color: "Couleurs en dur"
          bare-button: "Boutons faits main"
        hints:
          small-text: "text-sm au minimum"
          native-confirm: "confirmAction()"
          hex-color: "jetons du thème"
          bare-button: "Button ou IconButton"
      sections:
        buttons:
          title: "Boutons"
          use: "Toute action. En pilule ; un seul bouton plein par zone, la suite en secondaire ou discret."
          primary: "Garder ce carnet"
          leaf: "Planter"
          secondary: "Inviter"
          ghost: "Plus tard"
          danger: "Supprimer"
          disabled: "Indisponible"
          icons: "Boutons-icônes : le nom est obligatoire, lu à voix haute et montré au survol."
          edit: "Modifier"
          layer: "Afficher le calque"
          remove: "Retirer"
        confirm:
          title: "Confirmation"
          use: "Avant ce qui ne se rattrape pas, ou que la personne a demandé de confirmer (⌫ sur une plante en projet). Jamais confirm() du navigateur."
          danger_button: "Supprimer le pommier"
          danger_title: "Supprimer ce pommier ?"
          danger_body: "Il part à la corbeille avec ses photos et ses observations."
          danger_note: "Tu pourras l'annuler pendant 30 jours"
          default_button: "Archiver la carte"
          default_title: "Archiver « Le verger du bas » ?"
          default_body: "Elle reste lisible mais ne compte plus parmi tes cartes actives."
          archive: "Archiver"
          yes: "Confirmé"
          no: "Rien n'a changé"
        sheet:
          title: "Feuille"
          use: "Un détail ou une petite tâche sans quitter l'écran : par le bas au téléphone, sur le côté à l'ordinateur."
          open: "Ouvrir la fiche du pommier"
          sheet_title: "Pommier « Reinette de Blenheim »"
          body: "Planté en novembre 2025. Adulte vers 2040 : 6 m de haut, 7 m de large. Son ombre de décembre touchera le potager."
          done: "Fermer la fiche"
        toast:
          title: "Message éphémère"
          use: "Dire qu'une chose est faite, avec « Annuler » quand c'est possible. Une erreur reste jusqu'à ce qu'on la ferme."
          info: "Info"
          success: "Réussite"
          error: "Erreur"
          action: "Avec « Annuler »"
          info_message: "La carte est partagée avec Malau."
          success_message: "Trois plants ajoutés à la palette."
          error_message: "Le relief n'a pas pu être chargé. Réessaie dans un instant."
          action_message: "Pommier supprimé."
          undo: "Annuler"
          undone: "Le pommier est revenu."
        tooltip:
          title: "Infobulle"
          use: "Le sens d'un mot ou d'une icône qui ne va pas de soi. Jamais une information indispensable."
          before: "Groseilliers et noisetiers forment la "
          term: "strate arbustive"
          after: "."
          explanation: "Les arbustes, entre 1 et 4 m : groseilliers, noisetiers, sureaux."
        pill:
          title: "Pastilles"
          use: "Un état ou une étiquette en un ou deux mots."
          neutral: "Existant"
          prune: "Pro"
          leaf: "Planté"
          humus: "En projet"
          clay: "Refusé"
          lichen: "Brouillon de ton IA"
        empty:
          title: "État vide du compagnon"
          use: "Un écran vide dit quoi regarder d'abord, et pourquoi."
          heading: "Commence par l'eau"
          why: "Avant de choisir des plantes, regarde où la pluie arrive, où elle file et où elle stagne sur ton terrain. C'est elle qui décidera de la place de la mare et des haies."
          action: "Observer l'eau"
          note: "On regarde ensemble ?"
        hand:
          title: "Note manuscrite"
          use: "La voix du compagnon dans la marge : quelques mots, jamais la seule place d'une information."
          left: "ton terrain commence ici"
          down: "regarde la pente"
          leaf: "dans 15 ans, de l'ombre ici"
        skeleton:
          title: "Squelette"
          use: "Pendant un chargement, la forme de ce qui arrive, pour que la page ne saute pas."
        usage:
          title: "Compteur d'usage"
          use: "Ce que la formule fait pour tes lieux : cartes, stockage, images. Vert, puis mangue à 80 %, grenade à la limite."
          maps: "Cartes actives"
          storage: "Stockage"
          images: "« Mettre en image » ce mois-ci"
          archived: "Cartes archivées"
          storage_hint: "Les photos de drone prennent le plus de place."
        place:
          title: "Mini-carte du lieu"
          use: "Chaque fois qu'un écran, une carte ou un e-mail parle d'un lieu : son vrai contour, nord en haut, avec sa surface."
          sample: "Le verger du bas"
          empty: "Sans contour"
        fields:
          title: "Champs, cartes, fenêtres"
          use: "Les primitives d'avant restent : Field, Input, Select, Textarea, Card, Dialog."
          label: "Nom du lieu"
          placeholder: "Le terrain de Purnode"
          hint: "Tu pourras le changer plus tard."
