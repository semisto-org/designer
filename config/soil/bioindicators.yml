# Bio-indicator plants of Belgian soils: what a plant growing wild on a plot
# says about its soil. One plant alone proves nothing; look for groups of
# plants that point the same way.
#
# `indicates` uses the keys of fr.soil.indicators in config/locales/soil_photos.fr.yml:
# compaction, waterlogging, acidic, calcareous, nitrogen_rich, nitrogen_poor,
# disturbed, dry, fertile, trampled.
#
# Every claim has its own `evidence`: `status` sourced (an open dataset
# supports it) or to_verify (no open dataset covers it, e.g. compaction),
# the `refs` (keys of `sources`) and the figures it rests on. `values` keeps
# the raw figures read on 2026-10-04 (EIVE niche positions 0-10, Ellenberg
# 1991 classes 1-9 with x = indifferent, Midolo soil disturbance 0-1).
#
# Thresholds, on EIVE's 0-10 scale, calibrated on Ellenberg's classes (the
# median EIVE value of each Ellenberg class, cut halfway between classes):
#   nitrogen_rich, fertile  N >= 6.6 (Ellenberg >= 7)
#   nitrogen_poor           N <= 3.7 (Ellenberg <= 3)
#   acidic                  R <= 3.6 (Ellenberg <= 3)
#   calcareous              R >= 7.25 (Ellenberg >= 8), or the best habitat calcareous
#   waterlogging            M >= 6.05 (Ellenberg >= 8), or diagnostic of wet pastures (EUNIS R36)
#   dry                     M <= 3.3, or Ellenberg <= 3, or the best habitat dry (EUNIS R1A)
#   disturbed               Midolo soil disturbance in the top 10 % (>= 0.39), or >= 0.25 for arable weeds
#   trampled                diagnostic of trampled grassland (EUNIS V35/V34, phi >= 20), or of
#                           grazed wet pastures (R36) with grazing pressure in the top quarter
# A claim one class short of its threshold was dropped (or, when nothing else
# supports the plant, the note says it is not specific).
sources:
  - key: eive
    short: "EIVE 1.0 (2023)"
    title: "Ecological Indicator Values for Europe (EIVE) 1.0"
    authors: "Dengler J., Jansen F., Chusova O. et al."
    year: 2023
    url: "https://doi.org/10.3897/VCS.98324"
    data: "https://doi.org/10.5281/zenodo.7534792"
    licence: "CC BY 4.0"
  - key: ellenberg_1991
    short: "Ellenberg (1991)"
    title: "Zeigerwerte von Pflanzen in Mitteleuropa (Scripta Geobotanica 18), valeurs lues dans les sources d'EIVE 1.0"
    authors: "Ellenberg H., Weber H.E., Düll R., Wirth V., Werner W., Paulißen D."
    year: 1991
    url: "https://doi.org/10.5281/zenodo.7534792"
    licence: "valeurs citées"
  - key: midolo_2023
    short: "Midolo et al. (2023)"
    title: "Disturbance indicator values for European plants"
    authors: "Midolo G., Herben T., Axmanová I. et al. (Global Ecology and Biogeography 32)"
    year: 2023
    url: "https://doi.org/10.1111/geb.13603"
    data: "https://doi.org/10.5281/zenodo.7116957"
    licence: "CC BY 4.0"
  - key: eunis_esy
    short: "EUNIS (Chytrý et al. 2020)"
    title: "EUNIS Habitat Classification: expert system and characteristic species combinations (version 2025-10-03)"
    authors: "Chytrý M., Tichý L., Hennekens S.M. et al. (Applied Vegetation Science 23)"
    year: 2020
    url: "https://doi.org/10.1111/avsc.12519"
    data: "https://doi.org/10.5281/zenodo.16895007"
    licence: "CC BY 4.0"
  - key: floraveg
    short: "FloraVeg.EU"
    title: "FloraVeg.EU, habitats R36 (pâtures humides : tassement par le bétail) et V35 (pelouses piétinées)"
    authors: "Chytrý M. et al."
    year: 2025
    url: "https://floraveg.eu/habitat/overview/R36"
    licence: "consulté, non repris"
  - key: ducerf
    short: "Ducerf (permaculture)"
    title: "L'encyclopédie des plantes bio-indicatrices alimentaires et médicinales (3 volumes)"
    authors: "Ducerf G."
    year: 2013
    url: null
    licence: "citée comme origine de l'indication, aucun texte repris"
