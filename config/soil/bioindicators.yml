    - compaction
    note: Sol riche en azote, fréquent dans les prairies pâturées et les pelouses piétinées, souvent tassées en surface. Sa racine pivotante descend profondément.
    evidence:
      nitrogen_rich:
        status: sourced
        refs:
        - eive
        - ellenberg_1991
        detail: EIVE N 6,7 (seuil 6,6) ; Ellenberg N 8
      compaction:
        status: to_verify
        refs:
        - eunis_esy
        - floraveg
        - ducerf
        detail: 'Aucune base ouverte ne mesure le tassement. Indice indirect : la plante caractérise des milieux piétinés ou pâturés où le sol est tassé en surface (EUNIS V35 ou R36).'
    values:
      eive:
        taxon: Taraxacum sect. Taraxacum
        M: 4.43
        N: 6.72
        R: 5.98
      ellenberg_1991:
        M: 5
        N: 8
        R: x
