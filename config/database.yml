# PostgreSQL with PostGIS. Each working directory (main checkout, worktree,
# agent clone) gets its own development and test databases, derived from its
# path, so parallel branches never share or corrupt a schema.
# DATABASE_URL (production) or DESIGNER_DATABASE (local override) win.
<% suffix = ENV.fetch("DESIGNER_DATABASE_SUFFIX") { require "digest"; Digest::SHA1.hexdigest(Rails.root.to_s)[0, 6] } %>
default: &default
  adapter: postgis
  encoding: unicode
  host: <%= ENV.fetch("PGHOST", "localhost") %>
  username: <%= ENV.fetch("PGUSER", "postgres") %>
  password: <%= ENV.fetch("PGPASSWORD", "postgres") %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  schema_search_path: public

development:
  <<: *default
  database: <%= ENV.fetch("DESIGNER_DATABASE") { "designer_development_#{suffix}" } %>

test:
  <<: *default
  database: <%= ENV.fetch("DESIGNER_TEST_DATABASE") { "designer_test_#{suffix}" } %><%= ENV["TEST_ENV_NUMBER"] %>

# Production: one PostgreSQL + PostGIS server, four databases (app, cache,
# queue, cable). Only DATABASE_URL is required, with the postgis:// scheme
# (postgis://user:password@host:5432/designer_production); the three other
# databases are derived from it unless set explicitly.
<% primary_url = ENV["DATABASE_URL"].to_s.sub(%r{\Apostgres(ql)?://}, "postgis://") %>
<% derived = ->(suffix) { primary_url.sub(%r{\Apostgis://}, "postgresql://").sub(%r{/([^/?]+)(\?|$)}, "/\\1_#{suffix}\\2") } %>
production:
  primary: &primary_production
    <<: *default
    url: <%= primary_url %>
  cache:
    <<: *primary_production
    adapter: postgresql
    url: <%= ENV["CACHE_DATABASE_URL"] || derived.call("cache") %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    adapter: postgresql
    url: <%= ENV["QUEUE_DATABASE_URL"] || derived.call("queue") %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    adapter: postgresql
    url: <%= ENV["CABLE_DATABASE_URL"] || derived.call("cable") %>
    migrations_paths: db/cable_migrate
