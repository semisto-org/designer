# Builds the phone app on Expo (EAS), started by hand from the Actions tab.
# Needs the repository secret EXPO_TOKEN (a robot token of the Expo
# organisation « semisto.org »). The first iOS build is made once from a computer
# (`eas build`), because Apple asks for its account and a two-factor code to
# create the signing certificate; later iOS builds reuse it from here.
# With the repository secret MOBILE_SENTRY_DSN (project « terranova-mobile »
# of the Sentry organisation marco-vespucci-sprl), builds report crashes.
name: Mobile build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS profile"
        type: choice
        options: [preview, simulator, testflight, production]
        default: preview
      platform:
        description: "Platform"
        type: choice
        options: [android, ios, all]
        default: android

concurrency:
  group: mobile-build-${{ inputs.profile }}-${{ inputs.platform }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Expo token is set
        run: test -n "$EXPO_TOKEN" || { echo "::error::Add the EXPO_TOKEN repository secret first."; exit 1; }

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install packages
        run: npm ci

      - name: Link the Expo project
        run: |
          if [ "$(jq -r '.expo.extra.eas.projectId // empty' app.json)" = "" ]; then
            npx --yes eas-cli@latest init --non-interactive --force
          fi

      # EAS builds read the project's EAS environment variables, not this
      # runner's: the DSN is copied there before each build, so changing the
      # secret is enough.
      - name: Give the build its Sentry DSN
        env:
          SENTRY_DSN: ${{ secrets.MOBILE_SENTRY_DSN }}
        run: |
          if [ -z "$SENTRY_DSN" ]; then
            echo "::warning::No MOBILE_SENTRY_DSN secret: this build will not report crashes."
            exit 0
          fi
          npx --yes eas-cli@latest env:set --name EXPO_PUBLIC_SENTRY_DSN --value "$SENTRY_DSN" \
            --environment production --environment preview --environment development \
            --visibility plaintext --scope project --non-interactive

      - name: Start the build
        env:
          PROFILE: ${{ inputs.profile }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          submit=""
          # Google Play takes the first upload of an app by hand, and EAS
          # needs a Play service account key to submit after that: Android
          # builds of these profiles are uploaded from the Play Console.
          if { [ "$PROFILE" = "testflight" ] || [ "$PROFILE" = "production" ]; } && [ "$PLATFORM" = "ios" ]; then submit="--auto-submit"; fi
          npx --yes eas-cli@latest build --profile "$PROFILE" --platform "$PLATFORM" \
            --non-interactive --no-wait $submit
