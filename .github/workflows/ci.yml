name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Lint Ruby
        run: bin/rubocop -f github

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Type-check
        run: npx tsc -p tsconfig.app.json

      - name: Unit tests (TypeScript)
        run: npm run test:frontend

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install packages
        run: npm ci

      - name: Strings and element library are up to date
        run: npm run locales -- --check

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci

  test_shard:
    name: test (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Two runners share the Ruby test files, so the suite (the longest job,
    # which production deploys wait for) takes about half the time.
    strategy:
      fail-fast: false
      matrix:
        shard: [ 0, 1 ]

    steps:
      # PostGIS is pulled and started in the background while the next steps
      # install packages, Ruby and Node. As a service container, its pull ran
      # before every other step and added ~20 s to the job.
      - name: Start PostGIS
        run: |
          nohup docker run --detach --name postgis --publish 5432:5432 \
            --env POSTGRES_USER=postgres --env POSTGRES_PASSWORD=postgres \
            postgis/postgis:16-3.4 > "$RUNNER_TEMP/postgis.log" 2>&1 &

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips libheif-plugin-libde265 libgeos-dev

      - name: Checkout code
        uses: actions/checkout@v6

      # The rgeo gem compiles its GEOS extension only when libgeos-dev is
      # present, which is the case in this job alone: its own cache key keeps
      # it from restoring a bundle built by the jobs above.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: geos

      - name: Check RGeo has GEOS
        run: bundle exec ruby -e 'require "rgeo"; abort "RGeo was built without GEOS" unless RGeo::Geos.capi_supported?'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript packages
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # The image's init script starts a temporary server on the Unix socket
      # only, then the real one on TCP: waiting on TCP waits for the latter.
      - name: Wait for PostGIS
        run: |
          for i in $(seq 1 90); do
            docker exec postgis pg_isready --host 127.0.0.1 --username postgres > /dev/null 2>&1 && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/postgis.log"; docker logs postgis || true
          exit 1

      - name: Run tests
        env:
          RAILS_ENV: test
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          SHARD: ${{ matrix.shard }}
          SHARDS: 2
        run: |
          files=$(find test -name '*_test.rb' -not -path 'test/frontend/*' | sort | awk -v shard="$SHARD" -v shards="$SHARDS" '(NR - 1) % shards == shard')
          bin/rails db:test:prepare
          bin/rails test $files

  # Keeps a single « test » check (the one branch rules and readers know),
  # green only when every shard is.
  test:
    if: always()
    needs: test_shard
    runs-on: ubuntu-latest
    steps:
      - name: All test shards passed
        run: test "${{ needs.test_shard.result }}" = "success"
