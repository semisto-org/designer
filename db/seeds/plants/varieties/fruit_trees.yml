# What old fruit varieties are good for and when they keep, read on
# 2026-10-17 for the conservatory orchard of Les 4 Sources (map n° 1).
# Facts only (uses, months), each citing the reference it comes from; no
# text copied. Loaded by db/seeds/10_plants.rb with
# Catalog::VarietyUsesLoader, source « semisto », status « to_verify ».
#
# The CRA-W tables (M. Lateur, 2013, « Aide au choix ») give one range from
# picking to the end of keeping in a good cellar: there eating_from_month is
# the picking month. Uses: a CRA-W column rated « + » or better, or a use
# the reference names. Left out for lack of a reference: Buchet, Reinette du
# Portugal, Semis d'Italie Druez, Moreau, Côtelée Nisole, Tête de Cheval,
# Mentine Rolain, Verte Huet, Norman's Pippin; pears Poire de Brûlée and
# Bergamote Henin.

