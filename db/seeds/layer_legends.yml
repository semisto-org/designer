france:
  ombrage:
    gradient:
      colors: ["#3c3c3c", "#9a9a9a", "#f2f2f2"]
      labels: ["Ombre", "Lumière"]
    note: "Le sol nu éclairé par un soleil rasant : talus, fossés et anciennes terrasses ressortent."
  courbes:
    items:
      - { label: "Courbe de niveau", color: "#d4937d", shape: line }
      - { label: "Courbe maîtresse, avec son altitude", color: "#cc8066", shape: line }
    note: "Plus les lignes sont serrées, plus la pente est forte."
  pentes:
    items:
      - { label: "Pente de plus de 10 %", color: "#d90115" }
    note: "Seules les pentes de plus de 10 % sont colorées ; le reste du terrain est plus doux."
  cours_eau:
    items:
      - { label: "Cours d'eau, fossé, plan d'eau", color: "#8fc1dd", shape: line }
  cadastre:
    items:
      - { label: "Parcelle", color: "#ffe5cc", stroke: "#ff8000" }
      - { label: "Bâtiment", color: "#9447ff", shape: hatch }
      - { label: "Limite de section", color: "#a9a9a9", shape: line }
    note: "Touche une parcelle pour lire son numéro."
  natura2000:
    items:
      - { label: "Site pour les habitats (ZSC, SIC)", color: "#e4dec4", stroke: "#d4b01c" }
      - { label: "Site pour les oiseaux (ZPS)", color: "#dce2c6", stroke: "#a7c827" }
    note: "Des règles particulières peuvent s'y appliquer : renseigne-toi avant de planter ou de creuser."
  znieff:
    items:
      - { label: "ZNIEFF de type I : secteur de grand intérêt", color: "#bfd7c3", stroke: "#008714" }
      - { label: "ZNIEFF de type II : grand ensemble naturel", color: "#d7e3d7", stroke: "#8acd87" }
    note: "Un inventaire du patrimoine naturel : pas une protection, mais un signal à prendre en compte."

