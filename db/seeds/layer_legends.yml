# Legends of the region data layers, by region key then layer key, stored
# in the layer's `options.legend` by the catalogue seeds (02 to 05). Read from each
# service's own legend on 2026-10-09 (ArcGIS REST /legend, WMS
# GetLegendGraphic, IGN legend images), relabelled in plain French.
#
# A legend has any of:
# - gradient: { colors: [low … high], labels: [evenly spaced under the bar] }
# - items: [{ label, color, stroke?, shape? }] or [{ heading }]
#   shape: fill (default), line, dashed, outline, hatch, split (two colours,
#   `color` and `stroke`), point
# - note: one sentence on how to read the layer
# A layer without one falls back to its `legend_url` image.

europe:
  natura2000:
    items:
      - { label: "Site pour les habitats et les espèces", color: "#a7adf2", shape: hatch }
      - { label: "Site pour les oiseaux", color: "#e88281", shape: hatch }
      - { label: "Site pour les deux", color: "#a7adf2", stroke: "#e88281", shape: split }
    note: "Des règles particulières peuvent s'y appliquer : renseigne-toi avant de planter ou de creuser."
  corine:
    items:
      - heading: "Territoires artificialisés"
      - { label: "Tissu urbain continu", color: "#e6004d" }
      - { label: "Tissu urbain discontinu", color: "#ff0000" }
      - { label: "Zones industrielles ou commerciales", color: "#cc4df2" }
      - { label: "Routes, voies ferrées et abords", color: "#cc0000" }
      - { label: "Zones portuaires", color: "#e6cccc" }
      - { label: "Aéroports", color: "#e6cce6" }
      - { label: "Extraction de matériaux", color: "#a600cc" }
      - { label: "Décharges", color: "#a64d00" }
      - { label: "Chantiers", color: "#ff4dff" }
      - { label: "Espaces verts urbains", color: "#ffa6ff" }
      - { label: "Équipements sportifs et de loisirs", color: "#ffe6ff" }
      - heading: "Territoires agricoles"
      - { label: "Terres arables", color: "#ffffa8" }
      - { label: "Terres irriguées en permanence", color: "#ffff00" }
      - { label: "Rizières", color: "#e6e600" }
      - { label: "Vignobles", color: "#e68000" }
      - { label: "Vergers et petits fruits", color: "#f2a64d" }
      - { label: "Oliveraies", color: "#e6a600" }
      - { label: "Prairies", color: "#e6e64d" }
      - { label: "Cultures annuelles et permanentes mêlées", color: "#ffe6a6" }
      - { label: "Parcellaire agricole complexe", color: "#ffe64d" }
      - { label: "Agriculture et espaces naturels mêlés", color: "#e6cc4d" }
      - { label: "Territoires agroforestiers", color: "#f2cca6" }
      - heading: "Forêts et milieux semi-naturels"
      - { label: "Forêts de feuillus", color: "#80ff00" }
      - { label: "Forêts de conifères", color: "#00a600" }
      - { label: "Forêts mélangées", color: "#4dff00" }
      - { label: "Pelouses et pâturages naturels", color: "#ccf24d" }
      - { label: "Landes et broussailles", color: "#a6ff80" }
      - { label: "Végétation sclérophylle", color: "#a6e64d" }
      - { label: "Forêt et broussailles en mutation", color: "#a6f200" }
      - { label: "Plages, dunes et sable", color: "#e6e6e6" }
      - { label: "Roches nues", color: "#cccccc" }
      - { label: "Végétation clairsemée", color: "#ccffcc" }
      - { label: "Zones incendiées", color: "#000000" }
      - { label: "Glaciers et neiges éternelles", color: "#a6e6cc" }
      - heading: "Zones humides et eau"
      - { label: "Marais intérieurs", color: "#a6a6ff" }
      - { label: "Tourbières", color: "#4d4dff" }
      - { label: "Marais maritimes", color: "#ccccff" }
      - { label: "Marais salants", color: "#e6e6ff" }
      - { label: "Zones intertidales", color: "#a6a6e6" }
      - { label: "Cours d'eau", color: "#00ccf2" }
      - { label: "Plans d'eau", color: "#80f2e6" }
      - { label: "Lagunes littorales", color: "#00ffa6" }
      - { label: "Estuaires", color: "#a6ffe6" }
      - { label: "Mers et océans", color: "#e6f2ff" }
    note: "Une vue d'ensemble par unités de 25 ha au moins : ton terrain peut être plus varié que sa couleur."
  sol_ph:
    # SoilGrids stores pH × 10; colours of its classes at pH 4, 4.5 … 9.
    gradient:
      colors: ["#f0f63d", "#f0f63d", "#f1ee2d", "#c0df28", "#72c94c", "#42b532", "#35a536", "#2f993f", "#36b993", "#1bc1c7", "#0fccd9"]
      labels: ["pH 4", "5", "6", "7", "8", "9"]
    note: "Sous 5,5, le sol est acide ; entre 6 et 7, la plupart des fruitiers s'y plaisent ; au-dessus de 7,5, il est souvent calcaire. Rien sous les zones bâties ; seule une analyse dit le pH de ton sol."
  sol_argile:
    # SoilGrids stores clay in g/kg; colours at 0, 10 … 80 %.
    gradient:
      colors: ["#f2dac1", "#e7c4a0", "#d8a775", "#c98c50", "#b97e44", "#a87038", "#97612c", "#875320", "#764615"]
      labels: ["0 %", "20 %", "40 %", "60 %", "80 %"]
    note: "Peu d'argile : un sol léger qui se draine vite. Au-delà de 30 % environ : un sol lourd qui garde l'eau et colle quand il est mouillé. Rien sous les zones bâties."

wallonia:
  courbes:
    items:
      - { label: "Tous les 50 m", color: "#a47916", shape: line }
      - { label: "Tous les 10 m", color: "#dda840", shape: line }
      - { label: "Courbes intermédiaires", color: "#dda840", shape: dashed }
    note: "Plus les lignes sont serrées, plus la pente est forte. Touche la carte pour lire l'altitude exacte."
  pentes:
    gradient:
      colors: ["#70b1c4", "#98c2b5", "#b7d5a5", "#d3e793", "#effa7e", "#f6db69", "#f9b755", "#f9923e", "#f5682d", "#f02b20"]
      labels: ["Plat", "Très pentu"]
    note: "Touche la carte pour lire la pente exacte, en pour cent."
  ruissellement:
    items:
      - heading: "Ruissellement, selon la surface qui s'écoule en amont"
      - { label: "3 à 10 ha", color: "#ffaa00", shape: line }
      - { label: "10 à 20 ha", color: "#c500ff", shape: line }
      - { label: "20 à 50 ha", color: "#ff0000", shape: line }
      - { label: "50 à 100 ha", color: "#a80000", shape: line }
      - { label: "Plus de 100 ha", color: "#894444", shape: line }
      - { label: "Cuvette où l'eau s'accumule", color: "#ffffff", stroke: "#17a8e8", shape: outline }
      - heading: "Cours d'eau"
      - { label: "Navigable", color: "#004da8", shape: line }
      - { label: "1re catégorie", color: "#005ce6", shape: line }
      - { label: "2e catégorie", color: "#73b2ff", shape: line }
      - { label: "3e catégorie", color: "#73dfff", shape: line }
      - { label: "Non classé", color: "#bed2ff", shape: line }
      - { label: "Zone complexe", color: "#9c9c9c" }
    note: "Un axe de ruissellement montre où l'eau de pluie se concentre : un bon endroit pour la ralentir et l'infiltrer."
  sols:
    items:
      - { label: "Limite entre deux types de sol", color: "#e69800", shape: outline }
      - { label: "Ravin", color: "#000000", shape: line }
    note: "Chaque zone est un type de sol. Touche la carte pour lire son sigle, son drainage et sa charge caillouteuse."
  essences:
    items:
      - heading: "Eau disponible pour les racines"
      - { label: "Marécageux (−4)", color: "#002673" }
      - { label: "Humide (−3)", color: "#0084a8" }
      - { label: "Humide (−2)", color: "#73dfff" }
      - { label: "Frais (−1)", color: "#bee8ff" }
      - { label: "Frais (0)", color: "#267300" }
      - { label: "Ni sec ni humide (1)", color: "#3aa800" }
      - { label: "Ni sec ni humide (2)", color: "#4ce600" }
      - { label: "Plutôt sec (3)", color: "#b0f045" }
      - { label: "Sec (4)", color: "#ffff00" }
      - { label: "Très sec (5)", color: "#ffaa00" }
      - heading: "Humide en hiver, sec en été"
      - { label: "Faiblement (−1)", color: "#ffbee8" }
      - { label: "Moyennement (−2)", color: "#c500ff" }
      - { label: "Fortement (−3)", color: "#4c0073" }
    note: "Le niveau hydrique du sol, du plus humide au plus sec. Touche la carte pour lire aussi sa richesse et le climat local."
  cadastre:
    items:
      - { label: "Limite de parcelle", color: "#730000", shape: outline }
